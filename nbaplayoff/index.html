<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NBA Playoffs 2025</title>
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="NBA Playoffs 2025">
  <meta name="theme-color" content="#090b13">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    @keyframes live-pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.45; }
    }
    @keyframes card-glow {
      0%, 100% { box-shadow: 0 0 0 1px #1e5c1e, 0 0 10px rgba(40,160,40,0.15); }
      50%       { box-shadow: 0 0 0 1px #2d8a2d, 0 0 18px rgba(40,160,40,0.35); }
    }
    @keyframes fade-in {
      from { opacity: 0; transform: translateY(4px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    body {
      background: #0d0d0d;
      color: #e0e0e0;
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 13px 24px;
      background: #101010;
      position: relative;
    }

    /* gradient underline — red through center */
    header::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg,
        transparent 0%, #3a0a0a 20%, #c8102e 50%, #3a0a0a 80%, transparent 100%);
    }

    header h1 {
      font-family: 'Barlow Condensed', 'Segoe UI', sans-serif;
      font-size: 1.55rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      color: #fff;
      text-transform: uppercase;
      line-height: 1;
    }

    header h1 .nba   { color: #fff; }
    header h1 .word  { color: #c8102e; }
    header h1 .year  { color: #444; font-weight: 600; margin-left: 4px; }

    #status-wrap { text-align: right; }

    #status {
      font-size: 0.7rem;
      color: #555;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    #status.live {
      color: #4caf50;
      animation: live-pulse 1.8s ease-in-out infinite;
    }
    #status.error { color: #c8102e; }

    #last-updated {
      font-size: 0.65rem;
      color: #3a3a3a;
      margin-top: 3px;
    }

    /* ── Bracket layout ── */
    .bracket {
      overflow-x: hidden;
      padding: 24px 0 36px;
    }

    .bracket-row {
      display: flex;
      align-items: center;
      width: fit-content;
      margin: 0 auto;
      padding: 0 12px;
    }

    .conf-block {
      display: flex;
      align-items: center;
    }

    #west { flex-direction: row; }
    #east { flex-direction: row-reverse; }

    .round-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 118px;
    }

    .round-label {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.6rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: #333;
      text-transform: uppercase;
      margin-bottom: 8px;
      white-space: nowrap;
    }

    .round-slots {
      display: flex;
      flex-direction: column;
      width: 100%;
    }

    .slot {
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 1;
      padding: 5px 3px;
    }

    .r1-slots { min-height: 460px; }
    .r2-slots { min-height: 460px; }
    .cf-slots  { min-height: 460px; }

    .connector {
      width: 6px;
      flex-shrink: 0;
      align-self: stretch;
      position: relative;
    }
    /* thin vertical line through connectors */
    .connector::after {
      content: '';
      position: absolute;
      left: 50%; top: 8%; bottom: 8%;
      width: 1px;
      background: #1e1e1e;
      transform: translateX(-50%);
    }

    /* NBA Finals center column */
    .finals-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 130px;
      padding: 0 4px;
      gap: 6px;
    }

    .finals-label {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.6rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      color: #c8102e;
      text-transform: uppercase;
      opacity: 0.7;
    }

    .champion-text {
      font-size: 0.6rem;
      color: #c8a000;
      text-align: center;
      letter-spacing: 0.04em;
      min-height: 14px;
    }

    /* ── Matchup card ── */
    .matchup {
      background: #141414;
      border: 1px solid #252525;
      border-radius: 6px;
      overflow: hidden;
      width: 110px;
      cursor: default;
      transition: border-color 0.2s;
      box-shadow: 0 2px 8px rgba(0,0,0,0.5);
      animation: fade-in 0.3s ease both;
    }

    .matchup:hover { border-color: #333; }
    .matchup.live  {
      border-color: #1e5c1e;
      animation: fade-in 0.3s ease both, card-glow 2.2s ease-in-out infinite;
    }
    .matchup.tbd   { opacity: 0.28; box-shadow: none; }

    .team-row {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 5px 7px;
    }

    .team-row + .team-row {
      border-top: 1px solid #1e1e1e;
    }

    .team-row.winning {
      background: linear-gradient(90deg, rgba(255,255,255,0.04) 0%, transparent 100%);
    }
    .team-row.losing { opacity: 0.45; }

    img.logo {
      width: 16px;
      height: 16px;
      object-fit: contain;
      flex-shrink: 0;
    }

    .logo-placeholder {
      width: 16px;
      height: 16px;
      background: #222;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .abbr {
      font-size: 0.72rem;
      font-weight: 600;
      color: #ccc;
      flex: 1;
      letter-spacing: 0.01em;
    }

    .series-w {
      font-size: 0.68rem;
      font-weight: 700;
      color: #666;
      min-width: 10px;
      text-align: right;
    }

    .game-score {
      font-size: 0.72rem;
      font-weight: 700;
      color: #fff;
      min-width: 22px;
      text-align: right;
    }

    .series-bar {
      background: #0f0f0f;
      font-size: 0.55rem;
      color: #4a4a4a;
      text-align: center;
      padding: 3px 5px;
      letter-spacing: 0.03em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .series-bar.live-bar { color: #3d9e3d; background: #080e08; }
    .series-bar.over-bar { color: #555; }

    .next-game {
      font-size: 0.58rem;
      color: #686868;
      text-align: center;
      padding: 3px 6px 4px;
      background: #0b0b0b;
      border-top: 1px solid #1c1c1c;
      letter-spacing: 0.04em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ── Loading / error states ── */
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0d0d0d;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #2a2a2a;
      z-index: 10;
      animation: live-pulse 1.8s ease-in-out infinite;
    }

    #loading.hidden { display: none; }
  </style>
</head>
<body>

<header>
  <h1><img src="icon-192.png" height="17"><span class="nba">   NBA</span> <span class="word">Playoffs</span><span class="year">2025</span></h1>
  <div id="status-wrap">
    <div id="status">Loading…</div>
    <div id="last-updated"></div>
  </div>
</header>

<div id="loading">Fetching playoff data…</div>
<div class="bracket" id="bracket" style="display:none"></div>

<script>
/* ───────────────────────────────────────────────
   Config
─────────────────────────────────────────────── */
const SCOREBOARD = 'https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard';
const LOGO = id => `https://a.espncdn.com/i/teamlogos/nba/500/${id}.png`;

// How many days back to look for series data
const LOOKBACK_DAYS = 35;

let liveActive = false;
let refreshTimer = null;

/* ───────────────────────────────────────────────
   Data fetching
─────────────────────────────────────────────── */
function dateStr(daysAgo) {
  const d = new Date();
  d.setDate(d.getDate() - daysAgo);
  return d.toISOString().slice(0, 10).replace(/-/g, '');
}

async function safeJson(url) {
  try {
    const r = await fetch(url);
    if (!r.ok) return null;
    return r.json();
  } catch { return null; }
}

async function fetchAllSeries() {
  // Past LOOKBACK_DAYS for series/wins data; today + 7 ahead for upcoming game times
  const pastDates   = Array.from({ length: LOOKBACK_DAYS }, (_, i) => dateStr(i));
  const futureDates = Array.from({ length: 8 },  (_, i) => dateStr(-i)); // today through +7

  const [pastPages, futurePages] = await Promise.all([
    Promise.all(pastDates.map(d   => safeJson(`${SCOREBOARD}?dates=${d}`))),
    Promise.all(futureDates.map(d => safeJson(`${SCOREBOARD}?dates=${d}`))),
  ]);

  // seriesMap keyed by sorted team abbreviations
  const seriesMap = {};

  // ── Pass 1: build series from past data ──────────────────────────────
  for (const data of pastPages) {
    if (!data) continue;
    for (const ev of (data.events || [])) {
      const comp = ev.competitions?.[0];
      if (!comp) continue;
      const series = comp.series;
      if (!series || series.type !== 'playoff') continue;
      const headline = comp.notes?.[0]?.headline ?? '';
      if (!headline.match(/\d(?:st|nd|rd|th) Round|Semifinals|Conference Finals|NBA Finals/i)) continue;

      const gc = comp.competitors;
      if (!gc || gc.length < 2 || !gc[0].team || !gc[1].team) continue;

      const sc = series.competitors ?? [];
      const wins0 = sc[0]?.wins ?? 0;
      const wins1 = sc[1]?.wins ?? 0;
      const totalWins = wins0 + wins1;

      const a0 = gc[0].team.abbreviation;
      const a1 = gc[1].team.abbreviation;
      const key = [a0, a1].sort().join('|');

      if (!seriesMap[key] || totalWins > seriesMap[key].totalWins) {
        const confRaw = headline.toLowerCase();
        const conf = confRaw.startsWith('west') ? 'west' : confRaw.startsWith('east') ? 'east' : 'finals';
        const roundNum = headline.match(/(\d)(?:st|nd|rd|th) Round/i)?.[1]
          ? parseInt(headline.match(/(\d)(?:st|nd|rd|th) Round/i)[1])
          : headline.match(/Semifinals/i) ? 2
          : headline.match(/Conference Finals/i) ? 3
          : 4;

        seriesMap[key] = {
          key, totalWins, conf, round: roundNum,
          headline, summary: series.summary, completed: series.completed,
          teams: [
            { abbr: a0, id: gc[0].team.id, logo: gc[0].team.logo || LOGO(gc[0].team.id), name: gc[0].team.displayName },
            { abbr: a1, id: gc[1].team.id, logo: gc[1].team.logo || LOGO(gc[1].team.id), name: gc[1].team.displayName }
          ],
          wins: [wins0, wins1],
          nextGame: null,
        };
      }
    }
  }

  // ── Pass 2: find next scheduled game per series ───────────────────────
  for (const data of futurePages) {
    if (!data) continue;
    for (const ev of (data.events || [])) {
      const comp = ev.competitions?.[0];
      if (!comp) continue;
      if (comp.status?.type?.state !== 'pre') continue;
      const series = comp.series;
      if (!series || series.type !== 'playoff') continue;
      const headline = comp.notes?.[0]?.headline ?? '';
      if (!headline.match(/\d(?:st|nd|rd|th) Round|Semifinals|Conference Finals|NBA Finals/i)) continue;

      const gc = comp.competitors;
      if (!gc || gc.length < 2 || !gc[0].team || !gc[1].team) continue;

      const a0 = gc[0].team.abbreviation;
      const a1 = gc[1].team.abbreviation;
      const key = [a0, a1].sort().join('|');
      if (!seriesMap[key]) continue; // only annotate known series

      const gameDate = new Date(ev.date);
      const gameNumMatch = headline.match(/Game (\d+)/i);
      const gameLabel = gameNumMatch ? `Game ${gameNumMatch[1]}` : 'Next';

      // Keep the earliest upcoming game for this series
      if (!seriesMap[key].nextGame || gameDate < new Date(seriesMap[key].nextGame.date)) {
        seriesMap[key].nextGame = { date: ev.date, gameLabel };
      }
    }
  }

  return Object.values(seriesMap);
}

async function fetchLiveGames() {
  const data = await safeJson(SCOREBOARD);
  if (!data) return {};

  const liveMap = {}; // key: sorted abbr pair → live game info
  liveActive = false;

  for (const ev of (data.events || [])) {
    const comp = ev.competitions?.[0];
    if (!comp) continue;
    const state = comp.status?.type?.state;
    const gc = comp.competitors;
    if (!gc || gc.length < 2 || !gc[0].team || !gc[1].team) continue;

    const a0 = gc[0].team.abbreviation;
    const a1 = gc[1].team.abbreviation;
    const key = [a0, a1].sort().join('|');

    if (state === 'in') liveActive = true;

    liveMap[key] = {
      state,
      scores: [gc[0].score ?? '', gc[1].score ?? ''],
      abbrs: [a0, a1],
      clock: comp.status?.displayClock ?? '',
      period: comp.status?.period ?? 0,
    };
  }

  return liveMap;
}

/* ───────────────────────────────────────────────
   Rendering
─────────────────────────────────────────────── */
function periodLabel(p) {
  if (p <= 4) return `Q${p}`;
  return `OT${p - 4}`;
}

function formatNextGame(ng) {
  const d = new Date(ng.date);
  const now = new Date();
  const midnight = dt => new Date(dt.getFullYear(), dt.getMonth(), dt.getDate()).getTime();
  const diff = midnight(d) - midnight(now);
  const ONE_DAY = 86400000;

  // Short time: "7:30p" / "12:00p"
  let h = d.getHours(), m = d.getMinutes();
  const ampm = h >= 12 ? 'p' : 'a';
  h = h % 12 || 12;
  const timeStr = m === 0 ? `${h}${ampm}` : `${h}:${String(m).padStart(2,'0')}${ampm}`;

  let dayStr;
  if (diff === 0)            dayStr = 'Today';
  else if (diff === ONE_DAY) dayStr = 'Tmrw';
  else dayStr = d.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' });

  return `${ng.gameLabel} · ${dayStr} ${timeStr}`;
}

function buildMatchup(series, liveMap, isTbd = false) {
  if (isTbd || !series) {
    return `<div class="matchup tbd">
      <div class="team-row"><div class="logo-placeholder"></div><span class="abbr">TBD</span></div>
      <div class="team-row"><div class="logo-placeholder"></div><span class="abbr">TBD</span></div>
      <div class="series-bar">–</div>
    </div>`;
  }

  const live = liveMap[series.key];
  const isLive = live?.state === 'in';
  const isPost = live?.state === 'post';
  const showGameScore = isLive || isPost;

  const wins = series.wins.slice(); // [wins0, wins1]
  const needed = 4;
  const seriesOver = series.completed || wins[0] >= needed || wins[1] >= needed;

  // Determine winner/loser for dim styling
  let row0class = 'team-row';
  let row1class = 'team-row';

  if (seriesOver) {
    if (wins[0] > wins[1]) { row0class += ' winning'; row1class += ' losing'; }
    else if (wins[1] > wins[0]) { row1class += ' winning'; row0class += ' losing'; }
  } else if (isLive) {
    // Map live scores back to teams by abbreviation
    const liveScore0 = live.abbrs[0] === series.teams[0].abbr ? live.scores[0] : live.scores[1];
    const liveScore1 = live.abbrs[0] === series.teams[1].abbr ? live.scores[0] : live.scores[1];
    const s0 = parseInt(liveScore0) || 0;
    const s1 = parseInt(liveScore1) || 0;
    if (s0 > s1) row0class += ' winning';
    else if (s1 > s0) row1class += ' winning';
  }

  function teamRow(idx, rowClass) {
    const t = series.teams[idx];
    const w = wins[idx];
    let scoreHtml = '';

    if (showGameScore) {
      const liveScore = live.abbrs[0] === t.abbr ? live.scores[0] : live.scores[1];
      scoreHtml = `<span class="game-score">${liveScore}</span>`;
    }

    const winsHtml = `<span class="series-w">${w}</span>`;

    return `<div class="${rowClass}">
      <img class="logo" src="${t.logo}" alt="${t.abbr}" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'logo-placeholder'}))">
      <span class="abbr">${t.abbr}</span>
      ${winsHtml}
      ${scoreHtml}
    </div>`;
  }

  // Status bar
  let barClass = 'series-bar';
  let barText = series.summary ?? '–';

  if (isLive) {
    barClass = 'series-bar live-bar';
    barText = `LIVE · ${periodLabel(live.period)} ${live.clock}`;
  } else if (seriesOver) {
    barClass = 'series-bar over-bar';
  }

  const cardClass = isLive ? 'matchup live' : 'matchup';

  // Next scheduled game — show when series is ongoing and not currently live
  const nextGameHtml = (!isLive && !seriesOver && series.nextGame)
    ? `<div class="next-game">${formatNextGame(series.nextGame)}</div>`
    : '';

  return `<div class="${cardClass}">
    ${teamRow(0, row0class)}
    ${teamRow(1, row1class)}
    <div class="${barClass}">${barText}</div>
    ${nextGameHtml}
  </div>`;
}

function renderBracket(allSeries, liveMap) {
  // Group series
  const west = { r1: [], r2: [], cf: [] };
  const east = { r1: [], r2: [], cf: [] };
  let finals = null;

  for (const s of allSeries) {
    if (s.conf === 'finals' || s.round === 4) { finals = s; continue; }
    const bucket = s.conf === 'west' ? west : east;
    if (s.round === 1) bucket.r1.push(s);
    else if (s.round === 2) bucket.r2.push(s);
    else if (s.round === 3) bucket.cf.push(s);
  }

  function slots(arr, count, cls) {
    const items = [];
    for (let i = 0; i < count; i++) {
      const s = arr[i] ?? null;
      items.push(`<div class="slot">${buildMatchup(s, liveMap, s === null)}</div>`);
    }
    return `<div class="round-slots ${cls}">${items.join('')}</div>`;
  }

  function roundCol(label, arr, count, slotsCls) {
    return `<div class="round-col">
      <div class="round-label">${label}</div>
      ${slots(arr, count, slotsCls)}
    </div>`;
  }

  const westHtml = `<div class="conf-block" id="west">
    ${roundCol('1st Round', west.r1, 4, 'r1-slots')}
    <div class="connector"></div>
    ${roundCol('Semifinals', west.r2, 2, 'r2-slots')}
    <div class="connector"></div>
    ${roundCol('Conf Finals', west.cf, 1, 'cf-slots')}
    <div class="connector"></div>
  </div>`;

  const eastHtml = `<div class="conf-block" id="east">
    ${roundCol('1st Round', east.r1, 4, 'r1-slots')}
    <div class="connector"></div>
    ${roundCol('Semifinals', east.r2, 2, 'r2-slots')}
    <div class="connector"></div>
    ${roundCol('Conf Finals', east.cf, 1, 'cf-slots')}
    <div class="connector"></div>
  </div>`;

  // Champion badge
  let champText = '';
  if (finals?.completed || (finals && (finals.wins[0] >= 4 || finals.wins[1] >= 4))) {
    const wi = finals.wins[0] >= 4 ? 0 : 1;
    champText = `🏆 ${finals.teams[wi].name}`;
  }

  const finalsHtml = `<div class="finals-col">
    <div class="finals-label">NBA Finals</div>
    ${buildMatchup(finals, liveMap, finals === null)}
    <div class="champion-text">${champText}</div>
  </div>`;

  return `<div class="bracket-row">${westHtml}${finalsHtml}${eastHtml}</div>`;
}

/* ───────────────────────────────────────────────
   Main refresh loop
─────────────────────────────────────────────── */
async function refresh() {
  const statusEl = document.getElementById('status');
  const updatedEl = document.getElementById('last-updated');
  const bracketEl = document.getElementById('bracket');
  const loadingEl = document.getElementById('loading');

  try {
    const [allSeries, liveMap] = await Promise.all([fetchAllSeries(), fetchLiveGames()]);

    if (!allSeries.length) {
      statusEl.textContent = 'No playoff data found';
      statusEl.className = 'error';
      loadingEl.className = 'hidden';
      bracketEl.style.display = 'block';
      bracketEl.innerHTML = `<p style="color:#555;padding:40px;text-align:center">No playoff series found. ESPN may be returning no data right now.</p>`;
    } else {
      bracketEl.innerHTML = renderBracket(allSeries, liveMap);
      bracketEl.style.display = 'block';
      loadingEl.className = 'hidden';
      requestAnimationFrame(scaleBracket);
    }

    const now = new Date();
    updatedEl.textContent = `Updated ${now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' })}`;

    if (liveActive) {
      statusEl.textContent = '● LIVE';
      statusEl.className = 'live';
    } else {
      statusEl.textContent = 'No live games';
      statusEl.className = '';
    }
  } catch (err) {
    console.error(err);
    statusEl.textContent = 'Error loading data';
    statusEl.className = 'error';
  }

  if (refreshTimer) clearTimeout(refreshTimer);
  refreshTimer = setTimeout(refresh, liveActive ? 60_000 : 180_000);
}

function scaleBracket() {
  const bracketEl = document.getElementById('bracket');
  const row = bracketEl && bracketEl.querySelector('.bracket-row');
  if (!row) return;
  row.style.zoom = '';
  const naturalW = row.scrollWidth;
  const naturalH = row.scrollHeight;
  const availW   = bracketEl.clientWidth;
  const availH   = window.innerHeight - document.querySelector('header').offsetHeight;
  if (naturalW > 0 && naturalH > 0) {
    const scale = Math.min(availW / naturalW, availH / naturalH);
    row.style.zoom = scale.toFixed(4);
  }
}
window.addEventListener('resize', scaleBracket);

refresh();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}
</script>
</body>
</html>
