<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Page not found — Tim Allen</title>
  <link rel="icon" href="/favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --fg:     #1a1714;
      --accent: #b85c38;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      align-items: center;
      padding: 0 5vw;
      background: var(--fg);
      color: #fff;
      font-family: 'Inter', system-ui, sans-serif;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

    .eyebrow {
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.55);
      margin-bottom: 1.5rem;
    }

    h1 {
      font-family: 'DM Serif Display', Georgia, serif;
      font-style: italic;
      font-weight: 400;
      font-size: clamp(6rem, 24vw, 16rem);
      line-height: 0.88;
      letter-spacing: -0.035em;
      color: var(--accent);
      margin-bottom: 2rem;
    }

    p {
      font-family: 'DM Serif Display', Georgia, serif;
      font-style: italic;
      font-size: clamp(1.25rem, 3vw, 2rem);
      color: rgba(255,255,255,0.7);
      margin-bottom: 2.5rem;
    }

    a {
      display: inline-block;
      padding: 0.75rem 1.5rem;
      border: 1px solid rgba(255,255,255,0.2);
      color: rgba(255,255,255,0.85);
      font-size: 0.875rem;
      text-decoration: none;
      letter-spacing: 0.02em;
      transition: background 0.2s, border-color 0.2s, color 0.2s;
    }

    a:hover, a:focus-visible {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Tim Allen &middot; Art Director</div>
    <h1>404</h1>
    <p>This page wandered off.</p>
    <a href="/">&larr; Back to the portfolio</a>
  </main>
</body>
</html>
