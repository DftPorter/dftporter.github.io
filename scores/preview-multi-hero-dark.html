<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Score</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="The Score">
<meta name="theme-color" content="#08090d" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f5f3ef" media="(prefers-color-scheme: light)">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500&family=Barlow+Condensed:wght@300;400;600;700;900&family=Bebas+Neue&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--bg:#08090d;--surface:#0d1017;--line:rgba(255,255,255,.08);--text:#e8eaf0;--muted:#8a90a0;--muted-dim:#767d8c;}
  *{margin:0;padding:0;box-sizing:border-box;}
  .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
  body{background:var(--bg);color:var(--text);font-family:'Barlow Condensed',sans-serif;min-height:100vh;overflow-x:hidden;
    background-image:radial-gradient(rgba(255,255,255,.055) 1px,transparent 1px);background-size:4px 4px;}
  a{color:var(--text);text-decoration:none;}
  a:hover{color:#fff;}

  :focus-visible{outline:2px solid #7dd3fc;outline-offset:3px;border-radius:2px;}
  @media(prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;
      transition-duration:.001ms !important;}
    .dot{animation:none;}
  }

  @keyframes tsPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.55;transform:scale(1.25)}}
  @keyframes tsFlash{0%{box-shadow:inset 0 0 0 0 rgba(255,255,255,0)}25%{box-shadow:inset 0 0 60px 0 rgba(255,255,255,.35)}100%{box-shadow:inset 0 0 0 0 rgba(255,255,255,0)}}
  @keyframes tsRise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
  @keyframes tsShimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
  @keyframes tsSpin{to{transform:rotate(360deg)}}

  /* ── Header ── */
  header{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;
    padding:22px 32px 16px;border-bottom:1px solid rgba(255,255,255,.09);background:rgba(8,9,13,.86);}
  .wordmark{display:flex;align-items:baseline;gap:14px;}
  .wordmark img{height:38px;width:auto;align-self:center;flex-shrink:0;}
  .wordmark h1{font-family:'Bebas Neue',sans-serif;font-size:44px;line-height:.82;letter-spacing:.02em;color:#fff;font-weight:400;}
  .wordmark span{font-family:'Barlow Condensed',sans-serif;font-weight:300;font-size:15px;letter-spacing:.34em;
    text-transform:uppercase;color:var(--muted);}
  .header-right{display:flex;align-items:center;gap:18px;flex-wrap:wrap;}
  .status{display:flex;align-items:center;gap:8px;font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#9ca3af;}
  .dot{width:8px;height:8px;border-radius:50%;background:#22c55e;flex-shrink:0;animation:tsPulse 2s ease-in-out infinite;}
  .dot.loading{background:#fbbf24;}
  .dot.error{background:#f87171;animation:none;}
  .dot.idle{background:var(--muted);}
  .refresh-btn{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);color:#d1d5db;
    font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;
    padding:11px 16px;min-height:40px;border-radius:999px;cursor:pointer;display:flex;align-items:center;gap:6px;transition:background .15s,color .15s;}
  .refresh-btn:hover:not(:disabled){background:rgba(255,255,255,.12);color:#fff;}
  .refresh-btn:disabled{opacity:.4;cursor:not-allowed;}
  .refresh-btn.spinning .spin{display:inline-block;animation:tsSpin 1s linear infinite;}

  /* ── Hero (live game) ── */
  #hero-slot{display:flex;flex-direction:column;}
  .hero{position:relative;overflow:hidden;border-bottom:1px solid rgba(255,255,255,.12);
    background:linear-gradient(150deg,var(--team-color) 0%,color-mix(in srgb,var(--team-color) 42%,#08131a) 58%,#08131a 100%);}
  .hero::before{content:'';position:absolute;inset:0;pointer-events:none;
    background-image:radial-gradient(rgba(0,0,0,.28) 1.4px,transparent 1.4px);background-size:6px 6px;}
  .hero.flash{animation:tsFlash 1.2s ease-out;}
  .hero-top{position:relative;display:flex;align-items:center;justify-content:space-between;gap:24px;padding:14px 32px 0;}
  .hero-kicker{display:flex;align-items:center;gap:11px;font-family:'DM Mono',monospace;font-size:10.5px;
    letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.72);}
  .hero-kicker .dot{background:#fff;width:9px;height:9px;animation:tsPulse 1.8s ease-in-out infinite;}
  .hero-broadcast{font-family:'DM Mono',monospace;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
    color:rgba(255,255,255,.72);text-align:right;}
  .hero-grid{position:relative;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
    gap:clamp(12px,3vw,56px);padding:clamp(8px,2vh,26px) 32px clamp(2px,.6vh,8px);}
  .hero-side{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;}
  .hero-wm{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:var(--wm-size,min(52vh,460px));height:var(--wm-size,min(52vh,460px));
    opacity:.13;filter:grayscale(1) contrast(1.4);pointer-events:none;
    background-size:contain;background-repeat:no-repeat;background-position:center;}
  .hero-wm.lift{opacity:.3;mix-blend-mode:screen;filter:grayscale(1) contrast(1.4) brightness(2.6);}
  .hero-ticker{position:relative;padding:0 32px 16px;font-family:'Barlow Condensed',sans-serif;font-weight:500;
    font-size:14px;line-height:1.35;color:rgba(255,255,255,.8);text-align:center;}
  .hero-ticker b{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.14em;color:#fff;font-weight:600;}
  .hero-ticker-sep{margin:0 12px;color:rgba(255,255,255,.4);}
  .hero-ticker-item{display:inline;}
  .hero-abbr{position:relative;font-family:'Bebas Neue',sans-serif;font-size:clamp(30px,4.4vw,58px);
    line-height:1;letter-spacing:.07em;color:rgba(255,255,255,.82);}
  .hero-score{position:relative;text-align:center;font-family:'Bebas Neue',sans-serif;font-size:clamp(96px,16.5vw,220px);
    line-height:.86;font-variant-numeric:tabular-nums;color:rgba(255,255,255,.72);text-shadow:0 6px 40px rgba(0,0,0,.45);}
  .hero-score.leading{color:#fff;}
  .hero-record{position:relative;font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.14em;color:rgba(255,255,255,.68);}
  .hero-vs{display:flex;flex-direction:column;align-items:center;gap:9px;}
  .hero-rule{width:1px;height:clamp(40px,9vh,110px);background:rgba(255,255,255,.22);}
  .hero-vs span{font-family:'DM Mono',monospace;font-size:10.5px;letter-spacing:.18em;color:rgba(255,255,255,.65);text-transform:uppercase;}
  .hero-vs.countdown-done span{display:none;}
  .hero-countdown{font-family:'Bebas Neue',sans-serif;font-size:clamp(64px,10vw,140px);line-height:.9;
    letter-spacing:.03em;color:#fff;font-variant-numeric:tabular-nums;text-shadow:0 6px 40px rgba(0,0,0,.45);}
  .hero-foot{position:relative;display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;padding:0 32px 6px;}
  .hero:not(:has(.hero-ticker)) .hero-foot{padding-bottom:20px;}
  .hero-clock{font-family:'Bebas Neue',sans-serif;font-size:clamp(22px,2.6vw,34px);letter-spacing:.08em;color:#fff;}
  .hero-foot .sep{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.35);flex-shrink:0;}
  .hero-situation{font-family:'DM Mono',monospace;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;
    color:rgba(255,255,255,.7);text-align:center;}

  /* ── Cards ── */
  main{padding:24px 32px 8px;display:flex;flex-wrap:wrap;justify-content:center;column-gap:14px;row-gap:13px;align-items:stretch;}
  .card{position:relative;overflow:hidden;flex:0 1 calc((100% - (var(--cols,4) - 1) * 14px) / var(--cols,4));
    min-width:232px;display:flex;flex-direction:column;
    background:linear-gradient(160deg,color-mix(in srgb,var(--team-color) var(--tint,12%),transparent),#0d1017 62%);
    border:1px solid var(--line);border-radius:3px;padding:15px 16px 14px;animation:tsRise .45s ease both;}
  /* Off-season: color drains out — there's no game to point the team color at.
     Within 30 days of the opener it returns (.soon) to build anticipation. */
  .card.off{background:linear-gradient(160deg,rgba(255,255,255,.03),#0d1017 62%);border-color:rgba(255,255,255,.06);}
  .card.off.soon{background:linear-gradient(160deg,color-mix(in srgb,var(--team-color) var(--tint,12%),transparent),#0d1017 62%);}
  .card.off .card-spine{background:var(--muted-dim);}
  .card.off .card-count b{color:var(--muted-dim);}
  .card.off .card-foot-label{color:var(--muted-dim);}
  .card.off.soon .card-spine{background:var(--team-color);}
  .card.off.soon .card-count b{color:var(--team-color);}
  .card.off.soon .card-foot-label{color:color-mix(in srgb,var(--team-color) 62%,#fff);}
  /* Eagles' and Union's brand colors are low-chroma and wash out at the same mix
     percentage that reads clearly for the vivid Sixers/Flyers/Phillies hues — boost
     them so every card carries equal visual weight. */
  [data-team=eagles]{--tint:26%;}
  [data-team=union]{--tint:30%;}
  /* In season but idle: same footprint, keeps color, just dimmer. */
  .card.idle{background:linear-gradient(160deg,color-mix(in srgb,var(--team-color) calc(var(--tint,12%) * .55),transparent),#0d1017 62%);border-color:rgba(255,255,255,.06);}
  .card.idle .card-spine,.card.off .card-spine{width:2px;opacity:.55;}
  .card.idle .card-wm,.card.off .card-wm{opacity:calc(.05 * var(--wm,1));}
  .card.idle .card-wm.lift,.card.off .card-wm.lift{opacity:calc(.09 * var(--wm,1));}
  .card.idle .card-name,.card.off .card-name{color:#c9cdd7;}
  .card.flash{animation:tsFlash 1.2s ease-out;}
  main.no-hero .card{padding:19px 20px 17px;}
  /* Per-logo weight: ESPN's marks differ wildly in ink coverage and contrast,
     so a single opacity reads unevenly. --wm calibrates each to the same
     apparent strength. */
  .card-wm{position:absolute;right:-26px;bottom:-30px;width:150px;height:150px;opacity:calc(.1 * var(--wm,1));
    filter:grayscale(1) contrast(1.4);pointer-events:none;
    background-size:contain;background-repeat:no-repeat;background-position:center;}
  .card-wm.lift{opacity:calc(.2 * var(--wm,1));filter:grayscale(1) contrast(1.4) brightness(2.6);}
  [data-team=eagles]{--wm:1.7;}
  [data-team=flyers]{--wm:1.6;}
  [data-team=union]{--wm:1.4;}
  [data-team=sixers]{--wm:.85;}
  [data-team=phillies]{--wm:.65;}
  .card-spine{position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--team-color);}
  .card-head{position:relative;display:flex;align-items:baseline;justify-content:space-between;gap:8px;min-height:27px;}
  .card-name{font-family:'Bebas Neue',sans-serif;font-size:27px;line-height:1;letter-spacing:.04em;color:#fff;}
  .card-sport{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.16em;color:var(--muted);}
  .card-meta{position:relative;display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:17px;margin-top:9px;}
  .card-meta-text{display:flex;align-items:baseline;gap:7px;font-family:'DM Mono',monospace;font-size:11px;
    letter-spacing:.1em;text-transform:uppercase;}
  .card-record{color:#e2e5ea;font-variant-numeric:tabular-nums;}
  .card-place{color:#8b90a0;}
  .card-offlabel{color:var(--muted);letter-spacing:.2em;}
  .pill{font-family:'DM Mono',monospace;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;
    white-space:nowrap;color:color-mix(in srgb,var(--team-color) 62%,#fff);padding:0 0 2px 0;
    border-bottom:2px solid color-mix(in srgb,var(--team-color) 70%,transparent);}
  .form{display:flex;align-items:center;gap:3px;flex-shrink:0;}
  .form i{display:block;width:10px;height:3px;background:#4a5060;}
  .form i.fw{background:rgba(74,222,128,.7);}
  .form i.fl{background:rgba(248,113,113,.65);}
  .form i.fd{background:rgba(251,191,36,.65);}
  .form i.cur{height:5px;}
  .form i.cur.fw{background:#4ade80;}
  .form i.cur.fl{background:#f87171;}
  .form i.cur.fd{background:#fbbf24;}
  .card-body{position:relative;flex:1;display:flex;flex-direction:column;justify-content:flex-end;min-height:70px;margin-top:12px;}
  main.no-hero .card-body{min-height:88px;}
  .card-scoreline{display:flex;align-items:flex-end;gap:10px;}
  .card-score{font-family:'Bebas Neue',sans-serif;font-size:38px;line-height:.9;letter-spacing:.02em;color:#fff;font-variant-numeric:tabular-nums;}
  main.no-hero .card-score{font-size:50px;}
  .card-result{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:.06em;padding-bottom:4px;}
  .card-result.w{color:#4ade80;}.card-result.l{color:#f87171;}.card-result.d{color:#fbbf24;}
  .card-scoreline.aged{opacity:.5;}
  .card-last{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:13px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--muted);margin-top:2px;}
  .card-count{display:flex;align-items:baseline;gap:9px;}
  .card-count b{font-family:'Bebas Neue',sans-serif;font-size:50px;line-height:.82;letter-spacing:.01em;
    font-weight:400;font-variant-numeric:tabular-nums;color:var(--team-color);}
  main.no-hero .card-count b{font-size:64px;}
  .card-count span{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:14px;letter-spacing:.14em;
    text-transform:uppercase;color:#8b90a0;padding-bottom:5px;}
  .card-foot{position:relative;display:flex;align-items:center;gap:8px;margin-top:14px;padding-top:11px;border-top:1px solid rgba(255,255,255,.07);}
  .card-foot-label{flex-shrink:0;}
  .card-foot-text{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .card-foot-label{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:13px;letter-spacing:.1em;
    text-transform:uppercase;color:color-mix(in srgb,var(--team-color) 62%,#fff);}
  .card-foot-text{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:13px;letter-spacing:.1em;
    text-transform:uppercase;color:#d1d5db;}
  .soon-badge{font-family:'DM Mono',monospace;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;
    color:#fcd34d;padding:0 0 2px 0;border-bottom:2px solid rgba(252,211,77,.75);
    margin-left:8px;white-space:nowrap;flex-shrink:0;animation:tsSoon 2.4s ease-in-out infinite;}
  @keyframes tsSoon{0%,100%{opacity:1}50%{opacity:.55}}
  .today-badge{font-family:'DM Mono',monospace;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;
    color:#f59e0b;padding:0 0 2px 0;border-bottom:2px solid rgba(245,158,11,.7);
    margin-left:8px;white-space:nowrap;flex-shrink:0;}
  .bye-badge{font-family:'DM Mono',monospace;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--muted-dim);padding:0 0 2px 0;border-bottom:2px solid rgba(255,255,255,.18);
    margin-right:7px;white-space:nowrap;}

  /* ── Off-season collapse strip ── */
  .collapse{margin:10px 32px 0;padding:15px 18px 4px;border:1px solid rgba(255,255,255,.06);border-radius:3px;
    background:linear-gradient(160deg,rgba(255,255,255,.03),#0b0e14 70%);animation:tsRise .45s ease both;}
  .collapse-head{display:flex;align-items:center;gap:10px;padding-bottom:11px;border-bottom:1px solid rgba(255,255,255,.07);}
  .collapse-head b{font-family:'DM Mono',monospace;font-size:10px;font-weight:400;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);}
  .collapse-head span{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:13px;letter-spacing:.08em;
    text-transform:uppercase;color:var(--muted-dim);}
  .collapse-rows{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));column-gap:26px;}
  .collapse-row{display:flex;align-items:baseline;gap:10px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.04);}
  .collapse-row .cdot{width:7px;height:7px;border-radius:50%;background:var(--team-color);flex-shrink:0;}
  .collapse-row .cname{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:.04em;color:#d5d8e0;}
  .collapse-row .csport{font-family:'DM Mono',monospace;font-size:9.5px;letter-spacing:.16em;color:var(--muted-dim);}
  .collapse-row .cspacer{flex:1;}
  .collapse-row .cdays{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:.02em;
    font-variant-numeric:tabular-nums;color:var(--team-color);}
  .collapse-row .copen{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:13px;letter-spacing:.06em;
    text-transform:uppercase;color:var(--muted);white-space:nowrap;}

  /* ── Wire ── */
  .wire{display:flex;align-items:stretch;margin:16px 32px 0;overflow:hidden;
    border-top:1px solid rgba(255,255,255,.09);border-bottom:1px solid rgba(255,255,255,.09);}
  .wire-label{display:flex;align-items:center;padding:0 16px;font-family:'DM Mono',monospace;font-size:10px;
    letter-spacing:.2em;text-transform:uppercase;color:var(--muted);white-space:nowrap;
    border-right:1px solid rgba(255,255,255,.09);}
  .wire-grid{display:flex;flex-wrap:nowrap;overflow-x:auto;flex:1;scrollbar-width:none;scroll-behavior:smooth;scroll-snap-type:x mandatory;}
  .wire-grid::-webkit-scrollbar{display:none;}
  .wire-item{position:relative;display:flex;align-items:center;gap:16px;padding:14px 22px;border-left:1px solid rgba(255,255,255,.06);transition:background .15s;flex:0 0 100%;scroll-snap-align:start;min-width:0;
    background:linear-gradient(90deg,color-mix(in srgb,var(--tag,#fff) 13%,transparent),transparent 42%);}
  .wire-item::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--tag,#fff);}
  .wire-logo{flex:0 0 52px;width:52px;height:52px;background-size:contain;background-position:center;background-repeat:no-repeat;}
  .wire-item-text{display:flex;flex-direction:column;gap:6px;min-width:0;}
  .wire-nav{display:flex;align-items:center;justify-content:center;flex:0 0 34px;background:none;border:0;border-left:1px solid rgba(255,255,255,.09);
    color:var(--muted);cursor:pointer;transition:color .15s,background .15s;}
  .wire-nav:hover{color:var(--text);background:rgba(255,255,255,.04);}
  .wire-nav:disabled{opacity:.25;cursor:default;}
  .wire-nav:disabled:hover{background:none;}
  .wire-nav svg{width:14px;height:14px;}
  .wire-item:hover{background:rgba(255,255,255,.04);}
  .wire-title{font-family:'Barlow',sans-serif;font-weight:500;font-size:19px;line-height:1.4;color:#d5d8e0;text-wrap:pretty;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .wire-meta{display:flex;align-items:center;gap:8px;}
  .wire-tag{font-family:'DM Mono',monospace;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;
    padding:0 0 2px 0;border-bottom:2px solid;color:color-mix(in srgb,var(--tag,#fff) 62%,#fff);}
  .wire-time{font-family:'DM Mono',monospace;font-size:10px;color:var(--muted);}
  .wire-retry{background:none;border:none;padding:0;cursor:pointer;font:inherit;color:var(--text);
    text-decoration:underline;text-underline-offset:3px;}
  .wire-retry:hover{color:#fff;}
  .wire-loading{padding:20px;font-family:'DM Mono',monospace;font-size:11px;color:var(--muted-dim);text-align:center;}

  /* ── Errors, skeletons, footer ── */
  #error-banner{display:none;margin:14px 32px 0;}
  #error-banner-inner{background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.25);border-radius:3px;
    padding:13px 16px;font-family:'DM Mono',monospace;font-size:11.5px;color:#fca5a5;letter-spacing:.04em;}
  .sk-card{background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:19px 20px 17px;
    display:flex;flex-direction:column;gap:12px;}
  .sk{background:linear-gradient(90deg,#141821 25%,#1e2430 50%,#141821 75%);background-size:200% 100%;
    animation:tsShimmer 1.5s infinite;border-radius:3px;height:13px;}
  footer{padding:16px 32px 26px;font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--muted);}
  footer a{color:inherit;text-decoration:underline;text-underline-offset:3px;}

  /* ── Phone ── */
  @media(max-width:560px){
    .hero-ticker{font-size:13px;padding:0 16px 14px;display:flex;flex-direction:column;gap:2px;}
    .hero-ticker-sep{display:none;}
    header{flex-direction:column;align-items:flex-start;gap:12px;padding:16px 16px 13px;}
    .wordmark h1{font-size:34px;}
    .wordmark img{height:30px;}
