<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Score</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="The Score">
<meta name="theme-color" content="#08090d" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f5f3ef" media="(prefers-color-scheme: light)">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500&family=Barlow+Condensed:wght@300;400;600;700;900&family=Bebas+Neue&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="light.css" media="(prefers-color-scheme: light)">
</head>
<body>
<header>
  <div class="wordmark">
    <img src="icon.png" alt="" aria-hidden="true">
    <h1>THE SCORE</h1>
    <span>Philadelphia</span>
  </div>
  <div class="header-right">
    <div class="status">
      <span class="dot" id="status-dot" aria-hidden="true"></span>
      <span id="update-time">Fetching scores…</span>
    </div>
    <div class="status">
      <span style="color:var(--muted)">Next refresh</span>
      <span id="countdown">5:00</span>
    </div>
    <button class="refresh-btn" id="refresh-btn" onclick="fetchScores()" aria-label="Refresh scores">
      <span class="spin" aria-hidden="true">&#8635;</span> Refresh
    </button>
  </div>
</header>

<div id="error-banner" role="alert"><div id="error-banner-inner"></div></div>
<div id="a11y-status" aria-live="polite" aria-atomic="true" class="sr-only"></div>

<div id="hero-slot"></div>
<main id="cards-container" aria-label="Team scores"></main>
<div id="collapse-slot"></div>
<section class="wire" id="wire" aria-label="News wire">
  <div class="wire-label">Wire</div>
  <div class="wire-grid" id="wire-grid"><div class="wire-loading">Loading headlines…</div></div>
  <button type="button" class="wire-nav" id="wire-prev" aria-label="Previous headlines" disabled>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 6l-6 6 6 6"/></svg>
  </button>
  <button type="button" class="wire-nav" id="wire-next" aria-label="Next headlines">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 6l6 6-6 6"/></svg>
  </button>
</section>

<footer>
  Live data via ESPN &nbsp;·&nbsp;
  <a href="https://linktr.ee/daftporter" target="_blank" rel="noopener" aria-label="daftporter on Linktree (opens in new tab)">linktr.ee/daftporter</a>
</footer>

<script src="scores.js"></script>
</body>
</html>
