<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tim's Philly Sports HQ</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Philly HQ">
<meta name="theme-color" content="#060810">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="data:application/json,{&quot;name&quot;:&quot;Tim's Philly Sports HQ&quot;,&quot;short_name&quot;:&quot;Philly HQ&quot;,&quot;start_url&quot;:&quot;.&quot;,&quot;display&quot;:&quot;standalone&quot;,&quot;background_color&quot;:&quot;#060810&quot;,&quot;theme_color&quot;:&quot;#060810&quot;}">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔔</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;400;600;700;900&family=Bebas+Neue&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>
  const _saved = localStorage.getItem('colorScheme')||'device';
  if(_saved==='dark')  document.documentElement.setAttribute('data-theme','dark');
  if(_saved==='light') document.documentElement.setAttribute('data-theme','light');
</script>
<style>
  :root{--bg:#060810;--surface:#0d1117;--border:rgba(255,255,255,0.06);--text:#e8eaf0;--muted:#6b7280;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:'Barlow Condensed',sans-serif;min-height:100vh;overflow-x:hidden;}
  body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='1'/%3E%3C/svg%3E");opacity:.035;pointer-events:none;z-index:0;}
  header{position:relative;z-index:10;padding:28px 32px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;}
  .header-left h1{font-family:'Bebas Neue',sans-serif;font-size:clamp(32px,5vw,52px);letter-spacing:.05em;line-height:1;background:linear-gradient(135deg,#fff 40%,#aaa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
  .header-left p{font-size:13px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;margin-top:4px;}
  .header-right{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  .live-badge{display:flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#9ca3af;font-family:'DM Mono',monospace;}
  .pulse-dot{width:8px;height:8px;border-radius:50%;background:#22c55e;animation:pulse 2s ease-in-out infinite;flex-shrink:0;}
  .pulse-dot.loading{background:#fbbf24;}.pulse-dot.error{background:#f87171;animation:none;}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1);box-shadow:0 0 0 0 rgba(34,197,94,.4);}50%{opacity:.8;transform:scale(1.1);box-shadow:0 0 0 6px rgba(34,197,94,0);}}
  #update-time{color:#e5e7eb;}#countdown{color:#e5e7eb;}
  .refresh-btn{background:rgba(255,255,255,.05);border:1px solid var(--border);color:#d1d5db;font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:8px 16px;border-radius:8px;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:6px;}
  .refresh-btn:hover:not(:disabled){background:rgba(255,255,255,.1);color:#f9fafb;border-color:rgba(255,255,255,.15);}
  .refresh-btn:disabled{opacity:.4;cursor:not-allowed;}
  .refresh-btn.spinning .spin{animation:spin 1s linear infinite;display:inline-block;}
  @keyframes spin{to{transform:rotate(360deg);}}
  main{position:relative;z-index:10;max-width:1400px;margin:0 auto;padding:32px 20px 48px;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px;}
  .skeleton-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;}
  .skeleton-header{padding:20px;border-bottom:1px solid var(--border);display:flex;gap:12px;align-items:center;}
  .sk{background:linear-gradient(90deg,#1a1f2e 25%,#232a3a 50%,#1a1f2e 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:6px;}
  .sk-circle{width:44px;height:44px;border-radius:50%;flex-shrink:0;}.sk-line{height:14px;}
  .sk-body{padding:20px;display:flex;flex-direction:column;gap:10px;}
  @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
  .team-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;position:relative;transition:transform .2s,box-shadow .2s;animation:fadeUp .5s ease both;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
  .team-card:hover{transform:translateY(-3px);box-shadow:0 16px 48px rgba(0,0,0,.5);}
  .team-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--team-color);}
  @keyframes liveGlow{0%,100%{opacity:1;box-shadow:0 0 8px 1px var(--team-color);}50%{opacity:.7;box-shadow:0 0 18px 4px var(--team-color);}}
  .team-card.is-live{background:color-mix(in srgb,var(--team-color) 6%,var(--surface));}
  .team-card.is-live::before{height:4px;animation:liveGlow 2.5s ease-in-out infinite;}
  @media(min-width:769px){
    .team-card.is-live{cursor:pointer;}
    .team-card.is-live:hover{transform:translateY(-4px);box-shadow:0 20px 56px rgba(0,0,0,.6),0 0 0 1px var(--team-color);}
    .team-card.is-live .live-expand-hint{display:flex;}
  }
  .live-expand-hint{display:none;align-items:center;justify-content:center;gap:5px;padding:7px 20px 12px;font-family:'DM Mono',monospace;font-size:10px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;opacity:.6;}
  .card-header{padding:20px 20px 14px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border);}
  .team-icon{width:44px;height:44px;border-radius:50%;background:var(--team-color);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;}
  .team-meta{flex:1;}.team-name{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:.04em;line-height:1;color:#fff;}
  .team-sport{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);margin-top:2px;}
  .card-status{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:4px 10px;border-radius:100px;font-weight:500;white-space:nowrap;}
  .status-live,.status-starting{background:rgba(34,197,94,.15);color:#4ade80;border:1px solid rgba(34,197,94,.3);}
  .status-starting{animation:pulse 2s ease-in-out infinite;}
  .status-final{background:rgba(255,255,255,.05);color:var(--muted);border:1px solid var(--border);}
  .status-upcoming{background:rgba(251,191,36,.12);color:#fbbf24;border:1px solid rgba(251,191,36,.25);}
  .status-offseason{background:rgba(107,114,128,.12);color:#6b7280;border:1px solid rgba(107,114,128,.2);}
  .streak{display:inline-block;font-family:'DM Mono',monospace;font-size:10px;padding:2px 7px;border-radius:100px;letter-spacing:.08em;font-weight:500;}
  .streak-w{background:rgba(74,222,128,.15);color:#4ade80;border:1px solid rgba(74,222,128,.3);}
  .streak-l{background:rgba(248,113,113,.15);color:#f87171;border:1px solid rgba(248,113,113,.3);}
  .streak-d{background:rgba(251,191,36,.15);color:#fbbf24;border:1px solid rgba(251,191,36,.3);}
  .featured-game{padding:20px;border-bottom:1px solid var(--border);}
  .game-label{font-size:10px;text-transform:uppercase;letter-spacing:.18em;color:var(--muted);margin-bottom:12px;font-family:'DM Mono',monospace;}
  .matchup{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .team-side{flex:1;text-align:center;}
  .team-abv{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:.08em;color:#d1d5db;}
  .team-logo{width:32px;height:32px;object-fit:contain;display:block;margin:8px auto;}
  .team-logo-lg{width:80px;height:80px;object-fit:contain;display:block;margin:0 auto 12px;}
  .team-score{font-family:'Bebas Neue',sans-serif;font-size:48px;line-height:1;color:#fff;margin-top:2px;}
  .team-score.winner{color:var(--team-color);}
  .team-score.no-score{font-size:28px;color:#4b5563;}
  .team-score.opp-winning{color:#f1f5f9;}
  .team-record{font-family:'DM Mono',monospace;font-size:10px;color:#6b7280;letter-spacing:.08em;margin-top:4px;}
  .vs-divider{display:flex;flex-direction:column;align-items:center;gap:4px;flex-shrink:0;}
  .vs-text{font-family:'DM Mono',monospace;font-size:11px;color:#374151;letter-spacing:.1em;}
  .vs-line{width:1px;height:20px;background:var(--border);}
  .game-info-row{margin-top:10px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:11px;color:var(--muted);font-family:'DM Mono',monospace;text-align:center;flex-wrap:wrap;}
  .recent-results{padding:14px 20px 16px;}
  .results-label{font-size:10px;text-transform:uppercase;letter-spacing:.18em;color:var(--muted);margin-bottom:10px;font-family:'DM Mono',monospace;}
  .result-row{display:flex;align-items:center;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.03);font-size:13px;gap:6px;}
  .result-row:last-child{border-bottom:none;}
  .result-matchup{color:#9ca3af;letter-spacing:.04em;flex:1;min-width:0;}
  .result-matchup span{color:#e5e7eb;font-weight:600;}
  .result-score{font-family:'DM Mono',monospace;font-size:12px;color:#e5e7eb;white-space:nowrap;}
  .result-wl{font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:.06em;width:18px;text-align:right;flex-shrink:0;}
  .result-wl.win{color:#4ade80;}.result-wl.loss{color:#f87171;}.result-wl.draw{color:#fbbf24;}
  .result-date{font-family:'DM Mono',monospace;font-size:10px;color:#4b5563;width:36px;text-align:right;flex-shrink:0;}
  .next-game-row{display:flex;align-items:flex-start;gap:8px;padding:8px 10px;background:rgba(251,191,36,.06);border:1px solid rgba(251,191,36,.12);border-radius:8px;margin-top:10px;}
  .next-game-row.today{background:rgba(251,191,36,.18);border:1px solid rgba(251,191,36,.45);}
  .next-game-label{font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:#fbbf24;font-family:'DM Mono',monospace;flex-shrink:0;padding-top:1px;}
  .next-game-info{font-size:12px;color:#d1d5db;letter-spacing:.02em;flex:1;}
  .today-badge{display:inline-block;font-family:'DM Mono',monospace;font-size:10px;font-weight:600;letter-spacing:.08em;color:#f59e0b;background:rgba(251,191,36,.2);border:1px solid rgba(251,191,36,.4);border-radius:100px;padding:1px 7px;margin-left:6px;vertical-align:middle;}
  .no-recent{padding:10px 0;font-size:12px;color:#4b5563;font-family:'DM Mono',monospace;text-align:center;}
  @keyframes scoreFlash{0%{box-shadow:0 0 0 0 rgba(255,255,255,0);}20%{box-shadow:0 0 24px 6px rgba(255,215,0,.5);}100%{box-shadow:0 0 0 0 rgba(255,215,0,0);}}
  .score-changed{animation:scoreFlash 1.5s ease-out;}
  .news-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;position:relative;animation:fadeUp .5s ease both;}
  .news-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#006BB6,#F74902,#E81828,#004C54);}
  .news-header{padding:20px 20px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;}
  .news-header-icon{font-size:20px;}
  .news-header-title{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:.04em;color:#fff;}
  .news-item{display:flex;flex-direction:column;gap:4px;padding:11px 20px;border-bottom:1px solid rgba(255,255,255,.03);cursor:pointer;transition:background .15s;text-decoration:none;}
  .news-item:last-child{border-bottom:none;}
  .news-item:hover{background:rgba(255,255,255,.04);}
  .news-item-title{font-size:13px;color:#e5e7eb;line-height:1.35;letter-spacing:.01em;}
  .news-item-meta{display:flex;align-items:center;gap:8px;margin-top:2px;}
  .news-team-tag{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;padding:2px 6px;border-radius:100px;font-weight:500;}
  .news-time{font-family:'DM Mono',monospace;font-size:10px;color:#4b5563;}
  .news-loading{padding:24px 20px;text-align:center;font-family:'DM Mono',monospace;font-size:11px;color:#4b5563;}
  #error-banner{display:none;position:relative;z-index:10;margin:16px auto 0;max-width:1400px;padding:0 20px;}
  #error-banner-inner{background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.25);border-radius:10px;padding:14px 18px;font-family:'DM Mono',monospace;font-size:12px;color:#fca5a5;letter-spacing:.04em;}
  footer{position:relative;z-index:10;text-align:center;padding:20px;font-family:'DM Mono',monospace;font-size:11px;color:#374151;letter-spacing:.08em;border-top:1px solid var(--border);}

  /* ── Live Modal ── */
  #live-modal{display:none;position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.85);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);align-items:center;justify-content:center;}
  #live-modal.open{display:flex;animation:modalIn .25s ease;}
  @keyframes modalIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
  #live-modal-inner{position:relative;width:calc(100vw - 48px);height:calc(100vh - 48px);background:var(--surface);border:1px solid var(--border);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  #live-modal-inner::before{content:'';position:absolute;top:0;left:0;right:0;height:5px;background:var(--modal-color,#22c55e);animation:liveGlowBar 2.5s ease-in-out infinite;}
  @keyframes liveGlowBar{0%,100%{opacity:1;box-shadow:0 0 12px 2px var(--modal-color,#22c55e);}50%{opacity:.7;box-shadow:0 0 28px 8px var(--modal-color,#22c55e);}}
  #live-modal-inner::after{content:'';position:absolute;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='1'/%3E%3C/svg%3E");opacity:.02;pointer-events:none;z-index:0;}
  #modal-close{position:absolute;top:20px;right:20px;z-index:10;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:#9ca3af;font-size:20px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s,color .15s;font-family:sans-serif;}
  #modal-close:hover{background:rgba(255,255,255,.15);color:#fff;}
  #modal-content{position:relative;z-index:1;text-align:center;width:100%;padding:40px;}
  #modal-sport-badge{font-family:'DM Mono',monospace;font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--modal-color,#4ade80);margin-bottom:16px;display:flex;align-items:center;justify-content:center;gap:8px;}
  #modal-sport-badge .modal-pulse{width:9px;height:9px;border-radius:50%;background:var(--modal-color,#4ade80);animation:pulse 2s ease-in-out infinite;flex-shrink:0;}
  #modal-teams{display:flex;align-items:center;justify-content:center;}
  .modal-team{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;max-width:340px;}
  .modal-team-abbr{font-family:'Bebas Neue',sans-serif;font-size:clamp(48px,10vw,120px);letter-spacing:.06em;line-height:1;color:#d1d5db;}
  .modal-team-score{font-family:'Bebas Neue',sans-serif;font-size:clamp(100px,22vw,260px);line-height:.9;color:#fff;transition:color .3s;}
  .modal-team-score.modal-winner{color:var(--modal-color,#4ade80);}
  .modal-vs{display:flex;flex-direction:column;align-items:center;gap:8px;padding:0 clamp(16px,3vw,48px);flex-shrink:0;}
  .modal-vs-text{font-family:'DM Mono',monospace;font-size:clamp(13px,2vw,18px);color:#374151;letter-spacing:.1em;}
  .modal-vs-line{width:1px;height:clamp(80px,12vw,160px);background:var(--border);}
  #modal-game-note{margin-top:clamp(16px,3vh,36px);font-family:'DM Mono',monospace;font-size:clamp(14px,2.2vw,22px);color:#9ca3af;letter-spacing:.08em;text-transform:uppercase;}
  #modal-status-bar{margin-top:20px;display:flex;align-items:center;gap:14px;font-family:'DM Mono',monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#9ca3af;flex-wrap:wrap;justify-content:center;}
  @media(max-width:768px){#live-modal{display:none !important;}}

  /* ── Light theme ── */
  @media(prefers-color-scheme:light){
    :root:not([data-theme="dark"]){--bg:#e8edf2;--surface:#ffffff;--border:rgba(0,0,0,0.12);--text:#111827;--muted:#374151;}
    :root:not([data-theme="dark"]) body::before{opacity:.012;}
    :root:not([data-theme="dark"]) .header-left h1{background:linear-gradient(135deg,#111827 40%,#374151) !important;-webkit-background-clip:text !important;-webkit-text-fill-color:transparent !important;background-clip:text !important;}
    :root:not([data-theme="dark"]) .header-left p{color:#374151 !important;}
    :root:not([data-theme="dark"]) .live-badge{color:#374151 !important;}
    :root:not([data-theme="dark"]) #update-time,:root:not([data-theme="dark"]) #countdown{color:#111827 !important;}
    :root:not([data-theme="dark"]) .refresh-btn{background:rgba(0,0,0,0.06) !important;border:1px solid rgba(0,0,0,0.15) !important;color:#111827 !important;}
    :root:not([data-theme="dark"]) .sk{background:linear-gradient(90deg,#e2e8f0 25%,#f1f5f9 50%,#e2e8f0 75%) !important;background-size:200% 100%;}
    :root:not([data-theme="dark"]) .team-name{color:#111827 !important;}
    :root:not([data-theme="dark"]) .team-sport{color:#374151 !important;}
    :root:not([data-theme="dark"]) .team-abv{color:#374151 !important;}
    :root:not([data-theme="dark"]) .team-score{color:#111827 !important;}
    :root:not([data-theme="dark"]) .team-score.winner{color:var(--team-color) !important;}
    :root:not([data-theme="dark"]) .team-score.no-score{color:#6b7280 !important;}
    :root:not([data-theme="dark"]) .team-score.opp-winning{color:#111827 !important;}
    :root:not([data-theme="dark"]) .team-record{color:#374151 !important;}
    :root:not([data-theme="dark"]) .vs-text{color:#6b7280 !important;}
    :root:not([data-theme="dark"]) .vs-line{background:rgba(0,0,0,0.15) !important;}
    :root:not([data-theme="dark"]) .game-label{color:#374151 !important;}
    :root:not([data-theme="dark"]) .game-info-row{color:#374151 !important;}
    :root:not([data-theme="dark"]) .results-label{color:#374151 !important;}
    :root:not([data-theme="dark"]) .result-matchup{color:#374151 !important;}
    :root:not([data-theme="dark"]) .result-matchup span{color:#111827 !important;}
    :root:not([data-theme="dark"]) .result-score{color:#111827 !important;}
    :root:not([data-theme="dark"]) .result-date{color:#6b7280 !important;}
    :root:not([data-theme="dark"]) .next-game-label{color:#d97706 !important;}
    :root:not([data-theme="dark"]) .next-game-info{color:#374151 !important;}
    :root:not([data-theme="dark"]) .no-recent{color:#6b7280 !important;}
    :root:not([data-theme="dark"]) .status-final{background:rgba(0,0,0,0.07) !important;color:#374151 !important;border:1px solid rgba(0,0,0,0.15) !important;}
    :root:not([data-theme="dark"]) .status-offseason{background:rgba(0,0,0,0.07) !important;color:#6b7280 !important;border:1px solid rgba(0,0,0,0.12) !important;}
    :root:not([data-theme="dark"]) .status-upcoming{background:rgba(180,120,0,.1) !important;color:#92400e !important;border:1px solid rgba(180,120,0,.25) !important;}
    :root:not([data-theme="dark"]) .status-live,:root:not([data-theme="dark"]) .status-starting{background:rgba(22,163,74,.12) !important;color:#15803d !important;border-color:rgba(22,163,74,.35) !important;}
    :root:not([data-theme="dark"]) .pulse-dot{background:#16a34a !important;}
    :root:not([data-theme="dark"]) .streak-w{background:rgba(22,163,74,.12) !important;color:#15803d !important;border-color:rgba(22,163,74,.3) !important;}
    :root:not([data-theme="dark"]) .streak-l{background:rgba(220,38,38,.1) !important;color:#b91c1c !important;border-color:rgba(220,38,38,.25) !important;}
    :root:not([data-theme="dark"]) .streak-d{background:rgba(180,120,0,.1) !important;color:#92400e !important;border-color:rgba(180,120,0,.25) !important;}
    :root:not([data-theme="dark"]) .result-wl.win{color:#15803d !important;}
    :root:not([data-theme="dark"]) .result-wl.loss{color:#b91c1c !important;}
    :root:not([data-theme="dark"]) .result-wl.draw{color:#92400e !important;}
    :root:not([data-theme="dark"]) .news-header-title{color:#111827 !important;}
    :root:not([data-theme="dark"]) .news-item-title{color:#111827 !important;}
    :root:not([data-theme="dark"]) .news-time{color:#6b7280 !important;}
    :root:not([data-theme="dark"]) footer{color:#4b5563 !important;}
    :root:not([data-theme="dark"]) #live-modal{background:rgba(200,210,220,.75) !important;}
    :root:not([data-theme="dark"]) .modal-team-abbr{color:#374151 !important;}
    :root:not([data-theme="dark"]) .modal-team-score{color:#111827 !important;}
    :root:not([data-theme="dark"]) .modal-team-score.modal-winner{color:var(--modal-color) !important;}
    :root:not([data-theme="dark"]) #modal-game-note{color:#374151 !important;}
    :root:not([data-theme="dark"]) #modal-status-bar{color:#374151 !important;}
  }
  [data-theme="light"]{--bg:#e8edf2;--surface:#ffffff;--border:rgba(0,0,0,0.12);--text:#111827;--muted:#374151;}
  [data-theme="light"] body::before{opacity:.012;}
  [data-theme="light"] .header-left h1{background:linear-gradient(135deg,#111827 40%,#374151) !important;-webkit-background-clip:text !important;-webkit-text-fill-color:transparent !important;background-clip:text !important;}
  [data-theme="light"] .header-left p{color:#374151 !important;}
  [data-theme="light"] .live-badge{color:#374151 !important;}
  [data-theme="light"] #update-time,[data-theme="light"] #countdown{color:#111827 !important;}
  [data-theme="light"] .refresh-btn{background:rgba(0,0,0,0.06) !important;border:1px solid rgba(0,0,0,0.15) !important;color:#111827 !important;}
  [data-theme="light"] .sk{background:linear-gradient(90deg,#e2e8f0 25%,#f1f5f9 50%,#e2e8f0 75%) !important;background-size:200% 100%;}
  [data-theme="light"] .team-name{color:#111827 !important;}
  [data-theme="light"] .team-sport{color:#374151 !important;}
  [data-theme="light"] .team-abv{color:#374151 !important;}
  [data-theme="light"] .team-score{color:#111827 !important;}
  [data-theme="light"] .team-score.winner{color:var(--team-color) !important;}
  [data-theme="light"] .team-score.no-score{color:#6b7280 !important;}
  [data-theme="light"] .team-score.opp-winning{color:#111827 !important;}
  [data-theme="light"] .team-record{color:#374151 !important;}
  [data-theme="light"] .vs-text{color:#6b7280 !important;}
  [data-theme="light"] .vs-line{background:rgba(0,0,0,0.15) !important;}
  [data-theme="light"] .game-label{color:#374151 !important;}
  [data-theme="light"] .game-info-row{color:#374151 !important;}
  [data-theme="light"] .results-label{color:#374151 !important;}
  [data-theme="light"] .result-matchup{color:#374151 !important;}
  [data-theme="light"] .result-matchup span{color:#111827 !important;}
  [data-theme="light"] .result-score{color:#111827 !important;}
  [data-theme="light"] .result-date{color:#6b7280 !important;}
  [data-theme="light"] .next-game-label{color:#d97706 !important;}
  [data-theme="light"] .next-game-info{color:#374151 !important;}
  [data-theme="light"] .no-recent{color:#6b7280 !important;}
  [data-theme="light"] .status-final{background:rgba(0,0,0,0.07) !important;color:#374151 !important;border:1px solid rgba(0,0,0,0.15) !important;}
  [data-theme="light"] .status-offseason{background:rgba(0,0,0,0.07) !important;color:#6b7280 !important;border:1px solid rgba(0,0,0,0.12) !important;}
  [data-theme="light"] .status-upcoming{background:rgba(180,120,0,.1) !important;color:#92400e !important;border:1px solid rgba(180,120,0,.25) !important;}
  [data-theme="light"] .status-live,[data-theme="light"] .status-starting{background:rgba(22,163,74,.12) !important;color:#15803d !important;border-color:rgba(22,163,74,.35) !important;}
  [data-theme="light"] .pulse-dot{background:#16a34a !important;}
  [data-theme="light"] .streak-w{background:rgba(22,163,74,.12) !important;color:#15803d !important;border-color:rgba(22,163,74,.3) !important;}
  [data-theme="light"] .streak-l{background:rgba(220,38,38,.1) !important;color:#b91c1c !important;border-color:rgba(220,38,38,.25) !important;}
  [data-theme="light"] .streak-d{background:rgba(180,120,0,.1) !important;color:#92400e !important;border-color:rgba(180,120,0,.25) !important;}
  [data-theme="light"] .result-wl.win{color:#15803d !important;}
  [data-theme="light"] .result-wl.loss{color:#b91c1c !important;}
  [data-theme="light"] .result-wl.draw{color:#92400e !important;}
  [data-theme="light"] .news-header-title{color:#111827 !important;}
  [data-theme="light"] .news-item-title{color:#111827 !important;}
  [data-theme="light"] .news-time{color:#6b7280 !important;}
  [data-theme="light"] footer{color:#4b5563 !important;}
  [data-theme="light"] #live-modal{background:rgba(200,210,220,.75) !important;}
  [data-theme="light"] .modal-team-abbr{color:#374151 !important;}
  [data-theme="light"] .modal-team-score{color:#111827 !important;}
  [data-theme="light"] .modal-team-score.modal-winner{color:var(--modal-color) !important;}
  [data-theme="light"] #modal-game-note{color:#374151 !important;}
  [data-theme="light"] #modal-status-bar{color:#374151 !important;}
</style>
</head>
<body>
<header>
  <div class="header-left">
    <h1>Tim's Philly Sports HQ</h1>
    <p>Eagles &bull; Phillies &bull; 76ers &bull; Flyers &bull; Union</p>
  </div>
  <div class="header-right">
    <div class="live-badge">
      <span class="pulse-dot" id="status-dot"></span>
      <span id="update-time">Fetching scores…</span>
    </div>
    <div class="live-badge">
      <span style="color:#9ca3af">Next refresh in</span>
      <span id="countdown">5:00</span>
    </div>
    <button class="refresh-btn" id="refresh-btn" onclick="fetchScores()">
      <span class="spin">&#8635;</span> Refresh
    </button>
    <button class="refresh-btn" id="theme-btn" onclick="cycleTheme()" title="Toggle color scheme">
      <span id="theme-icon">🖥️</span>
    </button>
  </div>
</header>

<div id="error-banner"><div id="error-banner-inner"></div></div>
<main id="cards-container"></main>

<footer>
  <div id="footer-text">Live data via ESPN &nbsp;&bull;&nbsp; <a href="https://linktr.ee/daftporter" target="_blank" rel="noopener" style="color:inherit;text-decoration:underline;text-underline-offset:3px">linktr.ee/daftporter</a> &nbsp;&bull;&nbsp; Built with Claude.ai</div>
</footer>

<!-- Live Score Modal -->
<div id="live-modal" role="dialog" aria-modal="true" aria-label="Live game score">
  <div id="live-modal-inner">
    <button id="modal-close" onclick="closeModal()" aria-label="Close">&times;</button>
    <div id="modal-content">
      <div id="modal-sport-badge">
        <span class="modal-pulse"></span>
        <span id="modal-sport-text">LIVE NOW</span>
      </div>
      <div id="modal-teams">
        <div class="modal-team" id="modal-phi-side">
          <div class="modal-team-abbr" id="modal-phi-abbr">PHI</div>
          <img class="team-logo-lg" id="modal-phi-logo" src="" alt="PHI" onerror="this.style.display='none'">
          <div class="modal-team-score" id="modal-phi-score">0</div>
        </div>
        <div class="modal-vs" id="modal-divider">
          <div class="modal-vs-line"></div>
          <div class="modal-vs-text">VS</div>
          <div class="modal-vs-line"></div>
        </div>
        <div class="modal-team" id="modal-opp-side">
          <div class="modal-team-abbr" id="modal-opp-abbr">OPP</div>
          <img class="team-logo-lg" id="modal-opp-logo" src="" alt="OPP" onerror="this.style.display='none'">
          <div class="modal-team-score" id="modal-opp-score">0</div>
        </div>
      </div>
      <div id="modal-game-note"></div>
      <div id="modal-status-bar">
        <div style="display:flex;align-items:center;gap:8px;">
          <span class="pulse-dot" id="modal-status-dot"></span>
          <span id="modal-update-time"></span>
        </div>
        <div style="display:flex;align-items:center;gap:8px;">
          <span style="color:#6b7280">Next refresh in</span>
          <span id="modal-countdown"></span>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="scores.js"></script>
</body>
</html>
