<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tim's Philly Sports HQ</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Philly HQ">
<meta name="theme-color" content="#060810">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="data:application/json,{&quot;name&quot;:&quot;Tim's Philly Sports HQ&quot;,&quot;short_name&quot;:&quot;Philly HQ&quot;,&quot;start_url&quot;:&quot;.&quot;,&quot;display&quot;:&quot;standalone&quot;,&quot;background_color&quot;:&quot;#060810&quot;,&quot;theme_color&quot;:&quot;#060810&quot;}">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔔</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;400;600;700;900&family=Bebas+Neue&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>
  const _saved = localStorage.getItem('colorScheme')||'device';
  if(_saved==='dark')  document.documentElement.setAttribute('data-theme','dark');
  if(_saved==='light') document.documentElement.setAttribute('data-theme','light');
</script>
<style>
  :root{--bg:#060810;--surface:#0d1117;--border:rgba(255,255,255,0.06);--text:#e8eaf0;--muted:#6b7280;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:'Barlow Condensed',sans-serif;min-height:100vh;overflow-x:hidden;}
  body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='1'/%3E%3C/svg%3E");opacity:.035;pointer-events:none;z-index:0;}
  header{position:relative;z-index:10;padding:28px 32px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;}
  .header-left h1{font-family:'Bebas Neue',sans-serif;font-size:clamp(32px,5vw,52px);letter-spacing:.05em;line-height:1;background:linear-gradient(135deg,#fff 40%,#aaa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
  .header-left p{font-size:13px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;margin-top:4px;}
  .header-right{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  .live-badge{display:flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#9ca3af;font-family:'DM Mono',monospace;}
  .pulse-dot{width:8px;height:8px;border-radius:50%;background:#22c55e;animation:pulse 2s ease-in-out infinite;flex-shrink:0;}
  .pulse-dot.loading{background:#fbbf24;}.pulse-dot.error{background:#f87171;animation:none;}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1);box-shadow:0 0 0 0 rgba(34,197,94,.4);}50%{opacity:.8;transform:scale(1.1);box-shadow:0 0 0 6px rgba(34,197,94,0);}}
  #update-time{color:#e5e7eb;}#countdown{color:#e5e7eb;}
  .refresh-btn{background:rgba(255,255,255,.05);border:1px solid var(--border);color:#d1d5db;font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:8px 16px;border-radius:8px;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:6px;}
  .refresh-btn:hover:not(:disabled){background:rgba(255,255,255,.1);color:#f9fafb;border-color:rgba(255,255,255,.15);}
  .refresh-btn:disabled{opacity:.4;cursor:not-allowed;}
  .refresh-btn.spinning .spin{animation:spin 1s linear infinite;display:inline-block;}
  @keyframes spin{to{transform:rotate(360deg);}}
  main{position:relative;z-index:10;max-width:1400px;margin:0 auto;padding:32px 20px 48px;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px;}
  .skeleton-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;}
  .skeleton-header{padding:20px;border-bottom:1px solid var(--border);display:flex;gap:12px;align-items:center;}
  .sk{background:linear-gradient(90deg,#1a1f2e 25%,#232a3a 50%,#1a1f2e 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:6px;}
  .sk-circle{width:44px;height:44px;border-radius:50%;flex-shrink:0;}.sk-line{height:14px;}
  .sk-body{padding:20px;display:flex;flex-direction:column;gap:10px;}
  @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
  .team-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;position:relative;transition:transform .2s,box-shadow .2s;animation:fadeUp .5s ease both;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
  .team-card:hover{transform:translateY(-3px);box-shadow:0 16px 48px rgba(0,0,0,.5);}
  .team-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--team-color);}
  @keyframes liveGlow{0%,100%{opacity:1;box-shadow:0 0 8px 1px var(--team-color);}50%{opacity:.7;box-shadow:0 0 18px 4px var(--team-color);}}
  .team-card.is-live{background:color-mix(in srgb,var(--team-color) 6%,var(--surface));}
  .team-card.is-live::before{height:4px;animation:liveGlow 2.5s ease-in-out infinite;}
  @media(min-width:769px){
    .team-card.is-live{cursor:pointer;}
    .team-card.is-live:hover{transform:translateY(-4px);box-shadow:0 20px 56px rgba(0,0,0,.6),0 0 0 1px var(--team-color);}
    .team-card.is-live .live-expand-hint{display:flex;}
  }
  .live-expand-hint{display:none;align-items:center;justify-content:center;gap:5px;padding:7px 20px 12px;font-family:'DM Mono',monospace;font-size:10px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;opacity:.6;}
  .card-header{padding:20px 20px 14px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border);}
  .team-icon{width:44px;height:44px;border-radius:50%;background:var(--team-color);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;}
  .team-meta{flex:1;}.team-name{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:.04em;line-height:1;color:#fff;}
  .team-sport{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);margin-top:2px;}
  .card-status{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:4px 10px;border-radius:100px;font-weight:500;white-space:nowrap;}
  .status-live,.status-starting{background:rgba(34,197,94,.15);color:#4ade80;border:1px solid rgba(34,197,94,.3);}
  .status-starting{animation:pulse 2s ease-in-out infinite;}
  .status-final{background:rgba(255,255,255,.05);color:var(--muted);border:1px solid var(--border);}
  .status-upcoming{background:rgba(251,191,36,.12);color:#fbbf24;border:1px solid rgba(251,191,36,.25);}
  .status-offseason{background:rgba(107,114,128,.12);color:#6b7280;border:1px solid rgba(107,114,128,.2);}
  .streak{display:inline-block;font-family:'DM Mono',monospace;font-size:10px;padding:2px 7px;border-radius:100px;letter-spacing:.08em;font-weight:500;}
  .streak-w{background:rgba(74,222,128,.15);color:#4ade80;border:1px solid rgba(74,222,128,.3);}
  .streak-l{background:rgba(248,113,113,.15);color:#f87171;border:1px solid rgba(248,113,113,.3);}
  .streak-d{background:rgba(251,191,36,.15);color:#fbbf24;border:1px solid rgba(251,191,36,.3);}
  .featured-game{padding:20px;border-bottom:1px solid var(--border);}
  .game-label{font-size:10px;text-transform:uppercase;letter-spacing:.18em;color:var(--muted);margin-bottom:12px;font-family:'DM Mono',monospace;}
  .matchup{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .team-side{flex:1;text-align:center;}
  .team-abv{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:.08em;color:#d1d5db;}
  .team-score{font-family:'Bebas Neue',sans-serif;font-size:48px;line-height:1;color:#fff;margin-top:2px;}
  .team-score.winner{color:var(--team-color);}
  .team-score.no-score{font-size:28px;color:#4b5563;}
  .team-score.opp-winning{color:#f1f5f9;}
  .team-record{font-family:'DM Mono',monospace;font-size:10px;color:#6b7280;letter-spacing:.08em;margin-top:4px;}
  .vs-divider{display:flex;flex-direction:column;align-items:center;gap:4px;flex-shrink:0;}
  .vs-text{font-family:'DM Mono',monospace;font-size:11px;color:#374151;letter-spacing:.1em;}
  .vs-line{width:1px;height:20px;background:var(--border);}
  .game-info-row{margin-top:10px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:11px;color:var(--muted);font-family:'DM Mono',monospace;text-align:center;flex-wrap:wrap;}
  .recent-results{padding:14px 20px 16px;}
  .results-label{font-size:10px;text-transform:uppercase;letter-spacing:.18em;color:var(--muted);margin-bottom:10px;font-family:'DM Mono',monospace;}
  .result-row{display:flex;align-items:center;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.03);font-size:13px;gap:6px;}
  .result-row:last-child{border-bottom:none;}
  .result-matchup{color:#9ca3af;letter-spacing:.04em;flex:1;min-width:0;}
  .result-matchup span{color:#e5e7eb;font-weight:600;}
  .result-score{font-family:'DM Mono',monospace;font-size:12px;color:#e5e7eb;white-space:nowrap;}
  .result-wl{font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:.06em;width:18px;text-align:right;flex-shrink:0;}
  .result-wl.win{color:#4ade80;}.result-wl.loss{color:#f87171;}.result-wl.draw{color:#fbbf24;}
  .result-date{font-family:'DM Mono',monospace;font-size:10px;color:#4b5563;width:36px;text-align:right;flex-shrink:0;}
  .next-game-row{display:flex;align-items:flex-start;gap:8px;padding:8px 10px;background:rgba(251,191,36,.06);border:1px solid rgba(251,191,36,.12);border-radius:8px;margin-top:10px;}
  .next-game-row.today{background:rgba(251,191,36,.18);border:1px solid rgba(251,191,36,.45);}
  .next-game-label{font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:#fbbf24;font-family:'DM Mono',monospace;flex-shrink:0;padding-top:1px;}
  .next-game-info{font-size:12px;color:#d1d5db;letter-spacing:.02em;flex:1;}
  .today-badge{display:inline-block;font-family:'DM Mono',monospace;font-size:10px;font-weight:600;letter-spacing:.08em;color:#f59e0b;background:rgba(251,191,36,.2);border:1px solid rgba(251,191,36,.4);border-radius:100px;padding:1px 7px;margin-left:6px;vertical-align:middle;}
  .no-recent{padding:10px 0;font-size:12px;color:#4b5563;font-family:'DM Mono',monospace;text-align:center;}
  @keyframes scoreFlash{0%{box-shadow:0 0 0 0 rgba(255,255,255,0);}20%{box-shadow:0 0 24px 6px rgba(255,215,0,.5);}100%{box-shadow:0 0 0 0 rgba(255,215,0,0);}}
  .score-changed{animation:scoreFlash 1.5s ease-out;}
  .news-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;position:relative;animation:fadeUp .5s ease both;}
  .news-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#006BB6,#F74902,#E81828,#004C54);}
  .news-header{padding:20px 20px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;}
  .news-header-icon{font-size:20px;}
  .news-header-title{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:.04em;color:#fff;}
  .news-item{display:flex;flex-direction:column;gap:4px;padding:11px 20px;border-bottom:1px solid rgba(255,255,255,.03);cursor:pointer;transition:background .15s;text-decoration:none;}
  .news-item:last-child{border-bottom:none;}
  .news-item:hover{background:rgba(255,255,255,.04);}
  .news-item-title{font-size:13px;color:#e5e7eb;line-height:1.35;letter-spacing:.01em;}
  .news-item-meta{display:flex;align-items:center;gap:8px;margin-top:2px;}
  .news-team-tag{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;padding:2px 6px;border-radius:100px;font-weight:500;}
  .news-time{font-family:'DM Mono',monospace;font-size:10px;color:#4b5563;}
  .news-loading{padding:24px 20px;text-align:center;font-family:'DM Mono',monospace;font-size:11px;color:#4b5563;}
  #error-banner{display:none;position:relative;z-index:10;margin:16px auto 0;max-width:1400px;padding:0 20px;}
  #error-banner-inner{background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.25);border-radius:10px;padding:14px 18px;font-family:'DM Mono',monospace;font-size:12px;color:#fca5a5;letter-spacing:.04em;}
  footer{position:relative;z-index:10;text-align:center;padding:20px;font-family:'DM Mono',monospace;font-size:11px;color:#374151;letter-spacing:.08em;border-top:1px solid var(--border);}

  /* ── Live Modal ── */
  #live-modal{display:none;position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.85);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);align-items:center;justify-content:center;}
  #live-modal.open{display:flex;animation:modalIn .25s ease;}
  @keyframes modalIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
  #live-modal-inner{position:relative;width:calc(100vw - 48px);height:calc(100vh - 48px);background:var(--surface);border:1px solid var(--border);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  #live-modal-inner::before{content:'';position:absolute;top:0;left:0;right:0;height:5px;background:var(--modal-color,#22c55e);animation:liveGlowBar 2.5s ease-in-out infinite;}
  @keyframes liveGlowBar{0%,100%{opacity:1;box-shadow:0 0 12px 2px var(--modal-color,#22c55e);}50%{opacity:.7;box-shadow:0 0 28px 8px var(--modal-color,#22c55e);}}
  #live-modal-inner::after{content:'';position:absolute;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='1'/%3E%3C/svg%3E");opacity:.02;pointer-events:none;z-index:0;}
  #modal-close{position:absolute;top:20px;right:20px;z-index:10;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:#9ca3af;font-size:20px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s,color .15s;font-family:sans-serif;}
  #modal-close:hover{background:rgba(255,255,255,.15);color:#fff;}
  #modal-content{position:relative;z-index:1;text-align:center;width:100%;padding:40px;}
  #modal-sport-badge{font-family:'DM Mono',monospace;font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--modal-color,#4ade80);margin-bottom:16px;display:flex;align-items:center;justify-content:center;gap:8px;}
  #modal-sport-badge .modal-pulse{width:9px;height:9px;border-radius:50%;background:var(--modal-color,#4ade80);animation:pulse 2s ease-in-out infinite;flex-shrink:0;}
  #modal-teams{display:flex;align-items:center;justify-content:center;}
  .modal-team{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;max-width:340px;}
  .modal-team-abbr{font-family:'Bebas Neue',sans-serif;font-size:clamp(48px,10vw,120px);letter-spacing:.06em;line-height:1;color:#d1d5db;}
  .modal-team-score{font-family:'Bebas Neue',sans-serif;font-size:clamp(100px,22vw,260px);line-height:.9;color:#fff;transition:color .3s;}
  .modal-team-score.modal-winner{color:var(--modal-color,#4ade80);}
  .modal-vs{display:flex;flex-direction:column;align-items:center;gap:8px;padding:0 clamp(16px,3vw,48px);flex-shrink:0;}
  .modal-vs-text{font-family:'DM Mono',monospace;font-size:clamp(13px,2vw,18px);color:#374151;letter-spacing:.1em;}
  .modal-vs-line{width:1px;height:clamp(80px,12vw,160px);background:var(--border);}
  #modal-game-note{margin-top:clamp(16px,3vh,36px);font-family:'DM Mono',monospace;font-size:clamp(14px,2.2vw,22px);color:#9ca3af;letter-spacing:.08em;text-transform:uppercase;}
  #modal-status-bar{margin-top:20px;display:flex;align-items:center;gap:14px;font-family:'DM Mono',monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#9ca3af;flex-wrap:wrap;justify-content:center;}
  @media(max-width:768px){#live-modal{display:none !important;}}

  /* ── Light theme ── */
  @media(prefers-color-scheme:light){
    :root:not([data-theme="dark"]){--bg:#e8edf2;--surface:#ffffff;--border:rgba(0,0,0,0.12);--text:#111827;--muted:#374151;}
    :root:not([data-theme="dark"]) body::before{opacity:.012;}
    :root:not([data-theme="dark"]) .header-left h1{background:linear-gradient(135deg,#111827 40%,#374151) !important;-webkit-background-clip:text !important;-webkit-text-fill-color:transparent !important;background-clip:text !important;}
    :root:not([data-theme="dark"]) .header-left p{color:#374151 !important;}
    :root:not([data-theme="dark"]) .live-badge{color:#374151 !important;}
    :root:not([data-theme="dark"]) #update-time,:root:not([data-theme="dark"]) #countdown{color:#111827 !important;}
    :root:not([data-theme="dark"]) .refresh-btn{background:rgba(0,0,0,0.06) !important;border:1px solid rgba(0,0,0,0.15) !important;color:#111827 !important;}
    :root:not([data-theme="dark"]) .sk{background:linear-gradient(90deg,#e2e8f0 25%,#f1f5f9 50%,#e2e8f0 75%) !important;background-size:200% 100%;}
    :root:not([data-theme="dark"]) .team-name{color:#111827 !important;}
    :root:not([data-theme="dark"]) .team-sport{color:#374151 !important;}
    :root:not([data-theme="dark"]) .team-abv{color:#374151 !important;}
    :root:not([data-theme="dark"]) .team-score{color:#111827 !important;}
    :root:not([data-theme="dark"]) .team-score.winner{color:var(--team-color) !important;}
    :root:not([data-theme="dark"]) .team-score.no-score{color:#6b7280 !important;}
    :root:not([data-theme="dark"]) .team-score.opp-winning{color:#111827 !important;}
    :root:not([data-theme="dark"]) .team-record{color:#374151 !important;}
    :root:not([data-theme="dark"]) .vs-text{color:#6b7280 !important;}
    :root:not([data-theme="dark"]) .vs-line{background:rgba(0,0,0,0.15) !important;}
    :root:not([data-theme="dark"]) .game-label{color:#374151 !important;}
    :root:not([data-theme="dark"]) .game-info-row{color:#374151 !important;}
    :root:not([data-theme="dark"]) .results-label{color:#374151 !important;}
    :root:not([data-theme="dark"]) .result-matchup{color:#374151 !important;}
    :root:not([data-theme="dark"]) .result-matchup span{color:#111827 !important;}
    :root:not([data-theme="dark"]) .result-score{color:#111827 !important;}
    :root:not([data-theme="dark"]) .result-date{color:#6b7280 !important;}
    :root:not([data-theme="dark"]) .next-game-label{color:#d97706 !important;}
    :root:not([data-theme="dark"]) .next-game-info{color:#374151 !important;}
    :root:not([data-theme="dark"]) .no-recent{color:#6b7280 !important;}
    :root:not([data-theme="dark"]) .status-final{background:rgba(0,0,0,0.07) !important;color:#374151 !important;border:1px solid rgba(0,0,0,0.15) !important;}
    :root:not([data-theme="dark"]) .status-offseason{background:rgba(0,0,0,0.07) !important;color:#6b7280 !important;border:1px solid rgba(0,0,0,0.12) !important;}
    :root:not([data-theme="dark"]) .status-upcoming{background:rgba(180,120,0,.1) !important;color:#92400e !important;border:1px solid rgba(180,120,0,.25) !important;}
    :root:not([data-theme="dark"]) .status-live,:root:not([data-theme="dark"]) .status-starting{background:rgba(22,163,74,.12) !important;color:#15803d !important;border-color:rgba(22,163,74,.35) !important;}
    :root:not([data-theme="dark"]) .pulse-dot{background:#16a34a !important;}
    :root:not([data-theme="dark"]) .streak-w{background:rgba(22,163,74,.12) !important;color:#15803d !important;border-color:rgba(22,163,74,.3) !important;}
    :root:not([data-theme="dark"]) .streak-l{background:rgba(220,38,38,.1) !important;color:#b91c1c !important;border-color:rgba(220,38,38,.25) !important;}
    :root:not([data-theme="dark"]) .streak-d{background:rgba(180,120,0,.1) !important;color:#92400e !important;border-color:rgba(180,120,0,.25) !important;}
    :root:not([data-theme="dark"]) .result-wl.win{color:#15803d !important;}
    :root:not([data-theme="dark"]) .result-wl.loss{color:#b91c1c !important;}
    :root:not([data-theme="dark"]) .result-wl.draw{color:#92400e !important;}
    :root:not([data-theme="dark"]) .news-header-title{color:#111827 !important;}
    :root:not([data-theme="dark"]) .news-item-title{color:#111827 !important;}
    :root:not([data-theme="dark"]) .news-time{color:#6b7280 !important;}
    :root:not([data-theme="dark"]) footer{color:#4b5563 !important;}

<body>

</footer>

<!-- Live Score Modal -->
<div id="live-modal" role="dialog" aria-modal="true" aria-label="Live game score">

<script>
const TEAMS = {
  eagles:   { name:'Eagles',   sport:'NFL', icon:'🦅', color:'#004C54', path:'football/nfl',   teamId:'21'    },
  sixers:   { name:'76ers',    sport:'NBA', icon:'🏀', color:'#006BB6', path:'basketball/nba', teamId:'20'    },
  flyers:   { name:'Flyers',   sport:'NHL', icon:'🏒', color:'#F74902', path:'hockey/nhl',     teamId:'15'    },
  phillies: { name:'Phillies', sport:'MLB', icon:'⚾', color:'#E81828', path:'baseball/mlb',   teamId:'22'    },
  union:    { name:'Union',    sport:'MLS', icon:'⚽', color:'#8b6914', path:'soccer/usa.1',   teamId:'10739' },
};
const TEAM_ORDER = ['eagles','sixers','flyers','phillies','union'];

const NEWS_FEEDS = [
  { team:'Sixers',   color:'#006BB6', url:'https://www.libertyballers.com/rss/index.xml'     },
  { team:'Eagles',   color:'#004C54', url:'https://www.bleedinggreennation.com/rss/index.xml' },
  { team:'Flyers',   color:'#F74902', url:'https://www.broadstreethockey.com/rss/index.xml'   },
  { team:'Phillies', color:'#E81828', url:'https://www.thegoodphight.com/rss/index.xml'       },
];

function fmtShort(ms){ return new Date(ms).toLocaleDateString('en-US',{month:'short',day:'numeric'}); }
function fmtFull(ms){
  const d = new Date(ms);
  return d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'}) + ', ' +
         d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
}
function parseScore(s){
  if(s==null) return 0;
  if(typeof s==='object') return s.value??parseInt(s.displayValue)??0;
  return parseInt(s)||0;
}
async function espnFetch(url){
  const r = await fetch(url);
  if(!r.ok) throw new Error('ESPN '+r.status);
  return r.json();
}

function parseEvent(ev, teamId){
  const comp = ev.competitions?.[0];
  if(!comp) return null;
  const us   = comp.competitors?.find(c=>String(c.team?.id)===String(teamId));
  const them = comp.competitors?.find(c=>String(c.team?.id)!==String(teamId));
  if(!us||!them) return null;
  const status    = comp.status??ev.status;
  const state     = status?.type?.state;
  const completed = !!status?.type?.completed;
  const detail    = status?.type?.shortDetail||'';
  const dateMs    = new Date(ev.date).getTime();
  const now       = Date.now();
  const isHome    = us.homeAway==='home';
  const oppAbbr   = (them.team?.abbreviation||'OPP').toUpperCase();
  const oppId     = String(them.team?.id||'');
  const phiScore  = (completed||state==='in') ? parseScore(us.score)   : null;
  const oppScore  = (completed||state==='in') ? parseScore(them.score) : null;
  const getRecord = c=>(c.record?.find(r=>r.type==='total')||c.record?.find(r=>r.type==='ytd')||c.record?.[0])?.displayValue||null;
  const phiRecord = getRecord(us);
  const oppRecord = getRecord(them);
  const venue     = comp.venue ? comp.venue.fullName+', '+comp.venue.address?.city : null;
  const featuredStatus =
    state==='in'                              ? 'live'     :
    completed                                 ? 'final'    :
    state==='pre' && dateMs<=now              ? 'starting' :
    state==='pre' && dateMs<=now+4*60*60*1000 ? 'upcoming' :
    state==='pre'                             ? 'final'    : 'offseason';
  const note =
    state==='in'                ? detail :
    featuredStatus==='starting' ? 'Starting now…' :
    state==='pre'               ? fmtFull(dateMs) :
                                  detail||'Final';
  return { featuredStatus, isHome, oppAbbr, oppId, phiScore, oppScore, phiRecord, oppRecord, venue, dateMs, note, completed };
}

function nextSeasonNote(path){
  const yr = new Date().getFullYear();
  if(path.startsWith('football/nfl')){
    const sep1 = new Date(yr,8,1);
    const ft = new Date(sep1);
    ft.setDate(1+(4-sep1.getDay()+7)%7);
    return 'Next season starts ~'+ft.toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});
  }
  if(path.startsWith('baseball/mlb')) return 'Spring Training underway · Regular season starts late March';
  return 'Season has ended';
}

// Cache for opponent records fetched on demand
const oppRecordCache = {};

// Opponent color cache — stored in localStorage with 7-day TTL
const OPP_COLOR_TTL = 7 * 24 * 60 * 60 * 1000;
const oppColorCache = {};
(()=>{
  try {
    const stored = JSON.parse(localStorage.getItem('oppColors')||'{}');
    const now = Date.now();
    Object.entries(stored).forEach(([id, entry]) => {
      if(now - entry.ts < OPP_COLOR_TTL) oppColorCache[id] = entry.color;
    });
  } catch(e) { /* localStorage unavailable (e.g. file://) — use in-memory cache only */ }
})();
function saveOppColors(){
  try {
    const now = Date.now();
    const out = {};
    Object.entries(oppColorCache).forEach(([id, color]) => { out[id] = { color, ts: now }; });
    localStorage.setItem('oppColors', JSON.stringify(out));
  } catch(e) { /* ignore */ }
}
async function fetchOppColor(path, oppId){
  if(!oppId) return null;
  if(oppColorCache[oppId] !== undefined) return oppColorCache[oppId];
  try {
    const base = 'https://site.api.espn.com/apis/site/v2/sports/'+path;
    const d = await espnFetch(base+'/teams/'+oppId).catch(()=>null);
    const hex = d?.team?.color ? '#'+d.team.color : null;
    oppColorCache[oppId] = hex;
    saveOppColors();
    return hex;
  } catch(e) { return null; }
}
async function fetchOppRecord(path, oppId){
  if(!oppId || oppRecordCache[oppId] !== undefined) return oppRecordCache[oppId]||null;
  try{
    const base = 'https://site.api.espn.com/apis/site/v2/sports/'+path;
    const d = await espnFetch(base+'/teams/'+oppId+'/schedule').catch(()=>null);
    const events = d?.events||d?.team?.events||[];
    const last = [...events].reverse().find(e=>e.competitions?.[0]?.status?.type?.completed);
    const comp = last?.competitions?.[0];
    const them = comp?.competitors?.find(c=>String(c.team?.id)===String(oppId));
    const getRecord = c=>(c?.record?.find(r=>r.type==='total')||c?.record?.find(r=>r.type==='ytd')||c?.record?.[0])?.displayValue||null;
    oppRecordCache[oppId] = getRecord(them);
  } catch(e){ oppRecordCache[oppId] = null; }
  return oppRecordCache[oppId]||null;
}

let mlsRecords = {};
(async()=>{
  try{
    const d = await espnFetch('https://site.api.espn.com/apis/v2/sports/soccer/usa.1/standings');
    const entries = d.children?.flatMap(c=>c.standings?.entries||[])||[];
    entries.forEach(e=>{
      const overall = e.stats?.find(s=>s.name==='overall')?.displayValue;
      if(e.team?.id && overall) mlsRecords[String(e.team.id)] = overall;
    });
  } catch(err){ console.warn('MLS standings fetch failed', err); }
})();

async function fetchTeamData(key){
  const { path, teamId } = TEAMS[key];
  const base     = 'https://site.api.espn.com/apis/site/v2/sports/'+path;
  const isSoccer = path.startsWith('soccer');
  let schRes = null;
  if(isSoccer){
    const [sbBoard, teamInfo] = await Promise.all([
      espnFetch(base+'/scoreboard?dates=20260101-20261231&limit=300').catch(()=>null),
      espnFetch(base+'/teams/'+teamId+'/schedule').catch(()=>null),
    ]);
    if(sbBoard?.events){
      schRes = {
        season: teamInfo?.season||sbBoard.leagues?.[0]?.season||{type:2},
        team:   teamInfo?.team||{id:teamId},
        events: sbBoard.events.filter(e=>e.competitions?.[0]?.competitors?.some(c=>String(c.team?.id)===String(teamId))),
      };
    }
  } else {
    schRes = await espnFetch(base+'/teams/'+teamId+'/schedule').catch(()=>null);
  }
  const sbRes = await espnFetch(base+'/scoreboard').catch(()=>null);
  const now   = Date.now();
  const seasonType  = schRes?.season?.type;
  const isOffseason = (typeof seasonType==='object' ? seasonType?.type : seasonType)===4;
  const rawEvents   = schRes?.events||schRes?.team?.events||[];
  const schedEvents = [...rawEvents].sort((a,b)=>new Date(a.date)-new Date(b.date));

  const recentGames = [];
  let lastCompleted = null;
  let nextGame      = null;
  for(const ev of schedEvents){
    const p = parseEvent(ev, teamId);
    if(!p) continue;
    if(p.completed){
      lastCompleted = p;
      recentGames.push(p);
    } else if(!nextGame && !p.completed){
      if(p.dateMs > now - 30*60*1000) nextGame = p;
    }
  }

  let liveGame = null;
  if(sbRes?.events){
    for(const ev of sbRes.events){
      const p = parseEvent(ev, teamId);
      if(p){ liveGame=p; if(p.featuredStatus==='live') break; }
    }
  }

  const activeLive  = liveGame?.featuredStatus==='live' ? liveGame : null;
  const nextIsClose = nextGame && (nextGame.dateMs - now) <= 4*60*60*1000;
  // Feature the upcoming game if live, or if within 4hrs, or if no completed games yet
  const featured = isOffseason ? null :
    activeLive ? activeLive :
    nextIsClose ? nextGame :
    lastCompleted ? lastCompleted :
    nextGame ? nextGame : null;
  const fs = isOffseason ? 'offseason' :
    !featured ? 'offseason' :
    activeLive ? 'live' :
    (nextIsClose || !lastCompleted) && nextGame ? 'upcoming' :
    featured.featuredStatus;

  const showRecords = fs!=='offseason';
  // For upcoming/pre games, ESPN doesn't return records — carry forward from last completed game
  const phiRecordFallback = lastCompleted?.phiRecord || null;
  // Fetch opponent record whenever it's missing from the featured event (any status)
  const oppRecordFallback = (featured && !featured.oppRecord && featured.oppId && fs!=='offseason')
    ? await fetchOppRecord(path, featured.oppId) : null;
  const soccerPhiRecord = isSoccer ? (mlsRecords[String(teamId)]||schRes?.team?.recordSummary||phiRecordFallback||null) : null;
  const soccerOppRecord = isSoccer ? (mlsRecords[featured?.oppId||'']||null) : null;

  let streak = null;
  const allCompleted = [...schedEvents].reverse().filter(ev=>parseEvent(ev,teamId)?.completed);
  if(allCompleted.length){
    const outcomes = allCompleted.map(ev=>{
      const p=parseEvent(ev,teamId);
      return p.phiScore>p.oppScore?'W':p.phiScore<p.oppScore?'L':'D';
    });
    let count=1;
    for(let i=1;i<outcomes.length;i++){ if(outcomes[i]===outcomes[0]) count++; else break; }
    streak = outcomes[0]+count;
  }

  const completedDateMs = lastCompleted?.dateMs||0;

  // Recent games: when showing upcoming as featured, include lastCompleted in recent
  const recentFiltered = isOffseason ? [] : recentGames
    .slice(-3).reverse();

  return {
    featuredStatus: fs,
    completedDateMs,
    featured: featured ? {
      label:     fs==='live' ? 'LIVE NOW' : fs==='starting' ? 'STARTING NOW' : fs==='upcoming' ? 'NEXT GAME' : null,
      oppAbbr:   featured.oppAbbr,
      oppId:     featured.oppId||null,
      phiScore:  featured.phiScore,
      oppScore:  featured.oppScore,
      note:      featured.note,
      venue:     featured.venue||null,
      phiRecord: showRecords ? (soccerPhiRecord||featured.phiRecord||phiRecordFallback||null) : null,
      oppRecord: showRecords ? (soccerOppRecord||featured.oppRecord||oppRecordFallback||null) : null,
      oppColor:  (await fetchOppColor(path, featured?.oppId||''))||null,
    } : null,
    recentGames: recentFiltered.map(g=>({opp:g.oppAbbr,home:g.isHome,phiScore:g.phiScore,oppScore:g.oppScore,date:fmtShort(g.dateMs)})),
    nextGame: nextGame && fs!=='starting' && fs!=='live' && !nextIsClose
      ? (nextGame.isHome?'vs':'@')+' '+nextGame.oppAbbr+' · '+fmtFull(nextGame.dateMs) : null,
    nextGameToday: nextGame ? new Date(nextGame.dateMs).toDateString()===new Date().toDateString() : false,
    featuredDateMs: featured?.dateMs||0,
    nextGameDateMs: nextGame?.dateMs||0,
    streak:   isOffseason ? null : streak,
    standing: isOffseason ? null : (schRes?.team?.standingSummary||null),
    offseasonNote: fs==='offseason' ? (isOffseason ? nextSeasonNote(path) : 'No upcoming schedule found') : null,
  };
}

// ── News ──
const RSS_PROXY = 'https://api.rss2json.com/v1/api.json?rss_url=';
let newsCache = { items:[], fetchedAt:0 };
const NEWS_TTL = 5*60*1000;
function parseRssDate(str){ if(!str) return 0; return new Date(str.replace(' ','T')+'Z').getTime()||0; }
function timeAgo(dateStr){
  const diff = Date.now()-parseRssDate(dateStr);
  if(diff<0||diff<60000) return 'just now';
  const mins=Math.floor(diff/60000);
  if(mins<60) return mins+'m ago';
  const hrs=Math.round(mins/60);
  if(hrs<24) return hrs+'h ago';
  return Math.floor(hrs/24)+'d ago';
}
async function fetchNews(){
  if(Date.now()-newsCache.fetchedAt<NEWS_TTL) return newsCache.items;
  try{
    const results = await Promise.all(NEWS_FEEDS.map(async feed=>{
      const d = await fetch(RSS_PROXY+encodeURIComponent(feed.url)+'&_='+Math.floor(Date.now()/300000)).then(r=>r.json()).catch(()=>null);
      return (d?.items||[]).slice(0,5).map(item=>({title:item.title?.trim(),link:item.link,pubDate:item.pubDate,team:feed.team,color:feed.color}));
    }));
    const merged = results.flat().filter(i=>i.title&&i.pubDate).sort((a,b)=>parseRssDate(b.pubDate)-parseRssDate(a.pubDate)).slice(0,5);
    newsCache = { items:merged, fetchedAt:Date.now() };
    return merged;
  } catch(err){ console.warn('News fetch failed',err); return newsCache.items; }
}
function renderNewsCard(items){
  const content = items.length
    ? items.map(item=>'<a class="news-item" href="'+item.link+'" target="_blank" rel="noopener"><div class="news-item-title">'+item.title+'</div><div class="news-item-meta"><span class="news-team-tag" style="background:'+item.color+'22;color:'+item.color+';border:1px solid '+item.color+'44">'+item.team+'</span><span class="news-time">'+timeAgo(item.pubDate)+'</span></div></a>').join('')
    : '<div class="news-loading">Loading headlines…</div>';
  return '<div class="news-card"><div class="news-header"><span class="news-header-icon">📰</span><span class="news-header-title">Philly Sports News</span></div>'+content+'</div>';
}

// ── Modal ──
let modalOpenKey = null;

function syncModalStatus(){
  const dot = document.getElementById('status-dot');
  const mDot = document.getElementById('modal-status-dot');
  const mTime = document.getElementById('modal-update-time');
  const mCD = document.getElementById('modal-countdown');
  if(mDot) mDot.className = dot.className;
  if(mTime) mTime.textContent = document.getElementById('update-time').textContent;
  if(mCD) mCD.textContent = document.getElementById('countdown').textContent;
}

function updateModalScores(key){
  const data = _cardData[key];
  if(!data?.featured) return;
  const f = data.featured;
  const phiS = f.phiScore??0, oppS = f.oppScore??0;
  const phiEl = document.getElementById('modal-phi-score');
  const oppEl = document.getElementById('modal-opp-score');
  if(phiEl){ phiEl.textContent=phiS; phiEl.className='modal-team-score'+(phiS>oppS?' modal-winner':''); }
  if(oppEl){
    oppEl.textContent=oppS;
    oppEl.className='modal-team-score'+(oppS>phiS?' modal-winner':'');
    oppEl.style.color = (oppS>phiS && data.featured?.oppColor) ? data.featured.oppColor : '';
  }
  const noteEl = document.getElementById('modal-game-note');
  if(noteEl) noteEl.textContent = f.note||'';
  syncModalStatus();
}

function openModal(key, data){
  if(window.innerWidth<=768) return;
  const team = TEAMS[key];
  const f = data?.featured;
  if(!f) return;
  modalOpenKey = key;
  const inner = document.getElementById('live-modal-inner');
  inner.style.setProperty('--modal-color', team.color);
  const sportEl = document.getElementById('modal-sport-text');
  const oppEl   = document.getElementById('modal-opp-abbr');
  if(sportEl) sportEl.textContent = team.sport+' · LIVE NOW';
  if(oppEl)   oppEl.textContent   = f.oppAbbr;
  updateModalScores(key);
  const modal = document.getElementById('live-modal');
  modal.classList.add('open');
  document.body.style.overflow = 'hidden';
  modal._onKeyDown = e=>{ if(e.key==='Escape') closeModal(); };
  document.addEventListener('keydown', modal._onKeyDown);
  modal._onBgClick = e=>{ if(e.target===modal) closeModal(); };
  modal.addEventListener('click', modal._onBgClick);
}

function closeModal(){
  modalOpenKey = null;
  const modal = document.getElementById('live-modal');
  modal.classList.remove('open');
  document.body.style.overflow = '';
  if(modal._onKeyDown) document.removeEventListener('keydown', modal._onKeyDown);
  if(modal._onBgClick) modal.removeEventListener('click', modal._onBgClick);
}

// ── Rendering ──
const _cardData = {};

function showSkeletons(){
  document.getElementById('cards-container').innerHTML=TEAM_ORDER.map(()=>'<div class="skeleton-card"><div class="skeleton-header"><div class="sk sk-circle"></div><div style="flex:1;display:flex;flex-direction:column;gap:8px"><div class="sk sk-line" style="width:60%"></div><div class="sk sk-line" style="width:35%;height:10px"></div></div></div><div class="sk-body"><div class="sk sk-line" style="height:60px"></div><div class="sk sk-line" style="width:80%"></div><div class="sk sk-line" style="width:65%"></div><div class="sk sk-line" style="width:72%"></div></div></div>').join('');
}
function setStatus(state,text){
  document.getElementById('status-dot').className='pulse-dot'+(state!=='ok'?' '+state:'');
  document.getElementById('update-time').textContent=text;
}
function showError(msg){document.getElementById('error-banner').style.display='block';document.getElementById('error-banner-inner').textContent='⚠ '+msg;}
function hideError(){document.getElementById('error-banner').style.display='none';}

function scoreHtml(score, winner, upcoming, isPhi, oppColor){
  if(upcoming||score===null) return '<div class="team-score no-score">&ndash;</div>';
  if(winner&&isPhi)  return '<div class="team-score winner">'+score+'</div>';
  if(winner&&!isPhi) return '<div class="team-score opp-winning"'+(oppColor?' style="color:'+oppColor+'"':'')+'>'+score+'</div>';
  return '<div class="team-score">'+score+'</div>';
}

function renderCard(key,data){
  _cardData[key] = data;
  const {name,sport,icon,color} = TEAMS[key];
  const fs          = data.featuredStatus||'offseason';
  const statusLabel = {live:'● Live',starting:'● Starting',final:'Final',upcoming:'Upcoming',offseason:'Off-Season'}[fs]||'Off-Season';
  const statusCls   = {live:'status-live',starting:'status-starting',final:'status-final',upcoming:'status-upcoming',offseason:'status-offseason'}[fs]||'status-offseason';
  const streakCls   = data.streak?.startsWith('W')?'streak-w':data.streak?.startsWith('L')?'streak-l':'streak-d';
  const isLive      = fs==='live'||fs==='starting';
  const clickAttr   = isLive ? ' onclick="openModal(\''+key+'\',_cardData[\''+key+'\'])"' : '';

  let featuredHtml = '';
  if(data.featured && fs!=='offseason'){
    const f=data.featured, upcoming=fs==='upcoming';
    const phiWins=!upcoming&&f.phiScore>f.oppScore;
    const oppWins=!upcoming&&f.oppScore>f.phiScore;
    const oc=f.oppColor||null;
    featuredHtml = '<div class="featured-game">'+(f.label?'<div class="game-label">'+f.label+'</div>':'')+'<div class="matchup"><div class="team-side"><div class="team-abv">PHI</div>'+scoreHtml(f.phiScore,phiWins,upcoming,true,null)+(f.phiRecord?'<div class="team-record">'+f.phiRecord+'</div>':'')+'</div><div class="vs-divider"><div class="vs-line"></div><div class="vs-text">VS</div><div class="vs-line"></div></div><div class="team-side"><div class="team-abv">'+f.oppAbbr+'</div>'+scoreHtml(f.oppScore,oppWins,upcoming,false,oc)+(f.oppRecord?'<div class="team-record">'+f.oppRecord+'</div>':'')+'</div></div><div class="game-info-row">'+f.note+(f.venue?' · '+f.venue:'')+'</div></div>';
  } else {
    featuredHtml = '<div class="featured-game" style="text-align:center;padding:24px 20px"><div style="font-size:36px;margin-bottom:8px">🏆</div><div style="font-family:\'Bebas Neue\',sans-serif;font-size:18px;color:#4b5563;letter-spacing:.08em">Season Complete</div>'+(data.offseasonNote?'<div style="font-size:11px;color:#6b7280;margin-top:6px;font-family:\'DM Mono\',monospace">'+data.offseasonNote+'</div>':'')+'</div>';
  }

  const recentHtml = data.recentGames?.length
    ? data.recentGames.map(g=>{ const r=g.phiScore>g.oppScore?{c:'win',l:'W'}:g.phiScore<g.oppScore?{c:'loss',l:'L'}:{c:'draw',l:'D'}; return '<div class="result-row"><div class="result-matchup">'+(g.home?'vs':'@')+' <span>'+g.opp+'</span></div><div class="result-score">'+g.phiScore+'&ndash;'+g.oppScore+'</div><div class="result-wl '+r.c+'">'+r.l+'</div><div class="result-date">'+g.date+'</div></div>'; }).join('')
    : '<div class="no-recent">No recent games</div>';

  const nextHtml = data.nextGame
    ? '<div class="next-game-row'+(data.nextGameToday?' today':'')+'"><div class="next-game-label">Next &#9654;</div><div class="next-game-info">'+data.nextGame+(data.nextGameToday?'<span class="today-badge">TODAY</span>':'')+'</div></div>'
    : '';

  return '<div class="team-card'+(isLive?' is-live':'')+'" style="--team-color:'+color+'"'+clickAttr+'>'
    +'<div class="card-header"><div class="team-icon">'+icon+'</div><div class="team-meta"><div class="team-name">'+name+'</div><div class="team-sport">'+sport+'</div>'+(data.standing?'<div class="team-sport" style="margin-top:2px">'+data.standing+'</div>':'')+'</div><div style="display:flex;flex-direction:column;align-items:flex-end;gap:5px"><span class="card-status '+statusCls+'">'+statusLabel+'</span>'+(data.streak?'<span class="streak '+streakCls+'">'+data.streak+'</span>':'')+'</div></div>'
    +featuredHtml
    +'<div class="recent-results"><div class="results-label">Recent Games</div>'+recentHtml+nextHtml+'</div>'
    +(isLive?'<div class="live-expand-hint">⛶ Click to expand</div>':'')
    +'</div>';
}

// ── Theme ──
const THEMES=['device','light','dark'];
const THEME_ICONS={device:'🖥️',light:'☀️',dark:'🌙'};
function cycleTheme(){
  const cur=localStorage.getItem('colorScheme')||'device';
  applyTheme(THEMES[(THEMES.indexOf(cur)+1)%THEMES.length]);
}
function applyTheme(theme){
  localStorage.setItem('colorScheme',theme);
  const root=document.documentElement;
  if(theme==='dark') root.setAttribute('data-theme','dark');
  else if(theme==='light') root.setAttribute('data-theme','light');
  else root.removeAttribute('data-theme');
  document.getElementById('theme-icon').textContent=THEME_ICONS[theme];
}
applyTheme(localStorage.getItem('colorScheme')||'device');

// ── Countdown & refresh ──
let countdownSeconds=300, countdownInterval=null, refreshTimeout=null, prevScores={};

function getRefreshInterval(scores){
  const vals=Object.values(scores);
  const now=Date.now();
  if(vals.some(s=>s.featuredStatus==='live'||s.featuredStatus==='starting')) return 30;
  const in15=now+15*60*1000, ago30=now-30*60*1000;
  if(vals.some(s=>s.nextGameDateMs>ago30&&s.nextGameDateMs<=in15)) return 30;
  const in60=now+60*60*1000;
  if(vals.some(s=>s.nextGameDateMs>now&&s.nextGameDateMs<=in60)) return 900;
  return 1800;
}

function startCountdown(seconds){
  countdownSeconds=seconds;
  clearInterval(countdownInterval);
  countdownInterval=setInterval(()=>{
    countdownSeconds--;
    if(countdownSeconds<0) countdownSeconds=0;
    const m=Math.floor(countdownSeconds/60);
    const s=String(countdownSeconds%60).padStart(2,'0');
    const txt=m+':'+s;
    document.getElementById('countdown').textContent=txt;
    const modal=document.getElementById('live-modal');
    if(modal?.classList.contains('open')){
      const mCD=document.getElementById('modal-countdown');
      if(mCD) mCD.textContent=txt;
    }
  },1000);
}

function scheduleNextRefresh(scores){
  clearTimeout(refreshTimeout);
  const secs=getRefreshInterval(scores);
  startCountdown(secs);
  refreshTimeout=setTimeout(fetchScores,secs*1000);
}

async function fetchScores(){
  const btn=document.getElementById('refresh-btn');
  btn.disabled=true; btn.classList.add('spinning');
  hideError(); setStatus('loading','Fetching live scores…'); showSkeletons();
  try{
    const [results,newsItems] = await Promise.all([
      Promise.allSettled(TEAM_ORDER.map(k=>fetchTeamData(k))),
      fetchNews(),
    ]);
    const scores={};
    TEAM_ORDER.forEach((k,i)=>{
      scores[k]=results[i].status==='fulfilled'
        ?results[i].value
        :{featuredStatus:'offseason',featured:null,recentGames:[],nextGame:null,completedDateMs:0,offseasonNote:'Data unavailable',featuredDateMs:0,nextGameDateMs:0};
    });
    const rank=s=>({live:0,starting:0,upcoming:1,final:2,offseason:3}[s]??3);
    const sorted=TEAM_ORDER.map(k=>({key:k,data:scores[k]})).sort((a,b)=>{
      const rd=rank(a.data.featuredStatus)-rank(b.data.featuredStatus);
      if(rd!==0) return rd;
      return (b.data.completedDateMs||0)-(a.data.completedDateMs||0);
    });
    document.getElementById('cards-container').innerHTML=sorted.map(({key,data})=>renderCard(key,data)).join('')+renderNewsCard(newsItems);

    // Flash cards on score change, update modal if open
    TEAM_ORDER.forEach(k=>{
      const curr=scores[k]?.featured, prev=prevScores[k]?.featured;
      if(curr&&prev&&(curr.phiScore!==prev.phiScore||curr.oppScore!==prev.oppScore)){
        document.querySelectorAll('.team-card').forEach(card=>{
          if(card.querySelector('.team-name')?.textContent===TEAMS[k].name){
            card.classList.remove('score-changed');
            void card.offsetWidth;
            card.classList.add('score-changed');
          }
        });
      }
    });

    // Always update modal if open
    if(modalOpenKey){
      const modal=document.getElementById('live-modal');
      if(modal?.classList.contains('open')) updateModalScores(modalOpenKey);
    }

    prevScores=scores;
    const t=new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
    setStatus('ok','Updated '+t);
    syncModalStatus();
    scheduleNextRefresh(scores);
  }catch(err){
    console.error(err);
    setStatus('error','Update failed');
    showError('Could not fetch scores: '+err.message);
  }finally{
    btn.disabled=false; btn.classList.remove('spinning');
  }
}

fetchScores();
</script>
