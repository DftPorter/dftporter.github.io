<!DOCTYPE html>
<html lang="en">
<title>Spa Care</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<meta name="theme-color" content="#e3eef2">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Spa Care">
<meta name="mobile-web-app-capable" content="yes">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root {
    --bg-top: oklch(96% 0.022 205);
    --bg-bottom: oklch(98.5% 0.008 95);
    --surface: oklch(100% 0 0);
    --border: oklch(92% 0.012 225);
    --rule: oklch(94% 0.01 225);
    --track: oklch(93% 0.01 225);
    --text: oklch(26% 0.03 235);
    --text-strong: oklch(22% 0.035 235);
    --text-muted: oklch(46% 0.02 235);
    --text-faint: oklch(54% 0.02 235);
    --accent: oklch(48% 0.11 210);
    --accent-hover: oklch(43% 0.11 210);
    --btn-border: oklch(88% 0.012 230);
    --hover-tint: oklch(96.5% 0.012 220);
  }

  * { box-sizing: border-box; }

  html, body { margin: 0; }

  body {
    min-height: 100vh;
    background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 46%, var(--bg-bottom) 100%);
    color: var(--text);
    font-family: 'Work Sans', system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    justify-content: center;
  }

  .page {
    width: 100%;
    max-width: 430px;
    padding: calc(26px + env(safe-area-inset-top)) 18px calc(96px + env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
  }

  .wordmark {
    font-family: 'Instrument Serif', Georgia, serif;
    font-size: 28px;
    letter-spacing: -0.01em;
    color: var(--text-strong);
  }

  .date-line {
    font-size: 12.5px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-muted);
  }

  .focus {
    border-radius: 26px;
    padding: 22px 20px 20px;
    background: var(--surface);
    box-shadow: 0 1px 2px oklch(30% 0.03 240 / 0.06), 0 14px 34px oklch(30% 0.04 240 / 0.1);
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .focus-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .eyebrow {
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: oklch(52% 0.1 210);
  }

  .badge {
    font-size: 13px;
    font-weight: 600;
    padding: 6px 12px;
    border-radius: 999px;
    white-space: nowrap;
  }

  .focus-main {
    display: flex;
    align-items: center;
    gap: 18px;
  }

  .icon-tile {
    flex-shrink: 0;
    width: 86px;
    height: 86px;
    border-radius: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .icon-tile svg { width: 44px; height: 44px; }

  .focus-titles {
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  h1 {
    margin: 0;
    font-family: 'Instrument Serif', Georgia, serif;
    font-weight: 400;
    font-size: 36px;
    line-height: 1.04;
    letter-spacing: -0.015em;
    text-wrap: balance;
    color: var(--text-strong);
  }

  .interval {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-faint);
  }

  .focus-meta { font-size: 14px; color: var(--text-muted); }

  .row-actions { display: flex; gap: 10px; }

  .primary-btn {
    flex: 1;
    min-height: 52px;
    border: 0;
    border-radius: 16px;
    background: var(--accent);
    color: oklch(99% 0.01 210);
    font-family: inherit;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.06s ease, background 0.15s ease;
  }

  .primary-btn:hover { background: var(--accent-hover); }
  .primary-btn:active { transform: scale(0.985); }

  .date-picker {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 52px;
    min-height: 52px;
    border-radius: 16px;
    border: 1.5px solid var(--btn-border);
    color: var(--text-muted);
    cursor: pointer;
  }

  .date-picker:hover { background: var(--hover-tint); }
  .date-picker svg { width: 20px; height: 20px; pointer-events: none; }

  .date-picker input[type="date"] {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    opacity: 0;
    border: 0;
    padding: 0;
    margin: 0;
    cursor: pointer;
    color-scheme: light;
  }

  section.block { display: flex; flex-direction: column; gap: 10px; }

  .section-label {
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text-faint);
  }

  .block-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
  }

  .count-line { font-size: 12.5px; color: var(--text-muted); }

  .peek { display: flex; gap: 10px; }

  .peek-card {
    flex: 1;
    min-width: 0;
    padding: 14px;
    border-radius: 18px;
    background: var(--surface);
    border: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .dot { width: 9px; height: 9px; border-radius: 999px; }

  .peek-name { font-size: 14.5px; font-weight: 500; line-height: 1.25; color: var(--text); }
  .peek-status { font-size: 12.5px; color: var(--text-muted); }

  .list {
    border-radius: 20px;
    background: var(--surface);
    border: 1px solid var(--border);
    overflow: hidden;
    box-shadow: 0 1px 2px oklch(30% 0.03 240 / 0.04);
  }

  .row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 13px 12px 13px 16px;
  }

  .row + .row { border-top: 1px solid var(--rule); }

  .row-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px; }
  .row-top { display: flex; align-items: baseline; gap: 8px; }

  .row-name {
    font-size: 15px;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    color: var(--text);
  }

  .row-status { font-size: 12px; font-weight: 600; white-space: nowrap; }

  .track { height: 4px; border-radius: 999px; background: var(--track); overflow: hidden; }
  .fill { height: 100%; border-radius: 999px; transition: width 0.25s ease, background 0.25s ease; }

  .row-meta { font-size: 12px; color: var(--text-faint); }

  .row .date-picker {
    width: 44px;
    min-height: 44px;
    height: 44px;
    border: 0;
    border-radius: 12px;
    color: var(--text-faint);
  }

  .row .date-picker svg { width: 18px; height: 18px; }

  .check-btn {
    width: 44px;
    height: 44px;
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 12px;
    border: 1.5px solid var(--btn-border);
    background: var(--surface);
    color: var(--accent);
    cursor: pointer;
  }

  .check-btn:hover { background: oklch(96% 0.02 210); }
  .check-btn svg { width: 18px; height: 18px; }

  .storage-note {
    text-align: center;
    font-size: 12px;
    color: var(--text-faint);
    padding-top: 4px;
  }

  .toast-wrap {
    position: fixed;
    left: 0;
    right: 0;
    bottom: calc(20px + env(safe-area-inset-bottom));
    display: flex;
    justify-content: center;
    padding: 0 18px;
    pointer-events: none;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 0.18s ease, transform 0.18s ease;
  }

  .toast-wrap[data-show="1"] { opacity: 1; transform: translateY(0); }

  .toast {
    display: flex;
    align-items: center;
    gap: 14px;
    max-width: 394px;
    width: 100%;
    padding: 10px 10px 10px 16px;
    border-radius: 16px;
    background: oklch(28% 0.03 235);
    color: oklch(97% 0.01 235);
    box-shadow: 0 10px 30px oklch(25% 0.04 240 / 0.28);
    pointer-events: auto;
  }

  .toast-label {
    flex: 1;
    min-width: 0;
    font-size: 13.5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .undo-btn {
    flex-shrink: 0;
    min-height: 40px;
    padding: 0 16px;
    border: 0;
    border-radius: 12px;
    background: oklch(100% 0 0 / 0.14);
    color: oklch(99% 0.01 210);
    font-family: inherit;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
  }

  .undo-btn:hover { background: oklch(100% 0 0 / 0.22); }

  .primary-btn:focus-visible,
  .check-btn:focus-visible,
  .undo-btn:focus-visible,
  .date-picker:focus-within {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  @media (prefers-reduced-motion: reduce) {
    .fill, .primary-btn, .toast-wrap { transition: none; }
  }
</style>

<body>
<div class="page">
  <header>
    <div class="wordmark">Spa Care</div>
    <div class="date-line" id="date-line"></div>
  </header>

  <section class="focus" id="focus"></section>

  <section class="block">
    <div class="section-label">Then</div>
    <div class="peek" id="peek"></div>
  </section>

  <section class="block">
    <div class="block-head">
      <div class="section-label">All tasks</div>
      <div class="count-line" id="count-line"></div>
    </div>
    <div class="list" id="task-list"></div>
    <div class="storage-note" id="storage-note"></div>
  </section>
</div>

<div class="toast-wrap" id="toast-wrap">
  <div class="toast">
    <div class="toast-label" id="toast-label"></div>
    <button class="undo-btn" type="button" id="undo-btn">Undo</button>
  </div>
</div>

<script>
  const ICONS = {
    filterClean: '<path stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" d="M4 4h16L14 12v7l-4-2v-5L4 4Z"/>',
    chemCheck: '<path stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" d="M9 3h6M10 3v6l-4.3 8a2 2 0 0 0 1.75 3h9.1a2 2 0 0 0 1.75-3L14 9V3M7.5 15h9"/>',
    shock: '<path stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" d="M13 3 5 14h6l-1 7 9-12h-6l1-6Z"/>',
    waterChange: '<path stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" d="M12 3C12 3 6 10.5 6 15a6 6 0 0 0 12 0C18 10.5 12 3 12 3Z"/>',
    filterReplace: '<path stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" d="M20 11A8 8 0 1 0 18.6 16M20 4v6h-6"/>',
    soakFilters: '<path stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" d="M4 9h16v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V9ZM3 9h18M8 13c.6-.6 1.4-.6 2 0s1.4.6 2 0 1.4-.6 2 0 1.4.6 2 0"/>'
  };

  const CAL_ICON = '<svg viewBox="0 0 24 24" fill="none"><path stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" d="M8 3v3M16 3v3M4.5 9.5h15M5.5 6h13A1.5 1.5 0 0 1 20 7.5V19a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 19V7.5A1.5 1.5 0 0 1 5.5 6Z"/></svg>';

  const TASKS = [
    { key: 'filterClean', name: 'Clean filter', interval: 7, intervalLabel: 'Every 7 days', defaultDaysAgo: 3 },
    { key: 'chemCheck', name: 'Check chemical balance', interval: 3, intervalLabel: 'Every 3 days', defaultDaysAgo: 1 },
    { key: 'shock', name: 'Shock treatment', interval: 7, intervalLabel: 'Every 7 days', defaultDaysAgo: 9 },
    { key: 'waterChange', name: 'Change water', interval: 120, intervalLabel: 'Every ~4 months', defaultDaysAgo: 132 },
    { key: 'filterReplace', name: 'Swap filter', interval: 30, intervalLabel: 'Every 30 days', defaultDaysAgo: 15 },
    { key: 'soakFilters', name: 'Soak filters', interval: 30, intervalLabel: 'Every 30 days', defaultDaysAgo: 12 }
  ];

  const STORAGE_KEY = 'spa-care:last-done:v1';
  const pad = (n) => String(n).padStart(2, '0');
  const fmt = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;

  function minusDays(days) {
    const d = new Date();
    d.setDate(d.getDate() - days);
    return fmt(d);
  }

  function daysSince(dateStr) {
    const [y, m, d] = dateStr.split('-').map(Number);
    const then = new Date(y, m - 1, d);
    then.setHours(0, 0, 0, 0);
    const now = new Date();
    now.setHours(0, 0, 0, 0);
    return Math.round((now - then) / 86400000);
  }

  function storageAvailable() {
    try {
      localStorage.setItem('__spa_care_test__', '1');
      localStorage.removeItem('__spa_care_test__');
      return true;
    } catch (e) { return false; }
  }

  const CAN_PERSIST = storageAvailable();
  let done = {};
  try {
    const raw = CAN_PERSIST ? localStorage.getItem(STORAGE_KEY) : null;
    done = raw ? JSON.parse(raw) : {};
  } catch (e) { done = {}; }
  TASKS.forEach((t) => { if (!done[t.key]) done[t.key] = minusDays(t.defaultDaysAgo); });

  function persist() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(done)); } catch (e) {}
  }

  function statusFor(daysAgo, interval) {
    const ratio = daysAgo / interval;
    const left = Math.max(1, Math.round(interval - daysAgo));
    if (ratio > 1) {
      const over = Math.round(daysAgo - interval);
      return { label: over <= 1 ? 'Overdue' : 'Overdue ' + over + 'd', line: 'oklch(58% 0.16 28)', textStrong: 'oklch(48% 0.16 28)', tintBg: 'oklch(95% 0.035 35)', tintFg: 'oklch(43% 0.15 30)', key: 'overdue' };
    }
    if (ratio >= 0.7) {
      return { label: 'Due in ' + left + 'd', line: 'oklch(70% 0.14 75)', textStrong: 'oklch(52% 0.13 70)', tintBg: 'oklch(96% 0.04 85)', tintFg: 'oklch(44% 0.11 70)', key: 'soon' };
    }
    return { label: 'Due in ' + left + 'd', line: 'oklch(65% 0.13 165)', textStrong: 'oklch(48% 0.11 165)', tintBg: 'oklch(95% 0.035 170)', tintFg: 'oklch(40% 0.1 168)', key: 'ok' };
  }

  function lastDoneText(dateStr, daysAgo) {
    if (daysAgo === 0) return 'Done today';
    const [y, m, d] = dateStr.split('-').map(Number);
    const disp = new Date(y, m - 1, d).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    return 'Last done ' + disp + ' · ' + (daysAgo === 1 ? '1 day ago' : daysAgo + ' days ago');
  }

  function computed() {
    const today = fmt(new Date());
    return TASKS.map((t) => {
      const dateStr = done[t.key];
      const daysAgo = daysSince(dateStr);
      const st = statusFor(daysAgo, t.interval);
      return {
        task: t,
        status: st,
        daysAgo,
        daysLeft: t.interval - daysAgo,
        ratio: daysAgo / t.interval,
        pct: Math.max(5, Math.min(100, Math.round((daysAgo / t.interval) * 100))),
        meta: lastDoneText(dateStr, daysAgo),
        today
      };
    }).sort((a, b) => b.ratio - a.ratio);
  }

  let undoState = null;
  let undoTimer = null;
  const toastWrap = document.getElementById('toast-wrap');
  const toastLabel = document.getElementById('toast-label');

  function showToast(label) {
    toastLabel.textContent = label;
    toastWrap.setAttribute('data-show', '1');
    clearTimeout(undoTimer);
    undoTimer = setTimeout(hideToast, 6000);
  }

  function hideToast() {
    toastWrap.removeAttribute('data-show');
    undoState = null;
  }

  function setDone(key, dateStr, what) {
    if (!dateStr) return;
    const task = TASKS.find((t) => t.key === key);
    undoState = { key, prev: done[key] };
    done[key] = dateStr;
    persist();
    render();
    showToast(task.name + ' · ' + what);
  }

  document.getElementById('undo-btn').addEventListener('click', () => {
    if (!undoState) return;
    done[undoState.key] = undoState.prev;
    persist();
    hideToast();
    clearTimeout(undoTimer);
    render();
  });

  function datePicker(key, today, cls) {
    const wrap = document.createElement('label');
    wrap.className = 'date-picker' + (cls ? ' ' + cls : '');
    wrap.setAttribute('aria-label', 'Set a different last-done date');
    wrap.innerHTML = CAL_ICON;
    const input = document.createElement('input');
    input.type = 'date';
    input.max = today;
    input.addEventListener('change', () => {
      const v = input.value;
      // Defer the re-render so iOS Safari's native picker isn't detached mid-interaction.
      setTimeout(() => setDone(key, v, 'date updated'), 0);
    });
    wrap.appendChild(input);
    return wrap;
  }

  const focusEl = document.getElementById('focus');
  const peekEl = document.getElementById('peek');
  const listEl = document.getElementById('task-list');

  function renderFocus(item) {
    const t = item.task, st = item.status;
    focusEl.innerHTML = `
      <div class="focus-top">
        <div class="eyebrow">Up next</div>
        <div class="badge" style="background:${st.tintBg}; color:${st.tintFg};">${st.label}</div>
      </div>
      <div class="focus-main">
        <div class="icon-tile" style="background:${st.tintBg}; color:${st.tintFg};">
          <svg viewBox="0 0 24 24" fill="none">${ICONS[t.key]}</svg>
        </div>
        <div class="focus-titles">
          <h1>${t.name}</h1>
          <div class="interval">${t.intervalLabel}</div>
        </div>
      </div>
      <div class="focus-meta">${item.meta}</div>
    `;
    const actions = document.createElement('div');
    actions.className = 'row-actions';
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'primary-btn';
    btn.textContent = 'Mark done today';
    btn.addEventListener('click', () => setDone(t.key, item.today, 'marked done today'));
    actions.appendChild(btn);
    actions.appendChild(datePicker(t.key, item.today));
    focusEl.appendChild(actions);
  }

  function renderPeek(items) {
    peekEl.innerHTML = items.map((i) => `
      <div class="peek-card">
        <div class="dot" style="background:${i.status.line};"></div>
        <div class="peek-name">${i.task.name}</div>
        <div class="peek-status">${i.status.label}</div>
      </div>
    `).join('');
  }

  function renderList(items) {
    listEl.innerHTML = '';
    items.forEach((i) => {
      const row = document.createElement('div');
      row.className = 'row';
      row.innerHTML = `
        <div class="row-body">
          <div class="row-top">
            <div class="row-name">${i.task.name}</div>
            <div class="row-status" style="color:${i.status.textStrong};">${i.status.label}</div>
          </div>
          <div class="track"><div class="fill" style="width:${i.pct}%; background:${i.status.line};"></div></div>
          <div class="row-meta">${i.meta}</div>
        </div>
      `;
      row.appendChild(datePicker(i.task.key, i.today));
      const check = document.createElement('button');
      check.type = 'button';
      check.className = 'check-btn';
      check.setAttribute('aria-label', 'Mark ' + i.task.name + ' done today');
      check.innerHTML = '<svg viewBox="0 0 24 24" fill="none"><path stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M5 12.5 10 17.5 19 7"/></svg>';
      check.addEventListener('click', () => setDone(i.task.key, i.today, 'marked done today'));
      row.appendChild(check);
      listEl.appendChild(row);
    });
  }

  function render() {
    const items = computed();
    renderFocus(items[0]);
    renderPeek(items.slice(1).sort((a, b) => a.daysLeft - b.daysLeft).slice(0, 2));
    renderList(items);
    const overdue = items.filter((i) => i.status.key === 'overdue').length;
    const soon = items.filter((i) => i.status.key === 'soon').length;
    document.getElementById('count-line').textContent = overdue
      ? overdue + ' overdue' + (soon ? ' · ' + soon + ' due soon' : '')
      : soon ? soon + ' due soon' : 'All on track';
  }

  document.getElementById('date-line').textContent = new Date().toLocaleDateString('en-US', {
    weekday: 'short', month: 'short', day: 'numeric'
  });
  document.getElementById('storage-note').textContent = CAN_PERSIST
    ? 'Saved automatically in this browser.'
    : 'This browser is blocking local storage, so changes here won’t be saved.';

  render();
</script>
</body>
</html>
