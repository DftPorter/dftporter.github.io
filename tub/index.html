<title>Spa Care</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<meta name="theme-color" content="#1f9a8e">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Spa Care">
<meta name="mobile-web-app-capable" content="yes">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: oklch(97% 0.012 75);
    --surface: oklch(99% 0.006 75);
    --surface-2: oklch(94.5% 0.012 78);
    --border: oklch(91% 0.012 80);
    --text: oklch(27% 0.03 260);
    --text-muted: oklch(50% 0.02 260);
    --text-faint: oklch(63% 0.015 260);
    --accent: oklch(58% 0.1 195);
    --accent-soft: oklch(94% 0.03 195);
    --shadow-sm: 0 1px 2px oklch(0% 0 0 / 0.04);
    --shadow-md: 0 10px 24px oklch(30% 0.02 260 / 0.08);
    --shadow-card: 0 1px 2px oklch(0% 0 0 / 0.03), 0 6px 16px oklch(30% 0.02 260 / 0.06);

    --status-ok-h: 155;
    --status-soon-h: 85;
    --status-over-h: 25;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: oklch(20% 0.014 250);
      --surface: oklch(25% 0.016 250);
      --surface-2: oklch(29% 0.018 250);
      --border: oklch(33% 0.018 250);
      --text: oklch(93% 0.01 90);
      --text-muted: oklch(72% 0.015 90);
      --text-faint: oklch(56% 0.015 90);
      --accent: oklch(74% 0.1 195);
      --accent-soft: oklch(32% 0.045 195);
      --shadow-sm: 0 1px 2px oklch(0% 0 0 / 0.3);
      --shadow-md: 0 10px 24px oklch(0% 0 0 / 0.35);
      --shadow-card: 0 1px 2px oklch(0% 0 0 / 0.25), 0 6px 16px oklch(0% 0 0 / 0.3);
    }
  }

  :root[data-theme="dark"] {
    --bg: oklch(20% 0.014 250);
    --surface: oklch(25% 0.016 250);
    --surface-2: oklch(29% 0.018 250);
    --border: oklch(33% 0.018 250);
    --text: oklch(93% 0.01 90);
    --text-muted: oklch(72% 0.015 90);
    --text-faint: oklch(56% 0.015 90);
    --accent: oklch(74% 0.1 195);
    --accent-soft: oklch(32% 0.045 195);
    --shadow-sm: 0 1px 2px oklch(0% 0 0 / 0.3);
    --shadow-md: 0 10px 24px oklch(0% 0 0 / 0.35);
    --shadow-card: 0 1px 2px oklch(0% 0 0 / 0.25), 0 6px 16px oklch(0% 0 0 / 0.3);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Work Sans', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    max-width: 480px;
    margin: 0 auto;
    padding: calc(32px + env(safe-area-inset-top)) calc(20px + env(safe-area-inset-right)) calc(56px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-left));
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  header {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .eyebrow {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.09em;
    color: var(--accent);
  }

  h1 {
    margin: 0;
    font-family: 'Newsreader', serif;
    font-weight: 500;
    font-size: 32px;
    line-height: 1.1;
    text-wrap: balance;
    color: var(--text);
  }

  .date-line {
    font-size: 14px;
    color: var(--text-muted);
  }

  .summary {
    display: flex;
    background: var(--surface);
    border-radius: 20px;
    box-shadow: var(--shadow-sm), var(--shadow-md);
  }

  .stat {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding: 18px 8px;
  }

  .stat + .stat {
    border-left: 1px solid var(--border);
  }

  .stat-num {
    font-family: 'Newsreader', serif;
    font-size: 26px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  .stat-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--text-muted);
  }

  .section-label {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-muted);
  }

  .storage-note {
    text-align: center;
    font-size: 12px;
    color: var(--text-faint);
    padding-top: 4px;
  }

  .tasks {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .card {
    background: var(--surface);
    border-radius: 18px;
    padding: 16px;
    box-shadow: var(--shadow-card);
    display: flex;
    gap: 14px;
  }

  .icon {
    flex-shrink: 0;
    width: 44px;
    height: 44px;
    border-radius: 14px;
    background: var(--accent-soft);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .icon svg {
    width: 22px;
    height: 22px;
    color: var(--accent);
  }

  .card-body {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .card-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
  }

  .task-name {
    font-weight: 600;
    font-size: 15px;
  }

  .task-interval {
    font-size: 12px;
    color: var(--text-faint);
  }

  .badge {
    flex-shrink: 0;
    font-size: 11.5px;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 999px;
    white-space: nowrap;
  }

  .last-done {
    font-size: 13px;
    color: var(--text-muted);
  }

  .track {
    height: 6px;
    border-radius: 999px;
    background: var(--surface-2);
    overflow: hidden;
  }

  .fill {
    height: 100%;
    border-radius: 999px;
    transition: width 0.25s ease, background 0.25s ease;
  }

  .actions {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 2px;
  }

  .mark-btn {
    min-height: 44px;
    padding: 0 18px;
    border-radius: 999px;
    border: 1.5px solid var(--accent);
    background: transparent;
    color: var(--accent);
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease, transform 0.05s ease;
  }

  .mark-btn:hover {
    background: var(--accent-soft);
  }

  .mark-btn:active {
    transform: scale(0.97);
  }

  .date-btn {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    min-height: 44px;
    padding: 0 14px;
    border-radius: 999px;
    border: 1.5px solid var(--border);
    color: var(--text-muted);
    font-size: 13px;
    transition: background 0.15s ease, border-color 0.15s ease;
  }

  .date-btn:hover {
    background: var(--surface-2);
    border-color: var(--text-faint);
  }

  .date-btn svg {
    width: 16px;
    height: 16px;
    flex-shrink: 0;
    color: var(--text-faint);
    pointer-events: none;
  }

  .date-btn span {
    pointer-events: none;
    white-space: nowrap;
  }

  .date-btn input[type="date"] {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    /* iOS Safari treats an exactly-zero-opacity date input as non-interactive once its
       picker takes focus, and immediately dismisses it. A near-zero value keeps it
       visually invisible while avoiding that special case. */
    opacity: 0.0001;
    border: 0;
    padding: 0;
    margin: 0;
    cursor: pointer;
  }

  .mark-btn:focus-visible,
  .date-btn:focus-within,
  a:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  @media (prefers-reduced-motion: reduce) {
    .fill, .mark-btn { transition: none; }
  }
</style>

<div class="page">
  <header>
    <div class="eyebrow">SPA CARE</div>
    <h1>Your Hot Tub</h1>
    <div class="date-line" id="date-line"></div>
  </header>

  <div class="summary">
    <div class="stat">
      <div class="stat-num" id="stat-overdue" style="color: oklch(60% 0.14 25);">0</div>
      <div class="stat-label">Overdue</div>
    </div>
    <div class="stat">
      <div class="stat-num" id="stat-soon" style="color: oklch(60% 0.14 85);">0</div>
      <div class="stat-label">Due soon</div>
    </div>
    <div class="stat">
      <div class="stat-num" id="stat-ok" style="color: oklch(60% 0.14 155);">0</div>
      <div class="stat-label">On track</div>
    </div>
  </div>

  <div>
    <div class="section-label" style="padding-bottom: 10px;">Care tasks</div>
    <div class="tasks" id="task-list"></div>
  </div>

  <div class="storage-note" id="storage-note"></div>
</div>

<script>
  const ICONS = {
    filterClean: '<path stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" d="M4 4h16L14 12v7l-4-2v-5L4 4Z"/>',
    chemCheck: '<path stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" d="M9 3h6M10 3v6l-4.3 8a2 2 0 0 0 1.75 3h9.1a2 2 0 0 0 1.75-3L14 9V3M7.5 15h9"/>',
    shock: '<path stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" d="M13 3 5 14h6l-1 7 9-12h-6l1-6Z"/>',
    waterChange: '<path stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" d="M12 3C12 3 6 10.5 6 15a6 6 0 0 0 12 0C18 10.5 12 3 12 3Z"/>',
    filterReplace: '<path stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" d="M20 11A8 8 0 1 0 18.6 16M20 4v6h-6"/>',
    soakFilters: '<path stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" d="M4 9h16v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V9ZM3 9h18M8 13c.6-.6 1.4-.6 2 0s1.4.6 2 0 1.4-.6 2 0 1.4.6 2 0"/>'
  };

  const TASKS = [
    { key: 'filterClean', name: 'Clean filter', interval: 7, intervalLabel: 'every 7 days', defaultDaysAgo: 3 },
    { key: 'chemCheck', name: 'Check chemical balance', interval: 3, intervalLabel: 'every 3 days', defaultDaysAgo: 1 },
    { key: 'shock', name: 'Shock treatment', interval: 7, intervalLabel: 'every 7 days', defaultDaysAgo: 9 },
    { key: 'waterChange', name: 'Change water', interval: 120, intervalLabel: 'every ~4 months', defaultDaysAgo: 132 },
    { key: 'filterReplace', name: 'Replace filter cartridge', interval: 120, intervalLabel: 'every ~4 months', defaultDaysAgo: 96 },
    { key: 'soakFilters', name: 'Soak filters', interval: 30, intervalLabel: 'every 30 days', defaultDaysAgo: 12 }
  ];

  const STORAGE_KEY = 'spa-care:last-done:v1';

  function pad(n) { return String(n).padStart(2, '0'); }

  function todayStr() {
    const d = new Date();
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  }

  function dateMinusDays(days) {
    const d = new Date();
    d.setDate(d.getDate() - days);
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  }

  function daysSince(dateStr) {
    const [y, m, d] = dateStr.split('-').map(Number);
    const then = new Date(y, m - 1, d);
    const now = new Date();
    now.setHours(0, 0, 0, 0);
    then.setHours(0, 0, 0, 0);
    return Math.round((now - then) / 86400000);
  }

  function storageAvailable() {
    try {
      const testKey = '__spa_care_test__';
      localStorage.setItem(testKey, '1');
      localStorage.removeItem(testKey);
      return true;
    } catch (e) {
      return false;
    }
  }

  function loadSaved() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : {};
    } catch (e) {
      return {};
    }
  }

  function saveAll() {
    try {
      const data = {};
      TASKS.forEach((t) => { data[t.key] = t.lastDone; });
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    } catch (e) {
      // storage unavailable — state simply won't persist
    }
  }

  const CAN_PERSIST = storageAvailable();
  const saved = CAN_PERSIST ? loadSaved() : {};
  TASKS.forEach((t) => {
    t.lastDone = saved[t.key] || dateMinusDays(t.defaultDaysAgo);
  });

  function statusFor(daysAgo, interval) {
    const ratio = daysAgo / interval;
    if (ratio > 1) {
      const over = Math.round(daysAgo - interval);
      return { hue: 25, label: over <= 1 ? 'Overdue' : `Overdue ${over}d`, key: 'overdue' };
    }
    if (ratio >= 0.7) {
      const left = Math.max(1, Math.round(interval - daysAgo));
      return { hue: 85, label: `Due in ${left}d`, key: 'soon' };
    }
    return { hue: 155, label: 'On track', key: 'ok' };
  }

  function fmtLastDone(dateStr, daysAgo) {
    if (daysAgo === 0) return 'today';
    const [y, m, d] = dateStr.split('-').map(Number);
    const display = new Date(y, m - 1, d).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    const rel = daysAgo === 1 ? '1 day ago' : `${daysAgo} days ago`;
    return `${display} · ${rel}`;
  }

  const listEl = document.getElementById('task-list');
  const cardByKey = {};

  function urgencyRatio(task) {
    return daysSince(task.lastDone) / task.interval;
  }

  function resortList() {
    TASKS
      .slice()
      .sort((a, b) => urgencyRatio(b) - urgencyRatio(a))
      .forEach((task) => listEl.appendChild(cardByKey[task.key]));
  }

  function buildCard(task) {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="icon"><svg viewBox="0 0 24 24" fill="none">${ICONS[task.key]}</svg></div>
      <div class="card-body">
        <div class="card-top">
          <div>
            <div class="task-name">${task.name}</div>
            <div class="task-interval">${task.intervalLabel}</div>
          </div>
          <div class="badge" data-role="badge"></div>
        </div>
        <div class="last-done" data-role="last-done"></div>
        <div class="track"><div class="fill" data-role="fill"></div></div>
        <div class="actions">
          <button class="mark-btn" type="button">Mark done today</button>
          <div class="date-btn">
            <svg viewBox="0 0 24 24" fill="none"><path stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" d="M8 3v3M16 3v3M4.5 9.5h15M5.5 6h13A1.5 1.5 0 0 1 20 7.5V19a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 19V7.5A1.5 1.5 0 0 1 5.5 6Z"/></svg>
            <span>Other date</span>
            <input type="date" data-role="date-input" aria-label="Set a different last-done date">
          </div>
        </div>
      </div>
    `;

    function applyDate(dateStr) {
      if (!dateStr) return;
      task.lastDone = dateStr;
      renderCard(card, task);
      renderSummary();
      resortList();
      saveAll();
    }

    card.querySelector('.mark-btn').addEventListener('click', () => applyDate(todayStr()));

    const dateInput = card.querySelector('[data-role="date-input"]');
    dateInput.max = todayStr();
    dateInput.addEventListener('change', () => {
      const val = dateInput.value;
      dateInput.value = '';
      applyDate(val);
    });

    cardByKey[task.key] = card;
    listEl.appendChild(card);
    return card;
  }

  function renderCard(card, task) {
    const daysAgo = daysSince(task.lastDone);
    const status = statusFor(daysAgo, task.interval);
    const pct = Math.max(6, Math.min(100, Math.round((daysAgo / task.interval) * 100)));
    const badge = card.querySelector('[data-role="badge"]');
    badge.textContent = status.label;
    badge.style.background = `oklch(93% 0.045 ${status.hue})`;
    badge.style.color = `oklch(34% 0.11 ${status.hue})`;
    card.querySelector('[data-role="last-done"]').textContent = `Last done ${fmtLastDone(task.lastDone, daysAgo)}`;
    const fill = card.querySelector('[data-role="fill"]');
    fill.style.width = pct + '%';
    fill.style.background = `oklch(64% 0.14 ${status.hue})`;
  }

  function renderSummary() {
    let overdue = 0, soon = 0, ok = 0;
    TASKS.forEach((task) => {
      const s = statusFor(daysSince(task.lastDone), task.interval).key;
      if (s === 'overdue') overdue++;
      else if (s === 'soon') soon++;
      else ok++;
    });
    document.getElementById('stat-overdue').textContent = overdue;
    document.getElementById('stat-soon').textContent = soon;
    document.getElementById('stat-ok').textContent = ok;
  }

  document.getElementById('date-line').textContent = new Date().toLocaleDateString('en-US', {
    weekday: 'long', month: 'long', day: 'numeric'
  });

  const storageNote = document.getElementById('storage-note');
  storageNote.textContent = CAN_PERSIST
    ? 'Saved automatically in this browser.'
    : 'This browser is blocking local storage, so changes here won’t be saved.';

  const cards = TASKS.map((task) => {
    const card = buildCard(task);
    renderCard(card, task);
    return card;
  });

  resortList();
  renderSummary();
</script>
