<!DOCTYPE html>
<html lang="en">
<title>Spa Care</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<meta name="theme-color" content="#dceef1">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Spa Care">
<meta name="mobile-web-app-capable" content="yes">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;800&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: oklch(95% 0.022 195);
    --surface: oklch(100% 0 0);
    --text: oklch(26% 0.045 220);
    --text-muted: oklch(48% 0.03 220);
    --text-faint: oklch(52% 0.03 220);
    --accent-deep: oklch(38% 0.11 228);
    --tile-btn: oklch(96% 0.018 210);
    --tile-btn-hover: oklch(91% 0.03 210);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }

  body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    justify-content: center;
  }

  .page {
    width: 100%;
    max-width: 430px;
    padding: calc(24px + env(safe-area-inset-top)) 16px calc(100px + env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 0 4px;
  }

  .wordmark { font-size: 21px; font-weight: 800; letter-spacing: -0.02em; }
  .date-line { font-size: 13px; font-weight: 600; color: var(--text-muted); }

  .hero {
    border-radius: 30px;
    padding: 26px 24px 24px;
    background: linear-gradient(150deg, oklch(58% 0.1 205) 0%, oklch(44% 0.11 235) 100%);
    color: oklch(99% 0.008 210);
    box-shadow: 0 16px 36px oklch(45% 0.08 225 / 0.32);
    display: flex;
    flex-direction: column;
    gap: 22px;
  }

  .hero-top { display: flex; align-items: center; }

  .eyebrow {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    opacity: 0.82;
  }

  .hero-main { display: flex; align-items: flex-end; gap: 16px; }
  .hero-titles { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }

  h1 {
    margin: 0;
    font-size: 33px;
    font-weight: 800;
    line-height: 1.08;
    letter-spacing: -0.03em;
    text-wrap: balance;
  }

  .hero-meta { font-size: 13.5px; opacity: 0.82; }

  .counter { flex-shrink: 0; text-align: center; padding-bottom: 2px; }
  .counter-num { font-size: 52px; font-weight: 800; line-height: 0.86; letter-spacing: -0.045em; }
  .counter-unit {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    opacity: 0.78;
    padding-top: 6px;
  }

  .hero-actions { display: flex; gap: 10px; }

  .primary-btn {
    flex: 1;
    min-height: 56px;
    border: 0;
    border-radius: 18px;
    background: oklch(100% 0 0);
    color: var(--accent-deep);
    font-family: inherit;
    font-size: 15.5px;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.06s ease, background 0.15s ease;
  }

  .primary-btn:hover { background: oklch(96% 0.02 210); }
  .primary-btn:active { transform: scale(0.98); }

  .hero .date-picker {
    width: 56px;
    min-height: 56px;
    border-radius: 18px;
    background: oklch(100% 0 0 / 0.18);
    color: oklch(99% 0.008 210);
  }

  .hero .date-picker:hover { background: oklch(100% 0 0 / 0.28); }
  .hero .date-picker svg { width: 21px; height: 21px; }

  .date-picker {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    cursor: pointer;
    border: 0;
  }

  .date-picker svg { pointer-events: none; }

  .date-picker input[type="date"] {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    opacity: 0;
    border: 0;
    padding: 0;
    margin: 0;
    cursor: pointer;
    color-scheme: light;
  }

  .block { display: flex; flex-direction: column; gap: 12px; }

  .block-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding: 0 4px;
  }

  .block-label {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: oklch(46% 0.035 220);
  }

  .count-line { font-size: 12.5px; font-weight: 600; color: var(--text-muted); }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  .tile {
    border-radius: 24px;
    padding: 16px 16px 12px;
    background: var(--surface);
    box-shadow: 0 2px 10px oklch(45% 0.05 225 / 0.09);
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .tile-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 8px;
  }

  .tile-icon {
    width: 42px;
    height: 42px;
    flex-shrink: 0;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .tile-icon svg { width: 22px; height: 22px; }

  .tile .date-picker {
    width: 34px;
    height: 34px;
    border-radius: 11px;
    color: oklch(56% 0.03 220);
  }

  .tile .date-picker:hover { background: oklch(96% 0.015 210); }
  .tile .date-picker svg { width: 16px; height: 16px; }

  .tile-titles { display: flex; flex-direction: column; gap: 4px; }

  .tile-name {
    font-size: 15px;
    font-weight: 700;
    line-height: 1.18;
    letter-spacing: -0.015em;
  }

  .tile-status { font-size: 12.5px; font-weight: 600; }

  .done-btn {
    min-height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    border: 0;
    border-radius: 14px;
    background: var(--tile-btn);
    color: var(--accent-deep);
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s ease;
  }

  .done-btn:hover { background: var(--tile-btn-hover); }
  .done-btn svg { width: 16px; height: 16px; }

  .storage-note {
    text-align: center;
    font-size: 12px;
    color: var(--text-faint);
    padding-top: 6px;
  }

  .toast-wrap {
    position: fixed;
    left: 0;
    right: 0;
    bottom: calc(20px + env(safe-area-inset-bottom));
    display: flex;
    justify-content: center;
    padding: 0 16px;
    pointer-events: none;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 0.18s ease, transform 0.18s ease;
  }

  .toast-wrap[data-show="1"] { opacity: 1; transform: translateY(0); }

  .toast {
    display: flex;
    align-items: center;
    gap: 14px;
    max-width: 398px;
    width: 100%;
    padding: 10px 10px 10px 18px;
    border-radius: 20px;
    background: oklch(32% 0.06 228);
    color: oklch(98% 0.008 210);
    box-shadow: 0 12px 30px oklch(35% 0.06 228 / 0.35);
    pointer-events: auto;
  }

  .toast-label {
    flex: 1;
    min-width: 0;
    font-size: 13.5px;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .undo-btn {
    flex-shrink: 0;
    min-height: 40px;
    padding: 0 18px;
    border: 0;
    border-radius: 14px;
    background: oklch(100% 0 0 / 0.18);
    color: oklch(99% 0.008 210);
    font-family: inherit;
    font-size: 13.5px;
    font-weight: 700;
    cursor: pointer;
  }

  .undo-btn:hover { background: oklch(100% 0 0 / 0.28); }

  .primary-btn:focus-visible,
  .done-btn:focus-visible,
  .undo-btn:focus-visible,
  .date-picker:focus-within {
    outline: 2px solid var(--accent-deep);
    outline-offset: 2px;
  }

  @media (prefers-reduced-motion: reduce) {
    .primary-btn, .done-btn, .toast-wrap { transition: none; }
  }
</style>

<body>
<div class="page">
  <header>
    <div class="wordmark">Spa Care</div>
    <div class="date-line" id="date-line"></div>
  </header>

  <section class="hero" id="hero"></section>

  <section class="block">
    <div class="block-head">
      <div class="block-label">Everything else</div>
      <div class="count-line" id="count-line"></div>
    </div>
    <div class="grid" id="grid"></div>
    <div class="storage-note" id="storage-note"></div>
  </section>
</div>

<div class="toast-wrap" id="toast-wrap">
  <div class="toast">
    <div class="toast-label" id="toast-label"></div>
    <button class="undo-btn" type="button" id="undo-btn">Undo</button>
  </div>
</div>

<script>
  const ICONS = {
    filterClean: '<path stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" d="M4 4h16L14 12v7l-4-2v-5L4 4Z"/>',
    chemCheck: '<path stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" d="M9 3h6M10 3v6l-4.3 8a2 2 0 0 0 1.75 3h9.1a2 2 0 0 0 1.75-3L14 9V3M7.5 15h9"/>',
    shock: '<path stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" d="M13 3 5 14h6l-1 7 9-12h-6l1-6Z"/>',
    waterChange: '<path stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" d="M12 3C12 3 6 10.5 6 15a6 6 0 0 0 12 0C18 10.5 12 3 12 3Z"/>',
    filterReplace: '<path stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" d="M20 11A8 8 0 1 0 18.6 16M20 4v6h-6"/>',
    soakFilters: '<path stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" d="M4 9h16v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V9ZM3 9h18M8 13c.6-.6 1.4-.6 2 0s1.4.6 2 0 1.4-.6 2 0 1.4.6 2 0"/>',
    testKit: '<path stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" d="M7 3h4v11a2 2 0 0 1-4 0V3ZM6 3h6M7 9h4M15.5 4.5h4M15.5 9h4M15.5 13.5h4M15.5 18h4"/>'
  };

  const CAL_PATH = '<path stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M8 3v3M16 3v3M4.5 9.5h15M5.5 6h13A1.5 1.5 0 0 1 20 7.5V19a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 19V7.5A1.5 1.5 0 0 1 5.5 6Z"/>';

  const TASKS = [
    { key: 'filterClean', name: 'Clean filter', interval: 7, intervalLabel: 'Every 7 days', defaultDaysAgo: 3 },
    { key: 'chemCheck', name: 'Check chemical balance', interval: 3, intervalLabel: 'Every 3 days', defaultDaysAgo: 1 },
    { key: 'shock', name: 'Shock treatment', interval: 7, intervalLabel: 'Every 7 days', defaultDaysAgo: 9 },
    { key: 'waterChange', name: 'Change water', interval: 120, intervalLabel: 'Every ~4 months', defaultDaysAgo: 132 },
    { key: 'filterReplace', name: 'Replace filter cartridge', interval: 120, intervalLabel: 'Every ~4 months', defaultDaysAgo: 96 },
    { key: 'soakFilters', name: 'Soak filters', interval: 30, intervalLabel: 'Every 30 days', defaultDaysAgo: 12 },
    { key: 'testKit', name: 'Test Kit Analysis', interval: 14, intervalLabel: 'Every 2 weeks', defaultDaysAgo: 6 }
  ];

  const STORAGE_KEY = 'spa-care:last-done:v1';
  const pad = (n) => String(n).padStart(2, '0');
  const fmt = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;

  function minusDays(days) {
    const d = new Date();
    d.setDate(d.getDate() - days);
    return fmt(d);
  }

  function daysSince(dateStr) {
    const [y, m, d] = dateStr.split('-').map(Number);
    const then = new Date(y, m - 1, d);
    then.setHours(0, 0, 0, 0);
    const now = new Date();
    now.setHours(0, 0, 0, 0);
    return Math.round((now - then) / 86400000);
  }

  function storageAvailable() {
    try {
      localStorage.setItem('__spa_care_test__', '1');
      localStorage.removeItem('__spa_care_test__');
      return true;
    } catch (e) { return false; }
  }

  const CAN_PERSIST = storageAvailable();
  let done = {};
  try {
    const raw = CAN_PERSIST ? localStorage.getItem(STORAGE_KEY) : null;
    done = raw ? JSON.parse(raw) : {};
  } catch (e) { done = {}; }
  TASKS.forEach((t) => { if (!done[t.key]) done[t.key] = minusDays(t.defaultDaysAgo); });

  function persist() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(done)); } catch (e) {}
  }

  function statusFor(daysAgo, interval) {
    const left = Math.round(interval - daysAgo);
    if (left < 0) {
      return { label: 'Overdue ' + (-left) + 'd', bigNum: String(-left), bigUnit: 'days over', tintBg: 'oklch(94% 0.045 30)', tintFg: 'oklch(45% 0.15 30)', key: 'overdue' };
    }
    if (left === 0) {
      return { label: 'Due today', bigNum: '0', bigUnit: 'days left', tintBg: 'oklch(95% 0.05 85)', tintFg: 'oklch(46% 0.12 70)', key: 'today' };
    }
    if (daysAgo / interval >= 0.7) {
      return { label: 'Due in ' + left + 'd', bigNum: String(left), bigUnit: 'days left', tintBg: 'oklch(95% 0.05 85)', tintFg: 'oklch(46% 0.12 70)', key: 'soon' };
    }
    return { label: 'Due in ' + left + 'd', bigNum: String(left), bigUnit: 'days left', tintBg: 'oklch(94% 0.04 180)', tintFg: 'oklch(43% 0.1 195)', key: 'ok' };
  }

  function lastDoneText(dateStr, daysAgo) {
    if (daysAgo === 0) return 'Done today';
    const [y, m, d] = dateStr.split('-').map(Number);
    const disp = new Date(y, m - 1, d).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    return 'Last done ' + disp + ' · ' + (daysAgo === 1 ? '1 day ago' : daysAgo + ' days ago');
  }

  function computed() {
    const today = fmt(new Date());
    return TASKS.map((t) => {
      const dateStr = done[t.key];
      const daysAgo = daysSince(dateStr);
      const st = statusFor(daysAgo, t.interval);
      return {
        task: t,
        status: st,
        daysLeft: t.interval - daysAgo,
        ratio: daysAgo / t.interval,
        meta: lastDoneText(dateStr, daysAgo),
        today
      };
    }).sort((a, b) => b.ratio - a.ratio);
  }

  let undoState = null;
  let undoTimer = null;
  const toastWrap = document.getElementById('toast-wrap');
  const toastLabel = document.getElementById('toast-label');

  function showToast(label) {
    toastLabel.textContent = label;
    toastWrap.setAttribute('data-show', '1');
    clearTimeout(undoTimer);
    undoTimer = setTimeout(hideToast, 6000);
  }

  function hideToast() {
    toastWrap.removeAttribute('data-show');
    undoState = null;
  }

  function setDone(key, dateStr, what) {
    if (!dateStr) return;
    const task = TASKS.find((t) => t.key === key);
    undoState = { key, prev: done[key] };
    done[key] = dateStr;
    persist();
    render();
    showToast(task.name + ' · ' + what);
  }

  document.getElementById('undo-btn').addEventListener('click', () => {
    if (!undoState) return;
    done[undoState.key] = undoState.prev;
    persist();
    hideToast();
    clearTimeout(undoTimer);
    render();
  });

  function datePicker(key, today, size) {
    const wrap = document.createElement('label');
    wrap.className = 'date-picker';
    wrap.setAttribute('aria-label', 'Set a different last-done date');
    wrap.innerHTML = '<svg viewBox="0 0 24 24" fill="none">' + CAL_PATH + '</svg>';
    const input = document.createElement('input');
    input.type = 'date';
    input.max = today;
    input.addEventListener('change', () => {
      const v = input.value;
      // Defer so iOS Safari's native picker isn't detached mid-interaction.
      setTimeout(() => setDone(key, v, 'date updated'), 0);
    });
    wrap.appendChild(input);
    return wrap;
  }

  const heroEl = document.getElementById('hero');
  const gridEl = document.getElementById('grid');

  function renderHero(item) {
    const t = item.task, st = item.status;
    heroEl.innerHTML = `
      <div class="hero-top">
        <div class="eyebrow">Up next</div>
      </div>
      <div class="hero-main">
        <div class="hero-titles">
          <h1>${t.name}</h1>
          <div class="hero-meta">${item.meta}</div>
        </div>
        <div class="counter">
          <div class="counter-num">${st.bigNum}</div>
          <div class="counter-unit">${st.bigUnit}</div>
        </div>
      </div>
    `;
    const actions = document.createElement('div');
    actions.className = 'hero-actions';
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'primary-btn';
    btn.textContent = 'Mark done today';
    btn.addEventListener('click', () => setDone(t.key, item.today, 'marked done today'));
    actions.appendChild(btn);
    actions.appendChild(datePicker(t.key, item.today));
    heroEl.appendChild(actions);
  }

  function renderGrid(items) {
    gridEl.innerHTML = '';
    items.forEach((i) => {
      const t = i.task, st = i.status;
      const tile = document.createElement('div');
      tile.className = 'tile';

      const top = document.createElement('div');
      top.className = 'tile-top';
      top.innerHTML = `
        <div class="tile-icon" style="background:${st.tintBg}; color:${st.tintFg};">
          <svg viewBox="0 0 24 24" fill="none">${ICONS[t.key]}</svg>
        </div>
      `;
      top.appendChild(datePicker(t.key, i.today));
      tile.appendChild(top);

      const titles = document.createElement('div');
      titles.className = 'tile-titles';
      titles.innerHTML = `
        <div class="tile-name">${t.name}</div>
        <div class="tile-status" style="color:${st.tintFg};">${st.label}</div>
      `;
      tile.appendChild(titles);

      const doneBtn = document.createElement('button');
      doneBtn.type = 'button';
      doneBtn.className = 'done-btn';
      doneBtn.setAttribute('aria-label', 'Mark ' + t.name + ' done today');
      doneBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none"><path stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M5 12.5 10 17.5 19 7"/></svg> Done';
      doneBtn.addEventListener('click', () => setDone(t.key, i.today, 'marked done today'));
      tile.appendChild(doneBtn);

      gridEl.appendChild(tile);
    });
  }

  function render() {
    const items = computed();
    renderHero(items[0]);
    renderGrid(items.slice(1).sort((a, b) => a.daysLeft - b.daysLeft));
    const overdue = items.filter((i) => i.status.key === 'overdue').length;
    const dueToday = items.filter((i) => i.status.key === 'today').length;
    const soon = items.filter((i) => i.status.key === 'soon').length;
    const parts = [];
    if (overdue) parts.push(overdue + ' overdue');
    if (dueToday) parts.push(dueToday + ' due today');
    if (soon) parts.push(soon + ' due soon');
    document.getElementById('count-line').textContent = parts.length ? parts.join(' · ') : 'All on track';
  }

  document.getElementById('date-line').textContent = new Date().toLocaleDateString('en-US', {
    weekday: 'short', month: 'short', day: 'numeric'
  });
  document.getElementById('storage-note').textContent = CAN_PERSIST
    ? 'Saved automatically in this browser.'
    : 'This browser is blocking local storage, so changes here won’t be saved.';

  render();
</script>
</body>
</html>
