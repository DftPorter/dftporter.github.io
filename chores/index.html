<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Chore Quest">
<meta name="theme-color" content="#0a0a1a">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon-180.png">
<title>CHORE QUEST</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}

:root{
  --bg:#0a0a1a;
  --surface:#0d0d2a;
  --p1:#00c8ff;
  --p1-glow:rgba(0,200,255,.12);
  --p1-dim:#003a55;
  --p2:#00ff88;
  --p2-glow:rgba(0,255,136,.12);
  --p2-dim:#003a25;
  --gold:#ffd700;
  --gold-dk:#7a4200;
  --done-bg:#002800;
  --done-bd:#00aa00;
  --done-txt:#00ee00;
  --miss-bg:#2a0000;
  --miss-bd:#880000;
  --miss-txt:#ff3333;
  --pend-bg:#10102e;
  --pend-bd:#4040a0;
  --pend-txt:#8888cc;
  --excused-bg:#0e0e20;
  --excused-bd:#383870;
  --excused-txt:#505090;
  --dim:#8888b8;
  --font:'Press Start 2P',monospace;
}

body{
  font-family:var(--font);
  background:var(--bg);
  background-image:repeating-linear-gradient(
    0deg,transparent,transparent 3px,
    rgba(0,0,0,.18) 3px,rgba(0,0,0,.18) 4px
  );
  color:#c8c8e8;
  min-height:100vh;
  padding:12px 10px 32px;
  font-size:10px;
  line-height:1.6;
}

/* ── Title ── */
header{text-align:center;padding:18px 0 22px;}
.title{
  font-size:clamp(12px,5.5vw,18px);
  color:var(--gold);
  text-shadow:4px 4px 0 var(--gold-dk);
  letter-spacing:4px;
  margin-bottom:8px;
}
.subtitle{font-size:8px;color:var(--dim);letter-spacing:4px;}

/* ── Season bar ── */
.season-bar{
  text-align:center;
  font-size:9px;
  color:#9090c8;
  background:#0c0c26;
  border:2px solid #181858;
  padding:7px 12px;
  margin-bottom:22px;
  letter-spacing:1px;
}

/* ── Layout ── */
.players{
  display:grid;
  grid-template-columns:1fr;
  gap:22px;
  max-width:460px;
  margin:0 auto;
}
@media(min-width:820px){
  .players{grid-template-columns:1fr 1fr;max-width:900px;}
}

/* ── Card ── */
.card{
  background:var(--surface);
  padding:16px 14px;
  position:relative;
}
.card-p1{
  border:3px solid var(--p1);
  box-shadow:0 0 0 2px #0a0a1a,0 0 0 5px var(--p1-dim),
             inset 0 0 30px var(--p1-glow);
}
.card-p2{
  border:3px solid var(--p2);
  box-shadow:0 0 0 2px #0a0a1a,0 0 0 5px var(--p2-dim),
             inset 0 0 30px var(--p2-glow);
}
.card::before,.card::after{content:'';position:absolute;width:7px;height:7px;}
.card-p1::before{top:-3px;right:-3px;background:var(--p1);}
.card-p1::after {bottom:-3px;left:-3px;background:var(--p1);}
.card-p2::before{top:-3px;right:-3px;background:var(--p2);}
.card-p2::after {bottom:-3px;left:-3px;background:var(--p2);}

/* ── Card header ── */
.card-head{
  display:flex;align-items:center;gap:10px;
  margin-bottom:14px;padding-bottom:10px;
  border-bottom:2px solid #181848;
}
.card-icon{font-size:20px;line-height:1;}
.card-name{font-size:clamp(12px,4vw,15px);line-height:1;}
.card-p1 .card-name{color:var(--p1);}
.card-p2 .card-name{color:var(--p2);}
.summary-btn{
  margin-left:auto;background:none;border:1px solid #303060;
  color:#505088;font-family:var(--font);font-size:7px;
  letter-spacing:1px;padding:5px 7px;cursor:pointer;line-height:1;
  flex-shrink:0;
}
.summary-btn:active{background:#0d0d2a;color:#8080c0;border-color:#5050a0;}

/* ── Section label ── */
.slbl{font-size:8px;color:var(--dim);letter-spacing:2px;margin-bottom:6px;}

/* ── Pips ── */
.pips{display:flex;gap:3px;margin-bottom:16px;flex-wrap:wrap;}
.pip{width:13px;height:13px;background:#101030;border:1px solid #202060;flex-shrink:0;}
.card-p1 .pip.on{background:var(--p1);border-color:#008aaa;}
.card-p2 .pip.on{background:var(--p2);border-color:#00aa55;}

/* ── Week grid ── */
.week-lbl{font-size:9px;margin-bottom:8px;}
.week-lbl.cur{color:var(--gold);}
.week-lbl.past{color:#6060a0;}

.chore-grid{
  display:grid;
  grid-template-columns:repeat(8,1fr);
  gap:3px;
  margin-bottom:8px;
}
.day-cell{display:flex;flex-direction:column;align-items:center;gap:2px;}
.day-lbl{font-size:7px;color:var(--dim);}
.day-box{
  width:100%;aspect-ratio:1;
  display:flex;align-items:center;justify-content:center;
  font-size:clamp(10px,3.5vw,13px);
  border:1px solid;
}
.day-box.done   {background:var(--done-bg);border-color:var(--done-bd);color:var(--done-txt);}
.day-box.missed {background:var(--miss-bg);border-color:var(--miss-bd);color:var(--miss-txt);}
.day-box.pend   {background:var(--pend-bg);border-color:var(--pend-bd);color:var(--pend-txt);}
.day-box.excused{background:var(--excused-bg);border-color:var(--excused-bd);color:var(--excused-txt);border-style:dashed;}

.week-pay{font-size:9px;color:var(--gold);margin-bottom:14px;}

/* ── Money box ── */
.money-box{
  background:#110e00;
  border:2px solid #4a3200;
  padding:10px 14px;
  margin-bottom:14px;
}
.money-lbl{font-size:8px;color:#b09000;letter-spacing:2px;margin-bottom:7px;}
.money-val{
  font-size:clamp(16px,5.5vw,22px);
  color:var(--gold);
  text-shadow:3px 3px 0 var(--gold-dk);
  display:flex;align-items:center;gap:10px;
}
.coin{
  display:inline-block;
  font-size:clamp(18px,6vw,24px);
  animation:cspin 1.4s linear infinite;
}
@keyframes cspin{
  0%  {transform:scaleX(1);}
  18% {transform:scaleX(.08);}
  36% {transform:scaleX(1);}
  54% {transform:scaleX(.08);}
  72% {transform:scaleX(1);}
}

/* ── Month earnings ── */
.month-earn{
  display:flex;justify-content:space-between;align-items:center;
  padding:8px 12px;margin-bottom:12px;
  background:#0f0a00;border:2px solid #3a2800;
}
.month-earn-lbl{font-size:8px;color:#b09000;letter-spacing:2px;}
.month-earn-val{font-size:13px;color:var(--gold);}

/* ── History ── */
.hist-section{border-top:2px solid #181848;padding-top:10px;}
.hist-row{display:flex;align-items:center;gap:5px;margin-bottom:6px;}
.hist-date{font-size:8px;color:#8080b8;min-width:50px;flex-shrink:0;}
.hist-dots{display:flex;gap:2px;flex:1;}
.hdot{width:11px;height:11px;flex-shrink:0;}
.hdot.done   {background:#006600;}
.hdot.missed {background:#2a0000;border:1px solid #660000;}
.hdot.pend   {background:#101030;border:1px solid #3030a0;}
.hdot.excused{background:#0e0e20;border:1px dashed #383870;}
.hdot.tr.done   {background:#556600;}
.hdot.tr.missed {background:#2a1800;border:1px solid #5a3000;}
.hdot.tr.excused{background:#0e0e20;border:1px dashed #383870;}
.hdot.tr       {margin-right:6px;}

/* TR cell — dashed border + gap to separate from weekdays */
.tr-cell{margin-right:6px;}
.tr-cell .day-box{border-style:dashed;}
.hist-pay{font-size:8px;color:#aa8800;min-width:36px;text-align:right;flex-shrink:0;}

/* ── Streak ── */
.streak{
  margin-bottom:14px;padding:8px 10px;
  background:#120800;border:2px solid #3a1800;
  display:flex;align-items:center;gap:10px;
}
.streak-fire{font-size:16px;line-height:1;}
.streak-num{font-size:14px;color:#ff6600;text-shadow:2px 2px 0 #7a3000;}
.streak-lbl{font-size:8px;color:#994400;line-height:1.4;}
.streak-go{margin-bottom:14px;padding:8px 10px;font-size:8px;color:#505088;background:#0e0e20;border:2px solid #252550;}

/* ── Streak tiers ── */
/* Tier 1 (5–9): warm glow */
.streak-t1{border-color:#7a2800;background:#1a0a00;}
.streak-t1 .streak-num{color:#ff8800;text-shadow:2px 2px 0 #7a3000,0 0 10px rgba(255,136,0,.5);}
.streak-t1 .streak-lbl{color:#cc5500;}
.streak-t1 .streak-fire{animation:sfPulse 1.2s ease-in-out infinite;}

/* Tier 2 (10–14): hot orange pulse */
.streak-t2{border-color:#c04000;background:#1f0800;box-shadow:inset 0 0 20px rgba(255,100,0,.1);}
.streak-t2 .streak-num{font-size:18px;color:#ff6600;text-shadow:2px 2px 0 #7a2000,0 0 14px rgba(255,80,0,.7);}
.streak-t2 .streak-lbl{color:#dd6600;}
.streak-t2 .streak-fire{font-size:20px;animation:sfPulse .9s ease-in-out infinite;}
.streak-t2 .streak-num{animation:sfOrangePulse 1.4s ease-in-out infinite;}

/* Tier 3 (15–24): high — larger text, intense glow, border flicker */
.streak-t3{border-color:#ff5500;background:#240800;box-shadow:inset 0 0 30px rgba(255,80,0,.15),0 0 8px rgba(255,80,0,.2);}
.streak-t3 .streak-num{font-size:24px;color:#ff4400;text-shadow:2px 2px 0 #aa2000,0 0 20px #ff4400,0 0 40px rgba(255,68,0,.4);animation:sfIntensePulse 1s ease-in-out infinite;}
.streak-t3 .streak-lbl{font-size:9px;color:#ff6600;}
.streak-t3 .streak-fire{font-size:24px;animation:sfPulse .7s ease-in-out infinite;}

/* Tier 4 (25+): legendary — rainbow fire, intense box glow */
.streak-t4{background:#200400;animation:sfBorderCycle 2s linear infinite;}
.streak-t4 .streak-num{font-size:28px;animation:sfRainbowFire .8s linear infinite;}
.streak-t4 .streak-lbl{color:#ffaa00;font-size:9px;}
.streak-t4 .streak-fire{font-size:28px;animation:sfFireSpin .6s ease-in-out infinite;}

@keyframes sfPulse{
  0%,100%{transform:scale(1);}
  50%{transform:scale(1.2);}
}
@keyframes sfFireSpin{
  0%,100%{transform:scale(1) rotate(-8deg);}
  50%{transform:scale(1.3) rotate(8deg);}
}
@keyframes sfOrangePulse{
  0%,100%{text-shadow:2px 2px 0 #7a2000,0 0 14px rgba(255,80,0,.7);}
  50%{text-shadow:2px 2px 0 #7a2000,0 0 24px #ff6600,0 0 40px rgba(255,100,0,.4);}
}
@keyframes sfIntensePulse{
  0%,100%{text-shadow:2px 2px 0 #aa2000,0 0 20px #ff4400,0 0 40px rgba(255,68,0,.4);}
  50%{text-shadow:2px 2px 0 #aa2000,0 0 30px #ff2200,0 0 60px rgba(255,34,0,.6),0 0 80px rgba(255,0,0,.2);}
}
@keyframes sfRainbowFire{
  0%  {color:#ff2200;text-shadow:2px 2px 0 #800000,0 0 20px #ff0000,0 0 40px rgba(255,0,0,.5);}
  25% {color:#ff8800;text-shadow:2px 2px 0 #804000,0 0 20px #ff6600,0 0 40px rgba(255,100,0,.5);}
  50% {color:#ffff00;text-shadow:2px 2px 0 #808000,0 0 20px #ffcc00,0 0 40px rgba(255,200,0,.5);}
  75% {color:#ff8800;text-shadow:2px 2px 0 #804000,0 0 20px #ff6600,0 0 40px rgba(255,100,0,.5);}
  100%{color:#ff2200;text-shadow:2px 2px 0 #800000,0 0 20px #ff0000,0 0 40px rgba(255,0,0,.5);}
}
@keyframes sfBorderCycle{
  0%  {border-color:#ff2200;box-shadow:inset 0 0 30px rgba(255,34,0,.2),0 0 12px rgba(255,34,0,.3);}
  33% {border-color:#ff8800;box-shadow:inset 0 0 30px rgba(255,136,0,.2),0 0 12px rgba(255,136,0,.3);}
  66% {border-color:#ffff00;box-shadow:inset 0 0 30px rgba(255,255,0,.15),0 0 12px rgba(255,255,0,.25);}
  100%{border-color:#ff2200;box-shadow:inset 0 0 30px rgba(255,34,0,.2),0 0 12px rgba(255,34,0,.3);}
}

/* ── Celebration ── */
.cel-box{
  text-align:center;padding:18px 10px 16px;
  margin-bottom:14px;
  animation:celPulse .8s steps(1) infinite;
}
.card-p1 .cel-box{background:#001a00;border:3px solid var(--p1);}
.card-p2 .cel-box{background:#001a00;border:3px solid var(--p2);}
@keyframes celPulse{0%{filter:brightness(1);}50%{filter:brightness(1.35);}}
.cel-stars{font-size:20px;color:var(--gold);letter-spacing:10px;margin-bottom:12px;}
.cel-msg{
  font-size:clamp(15px,5vw,20px);color:var(--gold);
  text-shadow:3px 3px 0 var(--gold-dk);
  line-height:1.9;margin-bottom:12px;letter-spacing:2px;
}
.cel-earn{font-size:9px;color:var(--done-txt);letter-spacing:1px;}

/* ── Loading / Error ── */
#app{min-height:200px;}
.loading{
  text-align:center;padding:50px 20px;
  color:var(--dim);font-size:9px;
  animation:blink .9s step-start infinite;
}
@keyframes blink{50%{opacity:0;}}
.err-box{
  border:2px solid #660000;background:#110000;
  padding:18px;color:#ff5555;font-size:8px;
  text-align:center;max-width:380px;
  margin:40px auto;line-height:2.2;
}

/* ── Extras (one-off credits/debits) ── */
.extras-section{border-top:2px solid #181848;padding-top:10px;margin-top:10px;}
.extra-row{display:flex;align-items:center;gap:6px;margin-bottom:6px;}
.extra-date{font-size:8px;color:#8080b8;min-width:50px;flex-shrink:0;}
.extra-note{font-size:8px;color:#c8c8e8;flex:1;letter-spacing:1px;text-transform: uppercase;}
.extra-amt{font-size:9px;min-width:48px;text-align:right;flex-shrink:0;}
.extra-amt.pos{color:var(--done-txt);}
.extra-amt.neg{color:var(--miss-txt);}

/* ── Refresh button ── */
.refresh-btn{
  display:block;margin:24px auto 0;
  background:none;border:2px solid #303060;
  color:#505088;font-family:var(--font);font-size:8px;
  letter-spacing:2px;padding:10px 20px;cursor:pointer;
}
.refresh-btn:active{background:#0d0d2a;color:#8080c0;border-color:#5050a0;}

/* ── Weekly Summary Overlay ── */
#summary-overlay{
  position:fixed;inset:0;z-index:200;
  background:rgba(0,0,0,.93);
  display:flex;align-items:flex-start;justify-content:center;
  overflow-y:auto;padding:20px 12px 40px;
  animation:smFadeIn .5s ease forwards;
  cursor:pointer;
}
@keyframes smFadeIn{from{opacity:0}to{opacity:1}}

.sm-panel{
  background:var(--surface);
  border:3px solid var(--gold);
  box-shadow:0 0 0 2px #0a0a1a,0 0 0 5px var(--gold-dk),0 0 50px rgba(255,215,0,.18);
  padding:22px 18px 18px;
  max-width:480px;width:100%;
  cursor:default;
  position:relative;
}

.sm-title{
  text-align:center;
  font-size:clamp(11px,4.5vw,15px);
  color:var(--gold);
  text-shadow:3px 3px 0 var(--gold-dk);
  letter-spacing:3px;
  margin-bottom:6px;
}
.sm-week{
  text-align:center;font-size:7px;color:var(--dim);
  letter-spacing:3px;margin-bottom:22px;
}
.sm-divider{border:none;border-top:2px solid #181848;margin:16px 0;}

.sm-player-name{
  font-size:10px;letter-spacing:2px;margin-bottom:12px;
}
.sm-p1 .sm-player-name{color:var(--p1);}
.sm-p2 .sm-player-name{color:var(--p2);}

.sm-step{opacity:0;transform:translateX(-24px);transition:opacity .45s ease,transform .45s ease;}
.sm-step.sm-vis{opacity:1;transform:none;}

.sm-line{
  display:flex;justify-content:space-between;align-items:center;
  font-size:9px;margin-bottom:8px;padding:3px 0;
}
.sm-line-lbl{color:#a0a0c8;letter-spacing:1px;}
.sm-line-val{letter-spacing:1px;}
.sm-line.pos .sm-line-val{color:var(--done-txt);}
.sm-line.dim .sm-line-val{color:#404060;}
.sm-line.neg .sm-line-val{color:var(--miss-txt);}

.sm-subtotal{
  display:flex;justify-content:space-between;align-items:center;
  font-size:10px;
  border-top:1px solid #303060;padding-top:9px;
  margin-top:2px;margin-bottom:12px;
}
.sm-subtotal-lbl{color:var(--gold);}
.sm-subtotal-val{color:var(--gold);}

.sm-extras-lbl{
  font-size:8px;color:var(--dim);letter-spacing:2px;margin-bottom:8px;
}

.sm-grand{
  background:#110e00;border:2px solid #4a3200;
  padding:11px 14px;margin-top:6px;
  display:flex;justify-content:space-between;align-items:center;
}
.sm-grand-lbl{font-size:9px;color:var(--gold);letter-spacing:2px;}
.sm-grand-val{font-size:clamp(17px,5.5vw,22px);color:var(--gold);text-shadow:3px 3px 0 var(--gold-dk);}

.sm-tier-msg{font-size:8px;letter-spacing:2px;text-align:center;margin-top:8px;}

/* Tier 0 — nothing earned */
.sm-tier-zero .sm-grand-val{color:#404060;text-shadow:none;}
.sm-tier-zero .sm-grand{border-color:#252540;}
.sm-tier-zero .sm-tier-msg{color:#404060;}

/* Tier 1 — a little ($1–$3) */
.sm-tier-low .sm-grand-val{color:var(--p1);text-shadow:0 0 12px var(--p1),2px 2px 0 #004466;}
.sm-tier-low .sm-tier-msg{color:var(--p1);}

/* Tier 2 — decent ($4–$6) */
.sm-tier-mid .sm-grand-val{animation:smGoldPulse 1.6s ease-in-out infinite;}
.sm-tier-mid .sm-tier-msg{color:var(--gold);}
@keyframes smGoldPulse{
  0%,100%{text-shadow:3px 3px 0 var(--gold-dk);}
  50%{text-shadow:3px 3px 0 var(--gold-dk),0 0 18px var(--gold),0 0 36px rgba(255,215,0,.4);}
}

/* Tier 3 — legendary ($7+) */
.sm-tier-high .sm-grand-val{animation:smRainbow .9s linear infinite;}
.sm-tier-high .sm-grand{border-color:var(--gold);}
.sm-tier-high .sm-tier-msg{animation:smRainbow .9s linear infinite;}
.sm-tier-high .sm-panel{animation:smBorderRainbow 2s linear infinite;}
@keyframes smRainbow{
  0%  {color:#ff4444;text-shadow:2px 2px 0 #800000,0 0 16px #ff0000;}
  20% {color:#ffaa00;text-shadow:2px 2px 0 #804400,0 0 16px #ff8800;}
  40% {color:#ffff00;text-shadow:2px 2px 0 #808000,0 0 16px #ffff00;}
  60% {color:#00ff88;text-shadow:2px 2px 0 #008040,0 0 16px #00ff88;}
  80% {color:#00ccff;text-shadow:2px 2px 0 #006688,0 0 16px #00ccff;}
  100%{color:#ff4444;text-shadow:2px 2px 0 #800000,0 0 16px #ff0000;}
}
@keyframes smBorderRainbow{
  0%  {border-color:#ff4444;box-shadow:0 0 0 2px #0a0a1a,0 0 0 5px #800000,0 0 40px rgba(255,68,68,.25);}
  33% {border-color:#ffff00;box-shadow:0 0 0 2px #0a0a1a,0 0 0 5px #808000,0 0 40px rgba(255,255,0,.25);}
  66% {border-color:#00ff88;box-shadow:0 0 0 2px #0a0a1a,0 0 0 5px #008040,0 0 40px rgba(0,255,136,.25);}
  100%{border-color:#ff4444;box-shadow:0 0 0 2px #0a0a1a,0 0 0 5px #800000,0 0 40px rgba(255,68,68,.25);}
}

.sm-footer{
  text-align:center;font-size:7px;color:#404068;
  letter-spacing:2px;margin-top:22px;
  animation:smBlink 1.2s step-start infinite;
}
@keyframes smBlink{50%{opacity:0;}}

/* ── Footer ── */
footer{
  text-align:center;font-size:7px;color:#505080;
  margin-top:20px;padding-top:12px;
  border-top:2px solid #0e0e30;letter-spacing:1px;
}
</style>
</head>
<body>

<header>
  <h1 class="title">★ CHORE QUEST ★</h1>
  <p class="subtitle">HOUSEHOLD HEROES</p>
</header>

<div id="app"><div class="loading">LOADING DATA...</div></div>

<button class="refresh-btn" onclick="location.reload()">&#8635; REFRESH</button>

<footer>INSERT COIN TO CONTINUE &nbsp;·&nbsp; LIVE DATA FROM HEADQUARTERS</footer>

<script>
const SHEET_ID = '1dAmlZqyuLw1SSuRTHwXO0fXBnTWLvB-Hb79ImoAtXLg';
const DAY_LABELS = ['SU','MO','TU','WE','TH','FR','SA'];
const MONTHS = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];

const NOW   = new Date();
const TODAY = new Date(NOW);
TODAY.setHours(0,0,0,0);
// ET time parts — used for noon cutoff and Saturday summary gating
const ET_PARTS = new Intl.DateTimeFormat('en-US', {
  timeZone: 'America/New_York',
  weekday: 'long', year: 'numeric', month: '2-digit', day: '2-digit', hour: 'numeric', hour12: false
}).formatToParts(NOW).reduce((o, p) => { o[p.type] = p.value; return o; }, {});
const ET_HOUR    = parseInt(ET_PARTS.hour, 10);
const ET_WEEKDAY = ET_PARTS.weekday;                                    // e.g. 'Saturday'
const ET_DAY_KEY = `${ET_PARTS.year}${ET_PARTS.month}${ET_PARTS.day}`; // e.g. '20260531'
const BEFORE_NOON = ET_HOUR < 12;

// ── CSV parser ──────────────────────────────────────────────
function parseCSV(text) {
  return text.split('\n').map(raw => {
    const line = raw.replace(/\r$/, '');
    const cols = [];
    let field = '', inQ = false;
    for (let i = 0; i < line.length; i++) {
      if (line[i] === '"') { inQ = !inQ; }
      else if (line[i] === ',' && !inQ) { cols.push(field.trim()); field = ''; }
      else { field += line[i]; }
    }
    cols.push(field.trim());
    return cols;
  });
}

function money(s) {
  if (!s) return null;
  const c = s.replace(/[\s$,]/g, '');
  if (!c || c === '-') return null;
  const n = parseFloat(c);
  return isNaN(n) ? null : n;
}

// ── Sheet parser ────────────────────────────────────────────
// Column layout (0-indexed):
//  0=week date  2=name  3-9=S/M/T/W/T/F/S  10=trash  11=pay
//  13=simonOwed  O(14)=simonAdj  P(15)=simonNote  Q(16)=simonAdjDate
//  18=desOwed    T(19)=desAdj    U(20)=desNote    V(21)=desAdjDate
// Extras are collected from EVERY row in a week section (named or not),
// so additional credit/debit rows can be added freely in the sheet.
function parseSheet(rows) {
  const weeks = [];
  let cur = null;
  for (const c of rows) {
    if (!c.length) continue;
    if (c[0] && /^\d{2}\/\d{2}\/\d{2}$/.test(c[0])) {
      cur = { date: c[0], simon: null, desmond: null, extras: [] };
      weeks.push(cur);
      // Still scan for extras on the week-header row itself before moving on
      const sa0 = money(c[14]);
      if (sa0 != null) cur.extras.push({ player:'simon',   amt:sa0, note:(c[15]||'').trim(), date:(c[16]||'').trim() });
      const da0 = money(c[19]);
      if (da0 != null) cur.extras.push({ player:'desmond', amt:da0, note:(c[20]||'').trim(), date:(c[21]||'').trim() });
      continue;
    }
    if (!cur) continue;
    const nm = (c[2] || '').trim().toLowerCase();
    if (nm === 'simon' || nm === 'desmond') {
      cur[nm] = {
        days:      DAY_LABELS.map((_, i) => { if (isExcused(c[3+i])) return 'excused'; const v = money(c[3+i]); return v != null && v > 0; }),
        trash:     (() => { if (isExcused(c[10])) return 'excused'; const v = money(c[10]); return v != null && v > 0; })(),
        pay:       money(c[11]) || 0,
        simonOwed: money(c[13]),
        desOwed:   money(c[18]),
      };
    }
    // Scan O/P/Q (Simon) and T/U/V (Desmond) on every row
    const sa = money(c[14]);
    if (sa != null) cur.extras.push({ player:'simon',   amt:sa, note:(c[15]||'').trim(), date:(c[16]||'').trim() });
    const da = money(c[19]);
    if (da != null) cur.extras.push({ player:'desmond', amt:da, note:(c[20]||'').trim(), date:(c[21]||'').trim() });
  }
  return weeks.filter(w => w.simon || w.desmond);
}

// ── Money calculation ───────────────────────────────────────
// Strategy: take first snapshot found (in Simon's row for both players),
// then add all weekly pays. Desmond's row may carry a payout adjustment.
function calcOwed(weeks, key) {
  // Use the sheet's authoritative running balance from completed weeks only,
  // then add any one-off adjustments (e.g. mowing bonus) from the current week.
  let last = 0;
  let adj = 0;
  for (const w of weeks) {
    const sat = parseWDate(w.date);
    sat.setDate(sat.getDate() + 6);
    if (sat > TODAY) {
      // Week still in progress — pick up one-off adjustments only
      for (const e of w.extras) if (e.player === key) adj += e.amt;
      // Quest complete mid-week? Pay is earned — add it now
      const r = w[key];
      if (r && isAllDone(r)) adj += r.pay;
      continue;
    }
    if (w.simon) {
      const snap = key === 'simon' ? w.simon.simonOwed : w.simon.desOwed;
      if (snap !== null) last = snap;
    }
    if (key === 'desmond' && w.desmond && w.desmond.desOwed !== null)
      last = w.desmond.desOwed;
  }
  return last + adj;
}

// ── Date helpers ────────────────────────────────────────────
function parseWDate(str) {
  const [m,d,y] = str.split('/').map(Number);
  return new Date(2000+y, m-1, d);
}
function fmtDate(str) {
  const [m,,] = str.split('/').map(Number);
  const d = parseInt(str.split('/')[1]);
  return `${MONTHS[m-1]} ${d}`;
}
function dayState(weekStr, dayIdx, done) {
  if (done === 'excused') return 'excused';
  if (done) return 'done';
  const dt = parseWDate(weekStr);
  dt.setDate(dt.getDate() + dayIdx);
  if (dt > TODAY) return 'pend';
  if (dt.getTime() === TODAY.getTime() && BEFORE_NOON) return 'pend';
  return 'missed';
}
function trashState(weekStr, done) {
  if (done === 'excused') return 'excused';
  if (done) return 'done';
  const sat = parseWDate(weekStr);
  sat.setDate(sat.getDate() + 6);
  return sat > TODAY ? 'pend' : 'missed';
}
const SYM = { done:'✓', missed:'✗', pend:'?', excused:'—' };
function isExcused(raw) { return (raw || '').trim().toUpperCase() === 'N/A'; }

function isEmptyRow(r) {
  return !r || (r.pay === 0 && !r.days.some(Boolean) && !r.trash);
}

function calcStreak(weeks, key) {
  // Iterate every week's daily slots directly — a missing row (no data yet)
  // counts as all-missed, so a new week with no entries breaks the streak.
  const days = [];
  for (const w of weeks) {
    const r = w[key]; // null if player has no row this week
    for (let i = 0; i < DAY_LABELS.length; i++) {
      const dt = parseWDate(w.date);
      dt.setDate(dt.getDate() + i);
      if (dt > TODAY) continue; // future — skip
      const done = r ? r.days[i] : false;
      if (done === 'excused') continue; // excused — skip, don't break streak
      // Before noon grace: skip today's undone tasks rather than penalising
      if (dt.getTime() === TODAY.getTime() && BEFORE_NOON && !done) continue;
      days.push({ dt, done });
    }
  }
  days.sort((a, b) => b.dt - a.dt);
  let streak = 0;
  for (const { done } of days) {
    if (done) streak++;
    else break;
  }
  return streak;
}

function isAllDone(row) {
  if (!row) return false;
  const hasDone = row.days.some(d => d === true) || row.trash === true;
  return hasDone
    && row.days.every(d => d === true || d === 'excused')
    && (row.trash === true || row.trash === 'excused');
}

// ── Past-30-day earnings ────────────────────────────────────
function calcMonthEarnings(weeks, key) {
  const cutoff = new Date(TODAY);
  cutoff.setDate(cutoff.getDate() - 30);
  let total = 0;
  for (const w of weeks) {
    const r = w[key];
    if (!r || isEmptyRow(r)) continue;
    const sat = parseWDate(w.date);
    sat.setDate(sat.getDate() + 6);
    if (sat >= cutoff && sat <= TODAY) total += r.pay || 0;
  }
  return total;
}

// ── Card builder ────────────────────────────────────────────
function buildCard(weeks, name, num) {
  const key = name.toLowerCase();
  const owed = calcOwed(weeks, key);
  const streak = calcStreak(weeks, key);
  const monthEarned = calcMonthEarnings(weeks, key);

  // Completion rate — only count days that have already occurred
  let total = 0, done = 0;
  for (const w of weeks) {
    const r = w[key];
    if (!r || isEmptyRow(r)) continue;
    r.days.forEach((d, i) => {
      const dt = parseWDate(w.date);
      dt.setDate(dt.getDate() + i);
      if (dt > TODAY) return;
      if (dt.getTime() === TODAY.getTime() && BEFORE_NOON) return;
      if (d === 'excused') return;
      total++;
      if (d === true) done++;
    });
    const sat = parseWDate(w.date);
    sat.setDate(sat.getDate() + 6);
    if (sat <= TODAY && r.trash !== 'excused') { total++; if (r.trash === true) done++; }
  }
  const pct = total ? done / total : 0;
  const pips = Array.from({length:10}, (_,i) =>
    `<div class="pip${i < Math.round(pct*10) ? ' on' : ''}"></div>`
  ).join('');

  // The calendar week that contains today (may have no data yet for this player)
  const thisWeek = weeks.find(w => {
    const start = parseWDate(w.date);
    const sat = new Date(start); sat.setDate(sat.getDate() + 6);
    return TODAY >= start && TODAY <= sat;
  });

  // Non-empty weeks for this player (used for history)
  const filled = weeks.filter(w => w[key] && !isEmptyRow(w[key]));

  // Always show the current calendar week — avoids stale "Quest Complete"
  // from last week when the new week has no entries yet
  const curW = thisWeek || (filled.length ? filled[filled.length - 1] : null);

  // Streak badge
  const streakTier = streak >= 25 ? 'streak-t4' : streak >= 15 ? 'streak-t3' : streak >= 10 ? 'streak-t2' : streak >= 5 ? 'streak-t1' : '';
  const streakHtml = streak > 1
    ? `<div class="streak ${streakTier}">
        <span class="streak-fire">🔥</span>
        <span class="streak-num">${streak}</span>
        <span class="streak-lbl">DAY${streak !== 1 ? 'S' : ''}<br>STREAK</span>
       </div>`
    : `<div class="streak-go">&#9733; DO YOUR CHORES AND START A STREAK!</div>`;

  // Current week: celebration or normal grid
  let gridHtml = '';
  if (curW) {
    const r = curW[key]; // null if player has no entries yet this week
    if (r && isAllDone(r)) {
      gridHtml = `
        <div class="cel-box">
          <div class="cel-stars">&#9733; &#9733; &#9733;</div>
          <div class="cel-msg">QUEST<br>COMPLETE!</div>
          <div class="cel-earn">ALL CHORES DONE &mdash; $${r.pay.toFixed(2)} EARNED</div>
        </div>`;
    } else {
      const days = r ? r.days : Array(7).fill(false);
      const cells = days.map((d,i) => {
        const st = dayState(curW.date, i, d);
        return `<div class="day-cell">
          <span class="day-lbl">${DAY_LABELS[i]}</span>
          <div class="day-box ${st}">${SYM[st]}</div>
        </div>`;
      }).join('');
      const tst = trashState(curW.date, r ? r.trash : false);
      const trCell = `<div class="day-cell tr-cell">
        <span class="day-lbl">TRASH</span>
        <div class="day-box ${tst}">${SYM[tst]}</div>
      </div>`;
      gridHtml = `
        <div class="slbl">CURRENT WEEK</div>
        <div class="week-lbl cur">&#9658; WEEK OF ${fmtDate(curW.date)}</div>
        <div class="chore-grid">${trCell}${cells}</div>
        ${r ? `<div class="week-pay">QUEST IN PROGRESS &nbsp;&middot;&nbsp; $${r.pay.toFixed(2)} SO FAR</div>` : ''}`;
    }
  }

  // History (all filled weeks, newest first, excluding curW)
  const histRows = [...filled].reverse().filter(w => w !== curW).map(w => {
    const r = w[key];
    const dots = r.days.map(d => `<div class="hdot ${d===true?'done':d==='excused'?'excused':'missed'}"></div>`).join('');
    const tr = `<div class="hdot tr ${r.trash===true?'done':r.trash==='excused'?'excused':'missed'}"></div>`;
    return `<div class="hist-row">
      <span class="hist-date">${fmtDate(w.date)}</span>
      <div class="hist-dots">${tr}${dots}</div>
      <span class="hist-pay">$${r.pay.toFixed(2)}</span>
    </div>`;
  }).join('');

  const icon = num === 1 ? '🎮' : '🕹️';
  return `
  <div class="card card-p${num}">
    <div class="card-head">
      <span class="card-icon">${icon}</span>
      <span class="card-name">${name.toUpperCase()}</span>
      <button class="summary-btn" onclick="showSummary('${key}')">📊 LAST WEEK</button>
    </div>

    <div class="slbl">COMPLETION RATE — ${Math.round(pct*100)}%</div>
    <div class="pips">${pips}</div>

    ${streakHtml}

    ${gridHtml}

    <div class="money-box">
      <div class="money-lbl">COINS OWED</div>
      <div class="money-val">
        <span class="coin">🪙</span>
        $${owed.toFixed(2)}
      </div>
    </div>

    ${histRows ? `
    <div class="month-earn">
      <span class="month-earn-lbl">PAST 30 DAYS</span>
      <span class="month-earn-val">$${monthEarned.toFixed(2)}</span>
    </div>
    <div class="hist-section">
      <div class="slbl">HISTORY &nbsp; TR &middot; SU MO TU WE TH FR SA</div>
      ${histRows}
    </div>` : ''}

    ${(() => {
      const entries = [];
      for (const w of weeks) {
        for (const e of w.extras) {
          if (e.player === key) entries.push({ date: e.date || w.date, amt: e.amt, note: e.note });
        }
      }
      if (!entries.length) return '';
      const rows = entries.map(e => `
        <div class="extra-row">
          <span class="extra-date">${fmtDate(e.date)}</span>
          <span class="extra-note">${e.note || '—'}</span>
          <span class="extra-amt ${e.amt > 0 ? 'pos' : 'neg'}">${e.amt > 0 ? '+' : '−'}$${Math.abs(e.amt).toFixed(2)}</span>
        </div>`).join('');
      return '<div class="extras-section"><div class="slbl">EXTRAS</div>' + rows + '</div>';
    })()}
  </div>`;
}

// ── Saturday Summary ────────────────────────────────────────
function shouldShowSummary() {
  if (ET_WEEKDAY !== 'Saturday') return false;
  if (ET_HOUR < 20) return false;
  const key = `wkSummary_${ET_DAY_KEY}`;
  if (localStorage.getItem(key)) return false;
  localStorage.setItem(key, '1');
  return true;
}

function tierClass(amt) {
  if (amt <= 0)  return 'sm-tier-zero';
  if (amt < 4)   return 'sm-tier-low';
  if (amt < 7)   return 'sm-tier-mid';
  return 'sm-tier-high';
}

const TIER_MSG = {
  'sm-tier-low':  '— KEEP IT UP! —',
  'sm-tier-mid':  '— GREAT WEEK! —',
  'sm-tier-high': '— LEGENDARY WEEK!! —',
};

function buildSummaryModal(weeks, playerKey) {
  // Find the week before the current calendar week
  const curIdx = weeks.findIndex(w => {
    const start = parseWDate(w.date);
    const sat = new Date(start); sat.setDate(sat.getDate() + 6);
    return TODAY >= start && TODAY <= sat;
  });
  const targetW = curIdx > 0 ? weeks[curIdx - 1]
                : curIdx === -1 && weeks.length ? weeks[weeks.length - 1]
                : null;
  if (!targetW) return;

  const ALL_PLAYERS = [
    { key: 'simon',   label: '🎮 SIMON',   cls: 'sm-p1' },
    { key: 'desmond', label: '🕹️ DESMOND', cls: 'sm-p2' },
  ];
  const players = (playerKey ? ALL_PLAYERS.filter(p => p.key === playerKey) : ALL_PLAYERS)
  .map(p => {
    const r = targetW[p.key];
    const availDays   = r ? r.days.filter(d => d !== 'excused').length : 7;
    const bedDays     = r ? r.days.filter(d => d === true).length : 0;
    const bedEarned   = bedDays * 1.0;
    const trashExcused = r ? r.trash === 'excused' : false;
    const trashDone   = r ? r.trash === true : false;
    const trashEarned = trashDone ? 2.0 : 0;
    const choreTotal  = bedEarned + trashEarned;
    const weekStart = parseWDate(targetW.date);
    const weekEnd   = new Date(weekStart); weekEnd.setDate(weekEnd.getDate() + 6);
    function parseAnyDate(str) {
      const [m, d, y] = str.split('/').map(Number);
      return new Date(y > 999 ? y : 2000 + y, m - 1, d);
    }
    const extras    = weeks
      .flatMap(w => w.extras.map(e => ({ ...e, _week: w })))
      .filter(e => {
        if (e.player !== p.key) return false;
        if (e.date) {
          const d = parseAnyDate(e.date);
          return d >= weekStart && d <= weekEnd;
        }
        return e._week === targetW;
      });
    const extrasTotal = extras.reduce((s, e) => s + e.amt, 0);
    const grandTotal  = choreTotal + extrasTotal;
    return { ...p, availDays, bedDays, bedEarned, trashExcused, trashDone, trashEarned, choreTotal, extras, extrasTotal, grandTotal };
  });

  // Build HTML — all step elements start invisible, values show ···
  const playerBlocks = players.map((p, pi) => {
    const tier = tierClass(p.grandTotal);
    const k = p.key;
    let html = '';

    html += `<div class="sm-player-name ${p.cls} sm-step" id="${k}-name">${p.label}</div>`;

    html += `<div class="sm-line ${p.bedEarned > 0 ? 'pos' : 'dim'} sm-step" id="${k}-bed-row">
      <span class="sm-line-lbl">&#x1F6CF; BED (${p.bedDays}/${p.availDays} DAYS)</span>
      <span class="sm-line-val" id="${k}-bed">&#xB7;&#xB7;&#xB7;</span>
    </div>`;

    html += `<div class="sm-line ${p.trashDone ? 'pos' : 'dim'} sm-step" id="${k}-trash-row">
      <span class="sm-line-lbl">&#x1F5D1; TRASH${p.trashExcused ? ' (N/A)' : ''}</span>
      <span class="sm-line-val" id="${k}-trash">&#xB7;&#xB7;&#xB7;</span>
    </div>`;

    html += `<div class="sm-subtotal sm-step" id="${k}-sub-row">
      <span class="sm-subtotal-lbl">CHORES</span>
      <span class="sm-subtotal-val" id="${k}-sub">&#xB7;&#xB7;&#xB7;</span>
    </div>`;

    if (p.extras.length) {
      html += `<div class="sm-extras-lbl sm-step" id="${k}-xlbl">EXTRAS</div>`;
      p.extras.forEach((e, ei) => {
        const ecls = e.amt >= 0 ? 'pos' : 'neg';
        const label = e.note ? e.note.toUpperCase() : 'BONUS';
        html += `<div class="sm-line ${ecls} sm-step" id="${k}-x${ei}-row">
          <span class="sm-line-lbl">${label}</span>
          <span class="sm-line-val" id="${k}-x${ei}">&#xB7;&#xB7;&#xB7;</span>
        </div>`;
      });
    }

    html += `<div class="sm-grand ${tier} sm-step" id="${k}-grand-row">
      <span class="sm-grand-lbl">TOTAL EARNED</span>
      <span class="sm-grand-val" id="${k}-grand">&#xB7;&#xB7;&#xB7;</span>
    </div>`;

    if (TIER_MSG[tier]) html += `<div class="sm-tier-msg ${tier} sm-step" id="${k}-tier">${TIER_MSG[tier]}</div>`;

    if (pi === 0 && players.length > 1) html += '<hr class="sm-divider">';
    return `<div class="${p.cls}">${html}</div>`;
  }).join('');

  const titleName = playerKey ? ` · ${playerKey.toUpperCase()}` : '';
  const overlay = document.createElement('div');
  overlay.id = 'summary-overlay';
  overlay.innerHTML = `
    <div class="sm-panel">
      <div class="sm-title">&#x2605; WEEKLY REPORT${titleName} &#x2605;</div>
      <div class="sm-week">WEEK OF ${fmtDate(targetW.date)}</div>
      ${playerBlocks}
      <div class="sm-footer sm-step" id="sm-footer-hint">TAP ANYWHERE TO CONTINUE</div>
    </div>`;

  overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });
  overlay.querySelector('.sm-panel').addEventListener('click', () => overlay.remove());
  document.body.appendChild(overlay);

  // ── Sequenced animation ─────────────────────────────────────
  const STEP     = 420;  // ms between row reveals
  const DELAY    = 100;  // ms after row appears before countup starts
  const COUNT_SM = 380;  // countup duration for line items
  const COUNT_LG = 1300; // countup duration for grand total

  const q    = s  => overlay.querySelector(s);
  const show = id => { const el = q('#' + id); if (el) el.classList.add('sm-vis'); };

  function countUp(id, target, prefix, duration, onDone) {
    const el = q('#' + id);
    if (!el) { onDone && setTimeout(onDone, duration); return; }
    if (target === null) { el.textContent = '—'; onDone && onDone(); return; }
    const t0 = performance.now();
    (function frame(now) {
      const p = Math.min((now - t0) / duration, 1);
      el.textContent = prefix + (target * (1 - Math.pow(1 - p, 3))).toFixed(2);
      if (p < 1) requestAnimationFrame(frame);
      else { el.textContent = prefix + target.toFixed(2); onDone && onDone(); }
    })(performance.now());
  }

  const acts = [];
  const at = (ms, fn) => acts.push({ ms, fn });
  let t = 350;

  players.forEach(p => {
    const k = p.key;

    at(t, () => show(`${k}-name`));
    t += STEP;

    at(t,          () => show(`${k}-bed-row`));
    at(t + DELAY,  () => countUp(`${k}-bed`, p.bedEarned, p.bedEarned > 0 ? '+$' : '$', COUNT_SM));
    t += STEP;

    at(t,          () => show(`${k}-trash-row`));
    at(t + DELAY,  () => countUp(`${k}-trash`, p.trashDone ? 2 : null, '+$', COUNT_SM));
    t += STEP + 80;

    at(t,          () => show(`${k}-sub-row`));
    at(t + DELAY,  () => countUp(`${k}-sub`, p.choreTotal, '$', COUNT_SM));
    t += STEP;

    if (p.extras.length) {
      at(t, () => show(`${k}-xlbl`));
      t += STEP;
      p.extras.forEach((e, ei) => {
        at(t,         () => show(`${k}-x${ei}-row`));
        at(t + DELAY, () => countUp(`${k}-x${ei}`, Math.abs(e.amt), e.amt >= 0 ? '+$' : '−$', COUNT_SM));
        t += STEP;
      });
    }

    t += 140;
    at(t,         () => show(`${k}-grand-row`));
    at(t + DELAY, () => countUp(`${k}-grand`, p.grandTotal, '$', COUNT_LG, () => show(`${k}-tier`)));
    t += COUNT_LG + 500;
  });

  at(t + 100, () => show('sm-footer-hint'));
  acts.forEach(({ ms, fn }) => setTimeout(fn, ms));
}

// ── Main ────────────────────────────────────────────────────
async function init() {
  const app = document.getElementById('app');
  try {
    const res = await fetch(
      `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&t=${Date.now()}`
    );
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const text = await res.text();
    const weeks = parseSheet(parseCSV(text));
    if (!weeks.length) throw new Error('No data found in sheet');

    const season = `${fmtDate(weeks[0].date)} &#8212; ${fmtDate(weeks[weeks.length-1].date)}`;
    app.innerHTML = `
      <div class="season-bar">&#128197; SEASON: ${season}</div>
      <div class="players">
        ${buildCard(weeks, 'Simon', 1)}
        ${buildCard(weeks, 'Desmond', 2)}
      </div>`;
    window.showSummary = (playerKey) => {
      const existing = document.getElementById('summary-overlay');
      if (existing) existing.remove();
      buildSummaryModal(weeks, playerKey);
    };
    if (shouldShowSummary()) buildSummaryModal(weeks);
  } catch (err) {
    app.innerHTML = `
      <div class="err-box">
        &#9888; LOAD ERROR<br><br>
        ${err.message}<br><br>
        SHEET MUST BE SET TO<br>"ANYONE WITH LINK CAN VIEW"
      </div>`;
  }
}

init();
</script>
</body>
</html>
