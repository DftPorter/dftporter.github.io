<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Chore Quest</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#FFF6E9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Chores">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{background:#FFF6E9;font-family:Fredoka,system-ui,sans-serif;color:#1A1712;-webkit-font-smoothing:antialiased;}
button{font-family:inherit;}
@keyframes pulseGlow{0%,100%{transform:scale(1);}50%{transform:scale(1.12);}}
@keyframes todayBob{0%,100%{transform:translateY(0);}50%{transform:translateY(-3px);}}
.wrap{min-height:100vh;display:flex;justify-content:center;}
.col{width:100%;max-width:480px;padding:max(22px,env(safe-area-inset-top)) 18px calc(48px + env(safe-area-inset-bottom));display:flex;flex-direction:column;}
.hdr{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:18px;}
.title{font-weight:700;font-size:26px;letter-spacing:-.01em;line-height:1.1;}
.sub{font-size:13px;color:#8A7B62;font-family:Nunito,sans-serif;font-weight:700;}
.refresh{background:#fff;border:2.5px solid #1A1712;color:#1A1712;border-radius:14px;width:46px;height:46px;font-size:18px;cursor:pointer;box-shadow:3px 3px 0 #1A1712;flex-shrink:0;}
.refresh:active{transform:translate(3px,3px);box-shadow:none;}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px;}
.tab{display:flex;align-items:center;gap:9px;padding:12px 13px;min-height:48px;border-radius:16px;border:2.5px solid #1A1712;font-weight:600;font-size:16px;cursor:pointer;text-align:left;}
.ring{width:24px;height:24px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;}
.ring i{width:14px;height:14px;border-radius:50%;display:block;}
.hero{background:#E4572E;border:3px solid #1A1712;border-radius:24px;padding:20px;margin-bottom:16px;box-shadow:5px 5px 0 #1A1712;color:#FFF6E9;}
.hero h2{font-size:14px;font-weight:600;}
.hero .big{font-size:60px;font-weight:700;line-height:.85;}
.bar{height:16px;border-radius:99px;background:#8C2A10;border:2.5px solid #1A1712;overflow:hidden;}
.bar i{display:block;height:100%;background:#FFD166;transition:width .5s ease;}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:10px;}
.day{display:flex;flex-direction:column;align-items:center;gap:4px;}
.day .l{font-size:12px;font-family:Nunito,sans-serif;font-weight:800;}
.tile{width:100%;aspect-ratio:1/1.15;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.tile .n{font-size:13px;font-family:Nunito,sans-serif;font-weight:800;line-height:1.1;}
.tile .s{font-size:17px;font-weight:700;line-height:1;}
.day .t{font-size:9px;font-family:Nunito,sans-serif;font-weight:800;letter-spacing:.06em;color:#E4572E;height:11px;}
.row{display:flex;align-items:center;gap:10px;border:2.5px solid #1A1712;border-radius:16px;padding:12px 14px;min-height:48px;}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin:10px 0 18px;font-family:Nunito,sans-serif;font-weight:700;font-size:12px;color:#6B5D48;}
.legend span{display:flex;align-items:center;gap:5px;}
.legend b{width:16px;height:16px;border-radius:5px;border:2px solid #1A1712;display:grid;place-items:center;font-family:Fredoka,sans-serif;font-size:10px;font-weight:700;}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
.card{background:#fff;border:2.5px solid #1A1712;border-radius:18px;padding:14px;box-shadow:3px 3px 0 #1A1712;display:flex;flex-direction:column;}
.card .k{font-size:13px;color:#8A7B62;font-weight:600;}
.card .v{font-size:32px;font-weight:700;line-height:1;margin-top:2px;}
.card .d{font-size:13px;color:#6B5D48;font-family:Nunito,sans-serif;font-weight:700;}
.money{position:relative;overflow:hidden;border:3px solid #1A1712;border-radius:24px;padding:18px 20px;margin-bottom:16px;min-height:112px;box-shadow:5px 5px 0 #1A1712;display:flex;align-items:center;}
.money img{position:absolute;right:-14px;bottom:-10px;height:132%;width:auto;max-width:none;pointer-events:none;user-select:none;}
.money .txt{position:relative;display:flex;flex-direction:column;}
.strip{background:#fff;border:2.5px solid #1A1712;border-radius:18px;padding:14px 16px;min-height:48px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;box-shadow:3px 3px 0 #1A1712;}
.extra{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid #1A1712;border-radius:14px;padding:11px 12px;font-family:Nunito,sans-serif;font-weight:700;}
.more{width:100%;background:#fff;border:2.5px solid #1A1712;color:#1A1712;border-radius:16px;padding:14px;min-height:50px;font-weight:600;font-size:15px;cursor:pointer;box-shadow:3px 3px 0 #1A1712;}
.more:active{transform:translate(3px,3px);box-shadow:none;}
.panel{background:#fff;border:2.5px solid #1A1712;border-radius:16px;padding:16px;}
.panel .k{font-size:14px;font-weight:600;color:#8A7B62;}
.line{display:flex;justify-content:space-between;gap:12px;font-size:13px;font-family:Nunito,sans-serif;font-weight:700;}
.hrow{display:flex;align-items:center;gap:8px;}
.hrow .dt{font-size:12px;color:#8A7B62;min-width:46px;font-family:Nunito,sans-serif;font-weight:700;}
.cells{display:flex;gap:3px;flex:1;}
.cells i{width:13px;height:13px;border-radius:4px;border:1.5px solid #1A1712;}
.warn{margin-top:16px;background:#FFD9CF;border:2.5px solid #1A1712;border-radius:16px;padding:13px 15px;font-family:Nunito,sans-serif;font-weight:700;font-size:13px;color:#8C2A10;}
</style>
</head>
<body>
<div class="wrap"><div class="col" id="app"></div></div>

<script>
// ─── config ───────────────────────────────────────────────────────────────
var SHEET_ID = '1dAmlZqyuLw1SSuRTHwXO0fXBnTWLvB-Hb79ImoAtXLg';
var PLAYERS = [['simon','Simon'],['desmond','Desmond']];
var BED_RATE = 1, TRASH_RATE = 2;
// Illustration on the balance card. Swap for any of the money-*.png files in
// this folder, or set to '' to fall back to the emoji.
var MONEY_ART = 'money-cash-pile.png';
var TIERS = [5,10,15,25];

var DAY_LBL = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
var MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var SYM = { done:'\u2713', missed:'\u2717', pend:'\u00b7', excused:'\u2013' };
var CACHE_KEY = 'choreQuest.cache.v1';
var TAB_KEY = 'choreQuest.tab';

var P = {
  done:{bg:'#0F6B47',fg:'#FFFFFF',num:'#FFFFFF'},
  missed:{bg:'#FFD9CF',fg:'#B03A1A',num:'#8C2A10'},
  pend:{bg:'#FFFDF7',fg:'#B8A98F',num:'#5C503C'},
  excused:{bg:'#EDE7DC',fg:'#6B6355',num:'#6B6355'},
  pos:'#0F6B47', neg:'#C4381A', muted:'#8A7B62',
  money:{bg:'#FFD166',fg:'#1A1712',lbl:'#7A5E0D'},
  debt:{bg:'#FFD9CF',fg:'#8C2A10',lbl:'#A33314'},
  streak:['#8A7B62','#E8A317','#F07B22','#E4572E','#D6246E']
};

// ─── state ────────────────────────────────────────────────────────────────
var S = { weeks:null, sample:false, fetchedAt:null, loading:true, tab:0, more:false };
try { S.tab = parseInt(localStorage.getItem(TAB_KEY),10) || 0; } catch(e){}

// ─── sheet parsing ────────────────────────────────────────────────────────
function parseCSV(text){
  return text.split('\n').map(function(raw){
    var line = raw.replace(/\r$/,''), cols=[], f='', q=false;
    for(var i=0;i<line.length;i++){
      if(line[i]==='"') q=!q;
      else if(line[i]===',' && !q){ cols.push(f.trim()); f=''; }
      else f+=line[i];
    }
    cols.push(f.trim()); return cols;
  });
}
function money(s){
  if(!s) return null;
  var c = String(s).replace(/[\s$,]/g,'');
  if(!c || c==='-') return null;
  if(c.charAt(0)==='(' && c.charAt(c.length-1)===')') c = '-'+c.slice(1,-1);
  var n = parseFloat(c); return isNaN(n) ? null : n;
}
function isExcused(raw){ return (raw||'').trim().toUpperCase()==='N/A'; }

function parseSheet(rows){
  var weeks=[], cur=null;
  rows.forEach(function(c){
    if(!c.length) return;
    if(c[0] && /^\d{2}\/\d{2}\/\d{2}$/.test(c[0])){ cur={date:c[0],simon:null,desmond:null,extras:[]}; weeks.push(cur); }
    if(!cur) return;
    var nm = (c[2]||'').trim().toLowerCase();
    if(nm==='simon' || nm==='desmond'){
      cur[nm] = {
        days: DAY_LBL.map(function(_,i){ if(isExcused(c[3+i])) return 'excused'; var v=money(c[3+i]); return v!=null && v>0; }),
        trash: (function(){ if(isExcused(c[10])) return 'excused'; var v=money(c[10]); return v!=null && v>0; })(),
        pay: money(c[11]) || 0,
        simonOwed: money(c[13]), desOwed: money(c[18])
      };
    }
    var sa = money(c[14]); if(sa!=null) cur.extras.push({player:'simon',amt:sa,note:(c[15]||'').trim(),date:(c[16]||'').trim()});
    var da = money(c[19]); if(da!=null) cur.extras.push({player:'desmond',amt:da,note:(c[20]||'').trim(),date:(c[21]||'').trim()});
  });
  return weeks.filter(function(w){ return w.simon || w.desmond; });
}

// ─── date helpers ─────────────────────────────────────────────────────────
function today(){ var d=new Date(); d.setHours(0,0,0,0); return d; }
function beforeNoon(){ return new Date().getHours() < 12; }
function wdate(str){ var p=str.split('/').map(Number); return new Date(p[2]>999?p[2]:2000+p[2], p[0]-1, p[1]); }
function fmt(str){ var p=str.split('/').map(Number); return MONTHS[p[0]-1]+' '+p[1]; }
function fmtD(d){ return MONTHS[d.getMonth()]+' '+d.getDate(); }
function ago(ts){
  if(!ts) return 'loading\u2026';
  var mins = Math.floor((Date.now()-ts)/60000);
  if(mins < 1) return 'updated just now';
  if(mins < 60) return 'updated '+mins+'m ago';
  var hrs = Math.floor(mins/60);
  if(hrs < 24) return 'updated '+hrs+'h ago';
  var d = new Date(ts);
  return 'updated '+DAY_LBL[d.getDay()]+' '+fmtD(d);
}
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ─── chore state ──────────────────────────────────────────────────────────
function dayState(weekStr,i,done){
  if(done==='excused') return 'excused';
  if(done) return 'done';
  var dt = wdate(weekStr); dt.setDate(dt.getDate()+i);
  var T = today();
  if(dt > T) return 'pend';
  if(dt.getTime()===T.getTime() && beforeNoon()) return 'pend';
  return 'missed';
}
function trashState(weekStr,done){
  if(done==='excused') return 'excused';
  if(done) return 'done';
  var sat = wdate(weekStr); sat.setDate(sat.getDate()+6);
  return sat > today() ? 'pend' : 'missed';
}
function emptyRow(r){ return !r || (r.pay===0 && r.days.indexOf(true)===-1 && !r.trash); }

function streakOf(weeks,key){
  var T = today(), days=[];
  weeks.forEach(function(w){
    var r = w[key];
    for(var i=0;i<7;i++){
      var dt = wdate(w.date); dt.setDate(dt.getDate()+i);
      if(dt > T) continue;
      var done = r ? r.days[i] : false;
      if(done==='excused') continue;
      if(dt.getTime()===T.getTime() && beforeNoon() && !done) continue;
      days.push({dt:dt,done:done});
    }
  });
  days.sort(function(a,b){ return b.dt-a.dt; });
  var n=0;
  for(var j=0;j<days.length;j++){ if(days[j].done) n++; else break; }
  return n;
}

// The sheet's owed cell is the source of truth — take the last one filled in
// and show it verbatim. Never add pay or extras on top; the cell already has them.
function owedOf(weeks,key){
  var amount = 0;
  weeks.forEach(function(w){
    var snap = null;
    if(w.simon){ var s = key==='simon' ? w.simon.simonOwed : w.simon.desOwed; if(s!=null) snap = s; }
    if(key==='desmond' && w.desmond && w.desmond.desOwed!=null) snap = w.desmond.desOwed;
    if(snap!=null) amount = snap;
  });
  return { amount:amount };
}

function monthOf(weeks,key){
  var T = today(), cut = new Date(T); cut.setDate(cut.getDate()-30);
  var t=0;
  weeks.forEach(function(w){
    var r = w[key]; if(emptyRow(r)) return;
    var sat = wdate(w.date); sat.setDate(sat.getDate()+6);
    if(sat >= cut && sat <= T) t += r.pay || 0;
  });
  return t;
}

function build(weeks,key,name){
  var T = today();
  var cur = weeks.filter(function(w){
    var s = wdate(w.date), e = new Date(s); e.setDate(e.getDate()+6);
    return T>=s && T<=e;
  })[0] || weeks[weeks.length-1];
  var row = cur ? cur[key] : null;

  var days = (row ? row.days : [0,0,0,0,0,0,0]).map(function(d,i){
    var st = dayState(cur.date,i,d);
    var dt = wdate(cur.date); dt.setDate(dt.getDate()+i);
    var isToday = dt.getTime()===T.getTime();
    return {
      lbl:DAY_LBL[i].charAt(0), num:dt.getDate(), sym:SYM[st],
      bg:P[st].bg, fg:P[st].fg, numFg:P[st].num,
      lblFg: isToday ? '#E4572E' : '#6B5D48',
      border: isToday ? '4px solid #E4572E' : '2.5px solid #1A1712',
      shadow: isToday ? '0 0 0 2.5px #1A1712' : 'none',
      anim: isToday ? 'todayBob 2.4s ease-in-out infinite' : 'none',
      tag: isToday ? 'TODAY' : ''
    };
  });
  var tst = trashState(cur.date, row ? row.trash : false);
  var trash = { sym:SYM[tst], bg:P[tst].bg, fg:P[tst].fg };

  var wDone=0, wTot=0;
  days.forEach(function(d){ if(d.sym===SYM.done){wDone++;wTot++;} else if(d.sym===SYM.missed){wTot++;} });
  if(tst==='done'){wDone++;wTot++;} else if(tst==='missed'){wTot++;}
  var pct = wTot ? wDone/wTot : 0;

  var aDone=0, aTot=0;
  weeks.forEach(function(w){
    var r = w[key]; if(emptyRow(r)) return;
    r.days.forEach(function(d,i){
      var dt = wdate(w.date); dt.setDate(dt.getDate()+i);
      if(dt > T || d==='excused') return;
      if(dt.getTime()===T.getTime() && beforeNoon()) return;
      aTot++; if(d===true) aDone++;
    });
    var sat = wdate(w.date); sat.setDate(sat.getDate()+6);
    if(sat <= T && r.trash!=='excused'){ aTot++; if(r.trash===true) aDone++; }
  });

  var streak = streakOf(weeks,key);
  var tier = streak>=25?4:streak>=15?3:streak>=10?2:streak>=5?1:0;
  var next = null;
  for(var i=0;i<TIERS.length;i++){ if(TIERS[i] > streak){ next = TIERS[i]; break; } }
  var tierLine = next ? (next-streak)+' more day'+((next-streak)===1?'':'s')+' to level '+(TIERS.indexOf(next)+1) : 'Top level reached';

  var o = owedOf(weeks,key), owed = o.amount, debt = owed<0, m = debt ? P.debt : P.money;

  var extras=[];
  weeks.forEach(function(w){
    w.extras.forEach(function(e){
      if(e.player!==key) return;
      extras.push({ date: fmt(e.date||w.date), note: e.note||'Adjustment',
        amtLabel:(e.amt>0?'+$':'\u2212$')+Math.abs(e.amt).toFixed(2), color: e.amt>0?P.pos:P.neg });
    });
  });
  extras.reverse();

  var history = weeks.filter(function(w){ return w[key] && !emptyRow(w[key]) && w!==cur; }).reverse().map(function(w){
    var r = w[key];
    var cells = [{ bg: r.trash===true?P.done.bg : r.trash==='excused'?P.excused.bg : P.missed.bg }]
      .concat(r.days.map(function(d){ return { bg: d===true?P.done.bg : d==='excused'?P.excused.bg : P.missed.bg }; }));
    return { date: fmt(w.date), payLabel:'$'+r.pay.toFixed(2), cells:cells };
  });

  var ci = weeks.indexOf(cur), lw = ci>0 ? weeks[ci-1] : null, lr = lw ? lw[key] : null;
  var report=[], rTot=0;
  if(lr){
    var bedDays = lr.days.filter(function(d){ return d===true; }).length;
    var avail = lr.days.filter(function(d){ return d!=='excused'; }).length;
    report.push({ label:'Bed made ('+bedDays+' of '+avail+' days)', valLabel:'+$'+(bedDays*BED_RATE).toFixed(2), color: bedDays?P.pos:P.muted });
    report.push({ label: lr.trash==='excused' ? 'Trash and Recycling (skipped)' : 'Trash and Recycling',
      valLabel: lr.trash===true ? '+$'+TRASH_RATE.toFixed(2) : '$0.00', color: lr.trash===true?P.pos:P.muted });
    rTot = bedDays*BED_RATE + (lr.trash===true?TRASH_RATE:0);
    lw.extras.forEach(function(e){
      if(e.player!==key) return;
      report.push({ label:e.note||'Bonus', valLabel:(e.amt>0?'+$':'\u2212$')+Math.abs(e.amt).toFixed(2), color:e.amt>0?P.pos:P.neg });
      rTot += e.amt;
    });
  }

  return {
    name:name, deg: Math.round(pct*360)+'deg',
    weekPctLabel: Math.round(pct*100)+'%', weekBarW: Math.round(pct*100)+'%',
    weekDoneLabel: wDone+' of '+wTot+' chores done',
    days:days, trash:trash,
    streak:streak,
    streakLine: streak===1 ? 'day in a row' : streak ? 'days in a row' : 'Make your bed to start one',
    streakColor: P.streak[tier], tierLine:tierLine, tierColor: next ? '#E4572E' : '#0F6B47',
    completionLabel: Math.round((aTot ? aDone/aTot : 0)*100)+'%',
    owedLead: debt ? 'You owe' : 'Saved up',
    owedLabel: (debt?'\u2212$':'$')+Math.abs(owed).toFixed(2),
    moneyIcon: debt ? '\ud83d\udcb8' : '\ud83d\udcb0',
    hasArt: !debt && !!MONEY_ART,
    moneyBg:m.bg, moneyFg:m.fg, moneyLbl:m.lbl,
    extras:extras, monthLabel:'$'+monthOf(weeks,key).toFixed(2),
    history:history, report:report, reportTotal:'$'+rTot.toFixed(2)
  };
}

// ─── render ───────────────────────────────────────────────────────────────
function render(){
  var app = document.getElementById('app');
  if(!S.weeks){
    app.innerHTML = '<div class="sub" style="padding:40px 0;text-align:center">Loading\u2026</div>';
    return;
  }
  var players = PLAYERS.map(function(pp){ return build(S.weeks, pp[0], pp[1]); });
  var p = players[S.tab] || players[0];
  var cur = S.weeks.filter(function(w){
    var s = wdate(w.date), e = new Date(s); e.setDate(e.getDate()+6);
    var T = today(); return T>=s && T<=e;
  })[0] || S.weeks[S.weeks.length-1];

  var freshness = S.loading ? 'checking sheet\u2026' : S.sample ? 'example data' : ago(S.fetchedAt);

  var h = '';
  h += '<div class="hdr"><div><div class="title">Chore Quest</div>'
     + '<div class="sub">Week of '+fmt(cur.date)+' \u00b7 '+freshness+'</div></div>'
     + '<button class="refresh" id="reload">'+(S.loading?'\u22ef':'\u21bb')+'</button></div>';

  h += '<div class="tabs">' + players.map(function(pl,i){
    var on = i===S.tab;
    var bg = on ? '#FFD166' : '#fff', fg = on ? '#1A1712' : '#6B5D48', sh = on ? '3px 3px 0 #1A1712' : 'none';
    return '<button class="tab" data-tab="'+i+'" style="background:'+bg+';color:'+fg+';box-shadow:'+sh+'">'
      + '<span class="ring" style="background:conic-gradient(#E4572E '+pl.deg+', #E3D9C6 0)"><i style="background:'+bg+'"></i></span>'
      + esc(pl.name) + '</button>';
  }).join('') + '</div>';

  h += '<div class="money" style="background:'+p.moneyBg+'">'
     + (p.hasArt ? '<img src="'+MONEY_ART+'" alt="">' : '')
     + '<div class="txt">'
     + '<div style="font-size:14px;font-weight:600;color:'+p.moneyLbl+'">'+p.owedLead+'</div>'
     + '<div style="font-size:42px;font-weight:700;line-height:1.1;color:'+p.moneyFg+'">'+p.owedLabel+'</div>'
     + '</div>'
     + (p.hasArt ? '' : '<span style="margin-left:auto;font-size:36px;position:relative">'+p.moneyIcon+'</span>')
     + '</div>';

  h += '<div class="hero"><h2>This week</h2>'
     + '<div style="display:flex;align-items:flex-end;gap:10px;margin:6px 0 14px">'
     + '<span class="big">'+p.weekPctLabel+'</span>'
     + '<span style="font-size:15px;font-family:Nunito,sans-serif;font-weight:700;padding-bottom:8px">'+p.weekDoneLabel+'</span></div>'
     + '<div class="bar"><i style="width:'+p.weekBarW+'"></i></div></div>';

  h += '<div class="grid">' + p.days.map(function(d){
    return '<div class="day"><span class="l" style="color:'+d.lblFg+'">'+d.lbl+'</span>'
      + '<div class="tile" style="background:'+d.bg+';border:'+d.border+';box-shadow:'+d.shadow+';animation:'+d.anim+'">'
      + '<span class="n" style="color:'+d.numFg+'">'+d.num+'</span>'
      + '<span class="s" style="color:'+d.fg+'">'+d.sym+'</span></div>'
      + '<span class="t">'+d.tag+'</span></div>';
  }).join('') + '</div>';

  h += '<div class="row" style="background:'+p.trash.bg+'"><span style="font-size:18px">\ud83d\uddd1\ufe0f</span>'
     + '<span style="font-size:15px;font-weight:600;color:'+p.trash.fg+'">Trash and Recycling</span>'
     + '<span style="margin-left:auto;font-size:18px;font-weight:700;color:'+p.trash.fg+'">'+p.trash.sym+'</span></div>';

  h += '<div class="legend">'
     + [['done','Done'],['missed','Missed'],['pend','Not yet'],['excused','Excused \u2014 doesn\u2019t count']].map(function(l){
         var c = P[l[0]];
         return '<span><b style="background:'+c.bg+';color:'+(l[0]==='pend'?'#5C503C':c.fg)+'">'+SYM[l[0]]+'</b>'+l[1]+'</span>';
       }).join('') + '</div>';

  h += '<div class="two"><div class="card"><span class="k">Streak</span>'
     + '<div style="display:flex;align-items:center;gap:8px;margin-top:2px">'
     + '<span style="font-size:24px;animation:pulseGlow 1.4s ease-in-out infinite">\ud83d\udd25</span>'
     + '<span style="font-size:32px;font-weight:700;line-height:1;color:'+p.streakColor+'">'+p.streak+'</span></div>'
     + '<span class="d">'+p.streakLine+'</span>'
     + '<span style="font-size:12px;font-family:Nunito,sans-serif;font-weight:800;margin-top:6px;color:'+p.tierColor+'">'+p.tierLine+'</span></div>'
     + '<div class="card"><span class="k">All-time</span><div class="v">'+p.completionLabel+'</div>'
     + '<span class="d">of chores done</span></div></div>';

  h += '<div class="strip"><span style="font-size:14px;font-family:Nunito,sans-serif;font-weight:700;color:#6B5D48">Earned in the last 30 days</span>'
     + '<span style="font-size:22px;font-weight:700;color:#0F6B47">'+p.monthLabel+'</span></div>';

  if(p.extras.length){
    h += '<div style="margin-bottom:16px"><span style="font-size:14px;font-weight:600;color:#8A7B62">Extras</span>'
       + '<div style="display:flex;flex-direction:column;gap:7px;margin-top:8px">'
       + p.extras.map(function(x){
           return '<div class="extra"><span style="font-size:12px;color:#8A7B62;min-width:48px">'+esc(x.date)+'</span>'
             + '<span style="font-size:13px;flex:1">'+esc(x.note)+'</span>'
             + '<span style="font-size:14px;color:'+x.color+'">'+x.amtLabel+'</span></div>';
         }).join('') + '</div></div>';
  }

  h += '<button class="more" id="moreBtn">'+(S.more ? 'Hide history \u25b2' : 'More: history &amp; last week \u25bc')+'</button>';

  if(S.more){
    h += '<div style="display:flex;flex-direction:column;gap:14px;margin-top:16px">';
    h += '<div class="panel"><span class="k">Last week\u2019s report</span>'
       + '<div style="display:flex;flex-direction:column;gap:8px;margin:10px 0">'
       + p.report.map(function(r){
           return '<div class="line"><span style="color:#6B5D48">'+esc(r.label)+'</span><span style="color:'+r.color+'">'+r.valLabel+'</span></div>';
         }).join('')
       + '</div><div style="display:flex;justify-content:space-between;border-top:2px solid #E3D9C6;padding-top:10px">'
       + '<span style="font-size:14px;font-weight:600">Total</span>'
       + '<span style="font-size:19px;font-weight:700;color:#0F6B47">'+p.reportTotal+'</span></div></div>';
    h += '<div class="panel"><span class="k">Week by week</span>'
       + '<div style="display:flex;flex-direction:column;gap:9px;margin-top:10px">'
       + p.history.map(function(hh){
           return '<div class="hrow"><span class="dt">'+esc(hh.date)+'</span><div class="cells">'
             + hh.cells.map(function(c){ return '<i style="background:'+c.bg+'"></i>'; }).join('')
             + '</div><span style="font-size:12px;font-family:Nunito,sans-serif;font-weight:700;color:#6B5D48">'+hh.payLabel+'</span></div>';
         }).join('') + '</div></div>';
    h += '</div>';
  }

  if(S.sample) h += '<div class="warn">Can\u2019t reach the sheet and nothing saved yet \u2014 showing example numbers.</div>';

  app.innerHTML = h;

  document.getElementById('reload').onclick = load;
  document.getElementById('moreBtn').onclick = function(){ S.more = !S.more; render(); };
  Array.prototype.forEach.call(document.querySelectorAll('[data-tab]'), function(b){
    b.onclick = function(){
      S.tab = parseInt(b.getAttribute('data-tab'),10);
      try{ localStorage.setItem(TAB_KEY, S.tab); }catch(e){}
      render();
    };
  });
}

// ─── load ─────────────────────────────────────────────────────────────────
function load(){
  S.loading = true; render();
  fetch('https://docs.google.com/spreadsheets/d/'+SHEET_ID+'/export?format=csv&t='+Date.now())
    .then(function(res){ if(!res.ok) throw new Error('http'); return res.text(); })
    .then(function(text){
      var weeks = parseSheet(parseCSV(text));
      if(!weeks.length) throw new Error('empty');
      S.weeks = weeks; S.sample = false; S.fetchedAt = Date.now(); S.loading = false;
      try{ localStorage.setItem(CACHE_KEY, JSON.stringify({ weeks:weeks, ts:S.fetchedAt })); }catch(e){}
      render();
    })
    .catch(function(){
      S.loading = false;
      if(!S.weeks){ S.weeks = []; S.sample = true; }
      render();
    });
}

try{
  var raw = localStorage.getItem(CACHE_KEY);
  if(raw){
    var c = JSON.parse(raw);
    if(c && c.weeks && c.weeks.length){ S.weeks = c.weeks; S.fetchedAt = c.ts; }
  }
}catch(e){}

render();
load();

document.addEventListener('visibilitychange', function(){
  if(!document.hidden && S.fetchedAt && Date.now()-S.fetchedAt > 120000) load();
});

if('serviceWorker' in navigator){
  window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}
</script>
</body>
</html>
